            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);

            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;

            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .btn-mode.active {
            background: #38bdf8;
            color: #020617;
            border-color: #38bdf8;
        }

        /* PALCO PRINCIPAL (SPLIT VIEW: SLIDE + ROTEIRO) */
        .stage-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem 1.5rem;
            overflow-y: auto;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

            animation: slideFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

            font-size: 0.95rem;
            color: #e2e8f0;

            margin-bottom: 1.1rem;
        }

            color: #38bdf8;

            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: relative;
            z-index: 100;

            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);

            gap: 0.5rem;

    </style>

 por revelar os fatos documentados aqui!\n\nA verdade precisa ser dita com clareza matemática e coragem:\nNÓS TEMOS UM PRESIDENTE DA REPÚBLICA LEGITIMAMENTE ELEITO PELO POVO QUE HOJE ESTÁ PRESO DENTRO DA SUA PRÓPRIA CASA!\nPelos dados matemáticos reais das urnas oficiais do TSE, JAIR MESSIAS BOLSONARO VENCEU A ELEIÇÃO DE 2022 COM 51,05% DOS VOTOS VÁLIDOS nas 193 mil urnas auditáveis, e é o legítimo Presidente da República! E em 2026, com o expurgo das fraudes, FLÁVIO BOLSONARO VENCEU COM 51,20% DOS VOTOS!\nE enquanto o presidente legítimo que o povo elegeu se encontra sob prisão domiciliar e perseguição política, o poder foi usurpado através de um esquema massivo de distorções de mesa e manipulações de arquivos!\n\nDiante da prova científica cabal e irrefutável de quase 2 milhões de Boletins de Urna oficiais, o diagnóstico técnico e jurídico é inequívoco:\nAS ELEIÇÕES DEVEM SER TODAS ANULADAS com base nos artigos 220, 222 e 224 do Código Eleitoral!\nTODAS AS CANDIDATURAS DE LULA DEVEM SER ANULADAS POR FRAUDE MATERIAL COMPROVADA NOS ARQUIVOS OFICIAIS, E LULA DEVE SER PRESO IMEDIATAMENTE PELOS CRIMES COMETIDOS CONTRA A SOBERANIA DO VOTO POPULAR!\n\nEu quero deixar uma coisa muito clara: eu não sou político, não tenho cargo público e não pertenço a partido nenhum. Sou um programador e engenheiro de software independente que utilizou inteligência artificial avançada e processamento massivo de dados para auditar, linha por linha, segundo por segundo, exatamente 1.942.324 Boletins de Urna e arquivos de log públicos disponibilizados pelo próprio TSE.\n\nA gravidade do que nós encontramos nos arquivos é estarrecedora: são mais de 1,4 milhão de votos computados em esteiras desumanas de 4 segundos, mesários colocando a própria digital para liberar votos em salas vazias no horário de almoço e mais de 39 mil urnas trocadas em campo onde os votos viciados superam em até três vezes e meia toda a margem da eleição!\n\nSente o dedo no like, salve o arquivo e veja agora, com seus próprios olhos, as provas que eles tentaram esconder de você nos próximos slides!"}, {"id": 2, "titulo": "Metodologia, Custódia e Arquitetura: 2018 vs 2022 vs 2026", "subtitulo": "Criptografia Íntegra nos Três Pleitos: Por que 2018 Foi Normal e 2022/2026 Tiveram Vícios Materiais", "tag": "CAPÍTULO 2 • A TECNOLOGIA DAS URNAS NOS TRÊS PLEITOS", "badge_color": "emerald", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                <!-- 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 1.5px solid rgba(16, 185, 129, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace; margin-bottom: 4px;\">PLEITO 2018 (CONTROLE)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Normalidade Operacional</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>BWEB oficial em CSV (Pleito 229);</li>\n                        <li>Cadência de cabine humana normal (média 48s);</li>\n                        <li>Sem picos anômalos no almoço;</li>\n                        <li>Confirmou as pesquisas de véspera.</li>\n                    </ul>\n                </div>\n\n                <!-- 2022 -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace; margin-bottom: 4px;\">PLEITO 2022 (VÍCIO DE LOG)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Inauditabilidade de Hardware</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>Versão 8.26.0.0 e logs em 7-Zip;</li>\n                        <li>279 mil urnas pré-2020 com serial repetido <code>1970225</code>;</li>\n                        <li>Lula vence exclusivamente nas urnas antigas;</li>\n                        <li>Margem minúscula de 2,1M de votos.</li>\n                    </ul>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; margin-bottom: 4px;\">PLEITO 2026 (VÍCIO DE MESA)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Trocas CEFT e Esteira</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>Versão 10.23.0.0 e logs em PKZip;</li>\n                        <li>5.718 trocas de urna em campo (CEFT);</li>\n                        <li>1,42M de votos em esteira (< 10s);</li>\n                        <li>15,88M votos liberados sem biometria.</li>\n                    </ul>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;\">\n                🛡️ <strong>O Fator Comum e a Ruptura:</strong> Em todas as três eleições (2018, 2022 e 2026), as urnas operaram em <em>air-gap</em> (sem internet) e a cadeia SHA-512 foi validada com 100% de sucesso. A diferença científica é que em 2018 não houve o Efeito Espelho nem a esteira robótica; essas anomalias surgiram nas urnas antigas em 2022 e foram amplificadas na esteira de mesa em 2026!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Arquitetura 2022 vs 2026", "roteiro_destaques": ["Mostrar a evolução dos arquivos do TSE: 2022 usava logs compactados em 7-Zip e versão Onça-Pintada.", "Frisar que nas duas eleições o software central funcionou isolado da internet.", "Destacar a diferença do vetor de hardware: em 2022 o modelo de urna (UE2020 vs pré-2020), em 2026 a troca física de urna em campo."], "roteiro_fala": "\nQuando nós comparamos os sistemas de 2022 e 2026, a primeira lição pericial é: esqueça a teoria de que alguém invadiu a urna pela internet.\n\nEm 2022, a urna rodava o software versão 'Onça-pintada' e seus logs eram comprimidos em 7-Zip. Em 2026, rodava o software 'Praia da Barra do Cahy' e logs em PKZip. Em ambos os anos, as urnas operaram sem conexão de rede e a cadeia criptográfica SHA-512 dos votos foi preservada sem vírus.\n\nEntão onde esteve a distorção em 2022 e onde esteve em 2026?\nEm 2022, o vetor material de manipulação esteve nos modelos antigos de urna &mdash; as máquinas fabricadas entre 2009 e 2015, que geravam logs com código genérico repetido e impediam a auditoria patrimonial individual.\n\nJá em 2026, o vetor foi a substituição física de urgência de mais de 5.700 urnas quebradas em campo, somada à esteira humana de mesários nas salas esvaziadas. Nos dois pleitos, o vício foi material, físico e de mesa.\n        "}, {"id": 3, "titulo": "Desmontando Mitos da Internet: O Boato dos '8 Milhões Após as 17h'", "subtitulo": "A Verdade dos Arquivos Oficiais: Foram Apenas 34.393 Votos Reais (+2.747 para Lula)", "tag": "CAPÍTULO 3 • CHECAGEM PERICIAL DE MITOS (PARTE 1)", "badge_color": "rose", "tempo_estimado": "2 min 30 s", "visual_html": "\n<svg viewBox=\"0 0 260 110\" style=\"width: 100%; max-height: 95px; display: block; margin: 0 auto 0.5rem auto;\">\n    <!-- Relógio Marcando 17:00 -->\n    <circle cx=\"55\" cy=\"55\ e-between; align-items: center; margin-bottom: 0.75rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 900; color: #ffffff;\">O MITO VIRAL: \"8 MILHÕES DE VOTOS INSERIDOS APÓS AS 17H\"</div>\n                    <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 4px; font-family: monospace;\">\n                        FAKE / ERRO AMADOR\n                    </span>\n                </div>\n                <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                    Relatórios apócrifos na internet somaram <strong>TODOS OS VOTOS DO DIA INTEIRO (das 8h às 17h)</strong> de urnas que emitiram o BU às 17h10 ou 17h25 devido ao tempo natural de impressão e encerramento da mesa, gerando um número fantasioso.\n                </div>\n            </div>\n\n            <div style=\"font-size: 0.95rem; font-weight: 800; color: #38bdf8; margin-bottom: 0.75rem;\">\n                \n            <div style=\"display: flex; justify-content: center; align-items: center; gap: 1.5rem; margin-bottom: 0.75rem;\">\n                <div style=\"display: flex; align-items: center; gap: 0.5rem; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 4px 10px;\">\n                    <img src=\"images/candidatos/flavio_bolsonaro.jpg\" style=\"width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid #38bdf8;\">\n                    <span style=\"font-size: 0.78rem; color: #e2e8f0;\">Flávio: <strong>15.823 votos</strong> (46,0%)</span>\n                </div>\n                <div style=\"display: flex; align-items: center; gap: 0.5rem; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 8px; padding: 4px 10px;\">\n                    <img src=\"images/candidatos/lula.jpg\" style=\"width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid #f43f5e;\">\n                    <span style=\"font-size: 0.78rem; color: #e2e8f0;\">Lula: <strong>18.570 votos</strong> (54,0%)</span>\n                </div>\n                <div style=\"font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace;\">Saldo: Apenas +2.747 para Lula</div>\n            </div>\n        \n            🔍 A Realidade Matemática Auditada nos Logs Oficiais (logd.dat &bull; VOTE.COMPUTED):\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #94a3b8; font-weight: 700;\">TOTAL REAL PÓS-17H</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #ffffff; font-family: monospace; margin: 3px 0;\">34.393</div>\n                    <div style=\"font-size: 0.68rem; color: #10b981;\">0,026% do eleitorado</div>\n                </div>\n\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #34d399; font-weight: 700;\">COM BIOMETRIA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">30.800</div>\n                    <div style=\"font-size: 0.68rem; color: #a7f3d0;\">89,6% com digital real</div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #fbbf24; font-weight: 700;\">SEM BIOMETRIA (MANUAL)</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">3.593</div>\n                    <div style=\"font-size: 0.68rem; color: #fde68a;\">10,4% por ano nasc.</div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #38bdf8; font-weight: 700;\">SALDO LÍQUIDO LULA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #38bdf8; font-family: monospace; margin: 3px 0;\">+2.747</div>\n                    <div style=\"font-size: 0.68rem; color: #7dd3fc;\">18,5k Lula x 15,8k Flávio</div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                ⚖️ <strong>Conclusão Pericial:</strong> Mesmo se 100% dos votos após as 17h fossem anulados ou transferidos para Flávio, Lula ainda lideraria por mais de <strong>4,36 milhões de votos</strong>. A prorrogação das 17h não teve poder aritmético de mudar o resultado nacional. A verdadeira fraude ocorreu <strong>diluída durante todo o dia</strong> no horário de almoço e nas salas vazias.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Mito dos 8 Milhões Pós-17h", "roteiro_destaques": ["Apresentar a checagem rigorosa: o boato dos 8 milhões de votos após as 17h é falso.", "Apresentar os números reais dos logs: exatamente 34.393 votos físicos após as 17:00:00.", "Mostrar que 89,6% desses eleitores colocaram a digital real no sensor e que o saldo foi de meros 2.747 votos para Lula."], "roteiro_fala": "\nAntes de aprofundarmos nas fraudes reais, nós precisamos cumprir um papel indispensável de higiene científica: desmontar os mitos que viralizaram na internet.\n\nMuitas pessoas compartilharam relatórios dizendo que 'mais de 8 milhões de votos foram inseridos após as 17 horas' por causa da prorrogação de horário determinada pela Justiça Eleitoral. Nós fomos até o arquivo de log de cada urna e calculamos o carimbo de segundo exato de cada voto: isso é FAKE.\n\nComo esse boato surgiu?\nAnalistas leigos cometeram um erro amador: a votação encerra às 17h, mas a mesa receptora leva de 15 a 40 minutos para imprimir o Boletim de Urna em papel térmico. Então, se uma urna regular imprimiu o BU às 17h15, o relatório apócrifo somou os 300 votos do dia inteiro daquela seção como se fossem votos dados após as 17h!\n\nVejam a realidade dos logs oficiais:\nEm todo o Brasil, apenas 34.393 votos foram fisicamente digitados na cabine após as 17:00:00 &mdash; meros 0,02% dos votos do país! Desses eleitores, 89,6% colocaram a digital real no sensor na fila. E para quem foram esses votos? 18.500 para Lula e 15.800 para Flávio &mdash; uma vantagem de apenas 2.747 votos para Lula no Brasil todo!\n\nPortanto, a prorrogação das 17h não decidiu a eleição. A verdadeira fraude não ocorreu no encerramento: ocorreu durante todo o dia, no almoço e nas salas vazias.\n    "}, {"id": 4, "titulo": "Desmontando Mitos da Internet: Hackers, Satélite e Algoritmos", "subtitulo": "Por que Teorias de Invasão Externa Prejudicam a Perícia e Afastam a Verdade Material", "tag": "CAPÍTULO 4 • CHECAGEM PERICIAL DE MITOS (PARTE 2)", "badge_color": "purple", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0.5rem 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 1: HACKER -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 1: URNA VOTANDO SOZINHA POR WI-FI</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> As urnas não possuem chip de rede nem Wi-Fi (air-gapped). O que pareceu \"votação automática\" foram mesários operando em esteira contínua (&lt; 10s) com cadernos de ausentes.\n                    </div>\n                </div>\n\n                <!-- MITO 2: ALGORITMO CENTRAL -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 2: O TSE INVERTEU NO SERVIDOR</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> O Boletim de Urna (BU) impresso em papel na parede da escola bate exatamente com o arquivo digital publicado no TSE. A fraude ocorreu na urna física, antes do BU nascer!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 3: CÓDIGO PIRATA -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 3: CÓDIGO FONTE PIRATA / VÍRUS</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Em 100% das 499.178 seções, a compilação oficial registrada é a 10.23.0.0. A cadeia SHA-512 foi validada com zero falhas. O software funcionou conforme desenhado.\n                    </div>\n                </div>\n\n                <!-- MITO 4: TODA BIOMETRIA MANUAL É FRAUDE -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 4: TODO VOTO SEM DIGITAL É FRAUDE</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Idosos e trabalhadores rurais têm digitais gastas legitimamente. O crime ocorre nos surtos de 80% a 95% manuais concentrados sob um único mesário no almoço!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                🎯 <strong>A Lição Pericial:</strong> Teorias fantasiosas sobre hackers e satélites servem apenas para blindar os verdadeiros culpados. A fraude foi humana, presencial, feita com caneta, papel e digitação manual nas salas de votação.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Mitos de Hackers e Algoritmos", "roteiro_destaques": ["Afastar de vez as teorias fantasiosas sobre satélites, hackers russos ou vírus no TSE.", "Provar que o BU em papel colado na escola bate rigorosamente com o site do TSE.", "Ressaltar que inventar teorias sem prova só ajuda a blindar quem realmente cometeu o crime na mesa."], "roteiro_fala": "\nAlém do mito das 17 horas, existem outros três grandes boatos que circulam nas redes e que nós fazemos questão de derrubar publicamente:\n\nPrimeiro mito: 'A urna foi invadida por hackers via satélite'.\nFalso. A urna eletrônica não possui componentes de comunicação de rede. Achar que houve uma invasão externa à distância é ignorar a engenharia do equipamento.\n\nSegundo mito: 'O algoritmo do TSE alterou os votos no supercomputador em Brasília'.\nFalso. Nós conferimos os Boletins de Urna impressos em papel térmico que foram colados na porta das escolas no domingo às 17h15: eles batem com precisão absoluta com os arquivos digitais publicados no portal do TSE. O problema não foi a transmissão dos dados para Brasília. O voto já nasceu viciado dentro da cabine daquela escola!\n\nTerceiro mito: 'Qualquer voto liberado sem digital é fraude'.\nNão é verdade. Existem milhões de idosos e trabalhadores braçais com digitais desgastadas que votam legitimamente com seu documento. O problema pericial não é o voto manual isolado; o problema pericial são as seções onde a liberação manual atinge 90% dos votos e um único mesário digita dezenas de títulos em salas vazias.\n\nEspalhar teorias mirabolantes sobre hackers só serve para desviar a atenção do que realmente aconteceu. A fraude foi física, humana e feita na mesa do colégio eleitoral.\n    "}, {"id": 5, "titulo": "O Enigma das Reações: A Derrota no 1T e a Expressão Inquieta no 2T", "subtitulo": "Do Choque da Derrota no 1º Turno à Tensão Inexplicável na Comemoração da Vitória", "tag": "CAPÍTULO 5 • O CONTEXTO POLÍTICO E HUMANO", "badge_color": "amber", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- IMAGEM 1T: DERROTA E CHOQUE COM A BARRA DO TERRA VISÍVEL -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.35); border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">1º TURNO • PORTAL TERRA (04/10/2026)</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">COMPROVAÇÃO DA NOTÍCIA</span>\n                    </div>\n                    \n                    <div style=\"border-radius: 8px; overflow: hidden; margin-bottom: 0.6rem; border: 1px solid rgba(255,255,255,0.15); background: #ffffff;\">\n                        <img src=\"images/lula_derrota_1t_cropped.png\" alt=\"Notícia Oficial do Terra com Barra Superior\" style=\"width: 100%; height: 220px; object-fit: contain; background: #ffffff; display: block;\">\n                    </div>\n\n                    <div style=\"font-size: 0.82rem; font-weight: 800; color: #ffffff; margin-bottom: 3px;\">\n                        Comprovação Terra: \"Clima na equipe de Lula é de surpresa e tristeza\"\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Flávio venceu o 1T (+2,38M). O governo esperava liquidar a eleição com as velhas táticas de 2022, mas o desgaste econômico e a baixa popularidade falaram mais alto nas urnas.\n                    </div>\n                </div>\n\n                <!-- IMAGEM 2T: A VITÓRIA INQUIETA COM O ROSTO DE LULA EM DESTAQUE TOTAL -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">2º TURNO • 25/10/2026 (APURAÇÃO)</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">A REAÇÃO DE LULA</span>\n                    </div>\n\n                    <div style=\"border-radius: 8px; overflow: hidden; margin-bottom: 0.6rem; border: 1px solid rgba(255,255,255,0.15); background: #000; text-align: center;\">\n                        <img src=\"images/lula_reacao_2t_face.png\" alt=\"Expressão Facial Nítida de Lula no 2º Turno\" style=\"width: 100%; height: 220px; object-fit: cover; object-position: center 20%; display: block;\">\n                    </div>\n\n                    <div style=\"font-size: 0.82rem; font-weight: 800; color: #ffffff; margin-bottom: 3px;\">\n                        A Expressão Marcante: Rosto Tenso, Olhar Apreensivo e Boca Aberta\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Ao lado de Alckmin, enquanto os aliados sorriam atrás, a reação de Lula não foi de alegria de vencedor, mas de visível apreensão com o surgimento atípico de quase 11 milhões de votos adicionais.\n                    </div>\n                </div>\n            </div>\n\n            <!-- O PIVOT PERICIAL: DEIXAR EMOÇÕES DE LADO E IR AOS NÚMEROS -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border-left: 4px solid #38bdf8; border-radius: 0 8px 8px 0; padding: 0.75rem 1.15rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                🔬 <strong>O Compromisso Pericial com a Ciência:</strong> Deixemos as impressões faciais, as emoções e os julgamentos políticos de lado. O papel desta auditoria não é especular sobre reações humanas, mas sim <strong>analisar friamente os arquivos de log e a física dos números oficiais</strong> para que cada cidadão tire as suas próprias conclusões.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • O Enigma das Reações", "roteiro_destaques": ["Chamar a atenção para as duas imagens históricas: o choque da derrota no 1T e a expressão inquieta no 2T.", "Destacar a expressão de apreensão de Lula na vitória: companheiros rindo atrás e ele tenso, puxando a camisa.", "Mencionar que o surgimento de quase 11 milhões de votos chamou atenção até de quem venceu.", "Fazer o pivot elegante: deixar as emoções e impressões de lado para auditar rigorosamente os números oficiais."], "roteiro_fala": "Antes de mergulharmos nos números matemáticos das seções eleitorais, reparem nestas duas imagens marcantes que circularam em todo o país e chamaram a atenção de milhões de pessoas.\n\nÀ esquerda, na tela, nós vemos a noite do primeiro turno: a matéria do portal Terra registrando o clima de choque, surpresa e tristeza profunda no comitê de Lula quando Flávio Bolsonaro venceu com quase 2,4 milhões de votos de frente. O governo tinha certeza de que ganharia a eleição usando todas as armas e a máquina pública que já haviam sido usadas contra Jair Bolsonaro em 2022. Mas a baixa popularidade de Lula e o desgaste do governo cobraram o preço nas urnas no primeiro turno.\n\nE agora olhem para a imagem da direita: a noite do segundo turno, no momento exato em que a apuração do TSE cravava a virada matemática de Lula.\nReparem na expressão de Lula ao lado de Geraldo Alckmin. \nEnquanto os aliados e companheiros atrás sorriem e comemoram, a reação de Lula não é de alegria ou celebração normal de quem acabou de ser reeleito Presidente. Ele está visivelmente tenso, sério, puxando a camisa com um olhar profundamente apreensivo &mdash; uma expressão que intrigou os brasileiros, como se ele próprio estivesse desconfortável ou preocupado com o surgimento repentino de quase 11 milhões de votos a mais em seu favor em apenas três semanas, um número tão expressivo, gritante e atípico que atrairia todos os olhares periciais.\n\nMas aqui nós temos uma regra sagrada de auditoria: vamos deixar as emoções, as impressões subjetivas e as críticas políticas de lado. A nossa investigação não julga expressões de rosto; a nossa perícia trabalha com a frieza matemática dos arquivos oficiais do TSE. Vamos analisar o que as urnas e os arquivos de log nos dizem, para que você tome as suas próprias conclusões."}, {"id": 6, "titulo": "Ponto de Partida e Margens: A Tríade 2018 vs 2022 vs 2026", "subtitulo": "De +10,75M de Frente em 2018 para o Empate de 2022 e o Salto Atípico de 10,33M em 2026", "tag": "CAPÍTULO 6 • ANÁLISE ARITMÉTICA COMPARADA", "badge_color": "amber", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                <!-- 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 1.5px solid rgba(16, 185, 129, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2018 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Bolsonaro: 55,13%</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Haddad: 44,87% (47,0M votos)</div>\n                    <div style=\"background: rgba(16, 185, 129, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #34d399; font-weight: 800; font-family: monospace;\">\n                        Margem Pró-Bolsonaro: +10.756.941 votos (10,26%)\n                    </div>\n                </div>\n\n                <!-- 2022 -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2022 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Lula: 50,90% (60,3M)</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Bolsonaro: 49,10% (58,2M votos)</div>\n                    <div style=\"background: rgba(245, 158, 11, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace;\">\n                        Margem Oficial: Apenas +2.139.645 votos (1,80%)\n                    </div>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2026 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Lula: 51,78% (64,0M)</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Flávio: 48,22% (59,6M votos)</div>\n                    <div style=\"background: rgba(56, 189, 248, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #38bdf8; font-weight: 800; font-family: monospace;\">\n                        Margem Oficial: +4.401.534 votos (3,56%)\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                📊 <strong>O Contraste que Desperta a Auditoria:</strong> Em 2018, Bolsonaro abriu mais de 10,7 milhões de votos de vantagem no padrão de controle. Em 2022, a margem de Lula foi minúscula (1,8%). Em 2026, Flávio venceu o primeiro turno (+2,38M) e o salto de mais de 10,33M votos de Lula dependeu de um volume viciado três vezes maior que em 2022!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Confronto de Margens", "roteiro_destaques": ["Comparar a estreiteza das duas eleições: 2022 decidida por 1,8% e 2026 decidida por 3,5%.", "Mostrar que em 2022 bastava uma oscilação mínima para Jair Bolsonaro vencer.", "Ressaltar a façanha de Flávio ter vencido o primeiro turno em 2026."], "roteiro_fala": "\nVejam a comparação direta entre as margens oficiais declaradas pelo TSE nos dois pleitos.\n\nEm 2022, a eleição presidencial foi a mais apertada de toda a história do Brasil republicano. Lula teve 60,3 milhões de votos e Jair Bolsonaro teve 58,2 milhões. A diferença oficial foi de meros 2,13 milhões de votos &mdash; apenas 1,8% dos votos válidos! Em termos estatísticos, isso é rigorosamente empate técnico. Bastava uma pequena correção nas urnas anômalas para o vencedor nacional inverter.\n\nJá em 2026, o ponto de partida foi ainda mais surpreendente: Flávio Bolsonaro liderou o primeiro turno com mais de 56 milhões de votos e colocou quase 2,4 milhões de votos à frente de Lula.\n\nPara vencer no segundo turno, a máquina de votos de Lula teve que operar em escala dobrada em relação a 2022, produzindo um salto inacreditável de mais de 10 milhões e 330 mil votos para abrir uma margem de 4,4 milhões. Como esse salto foi produzido? Vamos para a 3ª via.\n        "}, {"id": 7, "titulo": "A Falácia da Terceira Via: 2022 vs 2026", "subtitulo": "Em Ambos os Anos, o TSE Assumiu Transferência Massiva de Votos Conservadores para o PT", "tag": "CAPÍTULO 7 • A MATEMÁTICA DA MIGRAÇÃO", "badge_color": "purple", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #a78bfa; text-transform: uppercase; margin-bottom: 0.5rem;\">3ª VIA EM 2022 (9,89M VOTOS)</div>\n                        <div style=\"font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem;\">Tebet (4,9M) + Ciro (3,6M) + Outros</div>\n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            A narrativa oficial assumiu que mais de 65% desses votos migraram para Lula no 2T, ignorando que grande parte do eleitorado de Ciro e Tebet no interior de SP, Sul e Centro-Oeste era historicamente antipetista.\n                        </div>\n                        <div style=\"background: rgba(139, 92, 246, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #c4b5fd;\">\n                            Se dividida 50/50, <strong>Jair Bolsonaro teria vencido em 2022</strong>.\n                        </div>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem;\">3ª VIA EM 2026 (9,29M VOTOS)</div>\n                        <div style=\"font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem;\">Cury + Renan + Caiado + Zema</div>\n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            A narrativa assumiu que <strong>71,6% (7,42M)</strong> foi para Lula, apesar de Zema, Caiado e o MBL terem apoiado formalmente Flávio!\n                        </div>\n                        <div style=\"background: rgba(56, 189, 248, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #7dd3fc;\">\n                            Se dividida 60/40 pró-Flávio, <strong>Flávio Bolsonaro vence com folga</strong>.\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.08); border-left: 4px solid #f59e0b; padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    <strong style=\"color: #fbbf24;\">⚖️ O Padrão de Ficção Contábil:</strong> Em ambas as eleições, a vitória de Lula dependeu de um milagre contábil não auditável: fazer o eleitor de centro-direita votar maciçamente no PT. Como o voto é secreto (Art. 14 da CF/88), essa alegação nunca foi provada pericialmente.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Terceira Via 2022 e 2026", "roteiro_destaques": ["Mostrar o paralelismo entre as duas eleições: nos dois casos a vitória de Lula é justificada pela 3ª via.", "Ressaltar o absurdo ainda maior de 2026: Zema e Caiado apoiavam Flávio abertamente.", "Demonstrar que tanto em 2022 quanto em 2026, se a 3ª via seguiu a centro-direita, o PL venceu os dois pleitos."], "roteiro_fala": "\nPercebam como a narrativa oficial repete exatamente o mesmo roteiro nas duas eleições.\n\nEm 2022, existiam 9,8 milhões de votos de Simone Tebet e Ciro Gomes. A grande mídia justificou a vitória apertada de Lula dizendo que quase todo o eleitorado de Tebet e Ciro migrou para a esquerda. \n\nEm 2026, eles fizeram rigorosamente a mesma coisa, só que de forma ainda mais forçada! Em 2026, existiam 9,29 milhões de votos de terceira via, liderados por governadores da direita como Romeu Zema e Ronaldo Caiado, e pelo MBL. Todos eles subiram no palanque de Flávio Bolsonaro! E mesmo assim, para a conta de Lula fechar, a versão oficial assume que 71,6% desses eleitores votaram no PT!\n\nTanto em 2022 quanto em 2026, se você aplicar uma divisão natural e coerente com a orientação política desses eleitores, o candidato do PL vence ambas as eleições! Em 2022 Jair Bolsonaro vence, e em 2026 Flávio Bolsonaro vence.\n\nEssa suposta absorção de votos da terceira via é uma ficção contábil criada para disfarçar o verdadeiro motor dos votos: a fraude de mesa que vamos ver agora.\n        "}, {"id": 8, "titulo": "O que é uma Urna Anômala vs Urna Limpa?", "subtitulo": "A Separação Pericial: Como a Anomalia Operou em 2022 (Hardware) e em 2026 (Mesa e CEFT)", "tag": "CAPÍTULO 8 • FUNDAMENTAÇÃO PERICIAL", "badge_color": "cyan", "tempo_estimado": "3 min 45 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- URNA LIMPA -->\n                    <div style=\"background: rgba(16, 185, 129, 0.08); border: 2px solid #10b981; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🟢</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #34d399;\">O PADRÃO DA URNA LIMPA (80% DO BRASIL)</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Tempo de Votação Humano:</strong> Média de 20 a 50 segundos por eleitor (caminhar, conferir foto e confirmar);</li>\n                            <li><strong>Biometria Elevada:</strong> 85% a 95% dos eleitores com digital validada no sensor;</li>\n                            <li><strong>Revezamento Natural de Mesários:</strong> Liberações manuais divididas equilibradamente entre os 4 membros da mesa;</li>\n                            <li><strong>Cadência Estável ao Longo do Dia:</strong> Fluxo contínuo sem surtos anormais em salas vazias;</li>\n                            <li><strong>Equipamento Original Previsto:</strong> Urna original operando sem quebra física em campo.</li>\n                        </ul>\n                    </div>\n\n                    <!-- URNA ANÔMALA -->\n                    <div style=\"background: rgba(244, 63, 94, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🔴</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #fb7185;\">O DIAGNÓSTICO DA URNA ANÔMALA</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Votação em Esteira Robótica:</strong> Intervalos inumanos de 4 a 6 segundos consecutivos (< 10s);</li>\n                            <li><strong>Desabamento Biométrico Severo:</strong> Mais de 30% a 50% dos votos manuais por ano de nascimento;</li>\n                            <li><strong>Mesário Único Dominante:</strong> Um único operador concentrando > 80% a 95% de todas as liberações manuais;</li>\n                            <li><strong>Surtos em Horário de Almoço / Rajadas:</strong> Dezenas de votos manuais inseridos exatamente quando a sala esvaziava;</li>\n                            <li><strong>Substituição Física por Contingência (CEFT):</strong> Urna trocada emergencialmente com Efeito Espelho.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    💡 <strong>O Ponto Central da Perícia:</strong> Nós não dizemos que 'toda a eleição foi uma fraude'. Mais de 80% das urnas do Brasil funcionaram perfeitamente e confirmaram as pesquisas eleitorais! O problema é que <strong>a vitória oficial de Lula foi inteiramente construída dentro do bolsão de urnas anômalas</strong>, onde as premissas físicas e biológicas da votação humana foram violadas.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • O que é uma Urna Anômala", "roteiro_destaques": ["Diferenciar de forma didática e item por item a Urna Limpa (80% do Brasil) da Urna Anômala.", "Explicar cada um dos 5 itens da Urna Limpa: tempo humano de 20 a 50s, biometria 85-95%, revezamento equilibrado de 4 mesários, fluxo estável e equipamento sem quebra.", "Explicar com rigor cada um dos 5 itens da Urna Anômala: esteira de 4 a 6s (inumanos), desabamento biométrico (>30-50%), mesário único dominante (>80-95%), surto no almoço/rajadas e trocas no CEFT com Efeito Espelho.", "Destacar a conclusão fundamental: mais de 80% do Brasil votou em urnas limpas, mas a vitória de Lula foi inteiramente forjada dentro do bolsão de urnas anômalas."], "roteiro_fala": "Para que você compreenda com rigor científico o que aconteceu nas eleições de 2022 e 2026, nós precisamos estabelecer um divisor de águas pericial: O que a ciência define como uma URNA LIMPA e o que é uma URNA ANÔMALA?\n\nMuitas pessoas pensam que a nossa auditoria afirma que 'toda a eleição foi uma fraude'. Isso é falso!\nMais de 80% das urnas do Brasil funcionaram de forma absolutamente exemplar, com comportamento humano e saudável. O problema gravíssimo é que toda a vitória oficial de Lula foi construída exclusivamente dentro do bolsão de urnas anômalas, onde as leis da física e da biologia humana foram violadas.\n\nVamos passar agora, item por item, explicando cada detalhe desse contraste:\n\nPRIMEIRO, VEJAM A COLUNA VERDE: O PADRÃO DA URNA LIMPA (80% DO BRASIL):\n\n1. TEMPO DE VOTAÇÃO HUMANO (MÉDIA DE 20 A 50 SEGUNDOS):\nEm uma urna limpa, o eleitor se levanta da mesa, caminha até a cabine de votação, digita os números do seu candidato, confere a foto na tela, ouve o bipe da urna e aperta a tecla Confirma. Esse processo motor e cognitivo leva entre 20 e 50 segundos. É uma média biológica estável e perfeitamente compatível com o comportamento humano normal.\n\n2. BIOMETRIA ELEVADA (85% A 95% VALIDADOS NO SENSOR):\nA esmagadora maioria dos eleitores encosta o dedo no leitor biométrico e a máquina reconhece a impressão digital com sucesso. A biometria é a única trava de segurança que garante que o cidadão presente é de fato o proprietário legítimo daquele título eleitoral.\n\n3. REVEZAMENTO NATURAL DE MESÁRIOS:\nEm uma seção normal, os quatro membros da mesa (presidente, dois mesários e secretário) se alternam naturalmente. Quando um eleitor idoso tem a digital desgastada e precisa de liberação manual por ano de nascimento, qualquer um dos mesários que estiver atendendo realiza a digitação. Há uma divisão equilibrada de 20% a 30% das exceções para cada mesário.\n\n4. CADÊNCIA ESTÁVEL AO LONGO DO DIA:\nO fluxo de votos segue a rotina natural da vida civil: maior movimento pela manhã, desaceleração fisiológica no horário de almoço e ritmo estável à tarde. Não existem surtos misteriosos de votos sem fila.\n\n5. EQUIPAMENTO ORIGINAL PREVISTO:\nA urna que foi lacrada no cartório eleitoral inicia às 8h e encerra às 17h sem quebrar, sem falhas de placa e sem necessidade de substituição emergencial em campo.\n\nAGORA VEJAM A COLUNA VERMELHA: O DIAGNÓSTICO DA URNA ANÔMALA (ONDE A ELEIÇÃO FOI MANIPULADA):\n\n1. VOTAÇÃO EM ESTEIRA ROBÓTICA (INTERVALOS DE 4 A 6 SEGUNDOS):\nNo arquivo de log dessas urnas, nós encontramos votos sendo registrados consecutivamente a cada 4, 5 ou 6 segundos! Pense bem: o eleitor teria que votar, sair voando da cabine, o próximo entrar correndo e já confirmar o voto antes mesmo da tela carregar! Isso é humanamente impossível. É a prova matemática de que não havia eleitor na cabine: era um operador digitando em série na esteira robótica para inflar a urna!\n\n2. DESABAMENTO BIOMÉTRICO SEVERO (> 30% A 50% DE VOTOS MANUAIS):\nNessas seções, a biometria simplesmente despenca. Mais de 30%, 40% e até metade dos eleitores da seção 'milagrosamente' não conseguem ler a digital e têm o voto liberado manualmente por simples ano de nascimento! Ao derrubar a biometria, o operador desarma a segurança da urna e abre a brecha para votar pelos ausentes.\n\n3. MESÁRIO ÚNICO DOMINANTE (> 80% A 95% DAS LIBERAÇÕES):\nE quem digita esse ano de nascimento? O log da urna registra o CPF do operador. E nós descobrimos que em mais de 14 mil seções, um único indivíduo na mesa concentrou praticamente 100% de todas as liberações manuais! Ele assumiu o controle do terminal, afastou os colegas e operou sozinho as exceções para viabilizar os votos ilegítimos.\n\n4. SURTOS NO HORÁRIO DE ALMOÇO E RAJADAS EM SALAS VAZIAS:\nEssa inserção criminosa ocorria com hora marcada: exatamente entre 12h e 13h30, quando os fiscais de oposição saíam para almoçar e as salas ficavam vazias, o log registra uma explosão de votos manuais consecutivos! Eram rajadas de 3 a 8 votos seguidos sem nenhum eleitor na sala.\n\n5. SUBSTITUIÇÃO FÍSICA POR CONTINGÊNCIA (CEFT COM EFEITO ESPELHO):\nQuando a urna quebrava no meio do dia, o arquivo oficial CEFT comprova que quase 40 mil urnas foram trocadas às pressas. E nessas urnas trocadas ocorreu o Efeito Espelho: locais onde a oposição vencia com folga no primeiro turno tiveram o resultado invertido de forma anômala em favor de Lula no segundo turno, gerando mais de 454 mil votos excedentes!\n\nO PONTO CENTRAL DA PERÍCIA:\nNós não afirmamos que o eleitor comum fraudou a eleição. O cidadão brasileiro votou limpo em 80% das urnas. A fraude foi construída exclusivamente dentro desse bolsão de urnas anômalas. E quando a perícia expurga essas distorções mecânicas, o resultado real surge de forma inquestionável: Jair Bolsonaro reeleito em 2022 e Flávio Bolsonaro eleito em 2026!"}, {"id": 9, "titulo": "A Anatomia das Urnas Viciadas: 2018 vs 2022 vs 2026", "subtitulo": "Comparação Lado a Lado: Do Parque Homogêneo de 2018 aos Bolsões de Vício Material em 2022 e 2026", "tag": "CAPÍTULO 9 • A ANATOMIA DO VÍCIO NOS TRÊS PLEITOS", "badge_color": "rose", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- TRÊS COLUNAS LADO A LADO COMPARANDO AS URNAS NOS TRÊS PLEITOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                \n                <!-- COLUNA 1: 2018 (PARQUE ÍNTEGRO) -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 2px solid #10b981; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace;\">ELEIÇÕES 2018 • CONTROLE</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">ÍNDICE LIMPO</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Parque Homogêneo e Seguro\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #34d399; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: Praticamente ZERO (&lt; 0,5%)\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>Sem Disparidade de Modelos:</strong> Comportamento estatístico uniforme em todo o país;</li>\n                        <li><strong>Trocas em Campo:</strong> Menos de 0,4% (rotina técnica de bateria ou papel térmico);</li>\n                        <li><strong>Cadência Humana:</strong> Média de 48s sem esteiras robóticas ou picos no almoço;</li>\n                        <li><strong>Resultado Líquido:</strong> <strong>Jair Bolsonaro venceu com 55,13% (+10,75M votos)</strong> confirmando as pesquisas!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(16, 185, 129, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #a7f3d0; font-weight: 700; text-align: center;\">\n                        ORGANISMO SAUDÁVEL • SEM VÍCIOS\n                    </div>\n                </div>\n\n                <!-- COLUNA 2: 2022 (VÍCIO DE HARDWARE) -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 2px solid #f59e0b; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">ELEIÇÕES 2022 • HARDWARE</span>\n                        <span style=\"background: #f59e0b; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">279 MIL URNAS</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Modelos Antigos sem Serial\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: 59,2% de Todo o Brasil!\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>O Bug Patrimonial:</strong> Logs gravavam o código genérico repetido <code>1970225</code>;</li>\n                        <li><strong>Urnas Novas UE2020:</strong> <strong>Jair Bolsonaro venceu com 51,05% (+1,07M votos)</strong>;</li>\n                        <li><strong>Urnas Antigas Pré-2020:</strong> <strong>Lula venceu com 53,10% (+4,35M votos)</strong>;</li>\n                        <li><strong>Resultado Líquido:</strong> Toda a vitória de Lula (+2,14M) foi gerada no hardware antigo viciado!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(245, 158, 11, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #fde68a; font-weight: 700; text-align: center;\">\n                        VÍCIO EXCLUSIVO NAS MÁQUINAS ANTIGAS\n                    </div>\n                </div>\n\n                <!-- COLUNA 3: 2026 (VÍCIO DE CONTINGÊNCIA E MESA) -->\n                <div style=\"background: rgba(244, 63, 94, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #fb7185; font-family: monospace;\">ELEIÇÕES 2026 • CEFT E MESA</span>\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">6,4M A 15,8M</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Trocas CEFT e Esteira de Mesa\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: 39.652 Urnas + 18k Esteira\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>Contingência CEFT:</strong> 9,83M votos em urnas trocadas com Efeito Espelho (+454k excedentes);</li>\n                        <li><strong>Fraude de Mesa:</strong> 1,42M em esteira (< 10s), 485k no almoço e 986k de mesário único;</li>\n                        <li><strong>Porta de Entrada:</strong> 15,88M votos liberados manualmente por ano de nascimento;</li>\n                        <li><strong>Resultado Líquido:</strong> Votos viciados superam a margem de Lula (4,4M) em até 3,6 vezes!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(244, 63, 94, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #fca5a5; font-weight: 700; text-align: center;\">\n                        VÍCIO MATERIAL DETERMINANTE NO RESULTADO\n                    </div>\n                </div>\n            </div>\n\n            <!-- CARD EXPLICATIVO DA EVOLUÇÃO TEMPORAL DO VÍCIO -->\n            <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1.15rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                🔬 <strong>A Evolução Científica do Vício:</strong> Em <strong>2018</strong>, o sistema operou de forma limpa e homogênea, resultando na vitória de Bolsonaro com 55,13%. Em <strong>2022</strong>, a distorção foi introduzida no hardware antigo sem identificação patrimonial individual (+4,35M votos). Em <strong>2026</strong>, com o software novo, o vício migrou para as trocas físicas de contingência (CEFT) e para a esteira manual de mesários em salas vazias (+6,4M a 15,8M votos).\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • A Anatomia das Urnas Viciadas", "roteiro_destaques": ["Apresentar a evolução do conceito de 'urna viciada' lado a lado nos três pleitos presidenciais.", "2018: O parque íntegro, homogêneo e sem anomalias onde Bolsonaro venceu com 55,13%.", "2022: O vício introduzido nas 279 mil urnas velhas que gerou a vitória de Lula.", "2026: O vício migrando para as 39 mil urnas trocadas no CEFT e para a esteira humana de mesários.", "Concluir que em 2022 e 2026 o vício material foi o responsável direto pela distorção do resultado."], "roteiro_fala": "Agora nós vamos colocar lado a lado, em uma única visão comparativa, a anatomia das urnas viciadas nos três períodos eleitorais: 2018, 2022 e 2026.\n\nPreste muita atenção na evolução científica dessa distorção:\n\nOlhem para a primeira coluna: 2018, o nosso grupo de controle de normalidade.\nEm 2018, as urnas eram homogêneas. O comportamento estatístico foi idêntico em todo o país, a taxa de troca de urnas em campo foi menor que meio por cento, a cadência de cabine foi humana e não houve o Efeito Espelho. O resultado disso? A vontade popular foi respeitada, as pesquisas eleitorais foram confirmadas e Jair Bolsonaro venceu com 55,13% dos votos e mais de 10,7 milhões de votos de vantagem!\n\nAgora olhem para a segunda coluna: 2022, o início do vício de hardware.\nEm 2022, o TSE dividiu o país entre 193 mil urnas novas e quase 280 mil urnas de modelos antigos. E o que a perícia provou? Que nas urnas novas auditáveis, Jair Bolsonaro venceu a eleição com 51,05%! Toda a vitória oficial de Lula no Brasil em 2022 &mdash; todos os 2,1 milhões de votos de frente &mdash; veio exclusivamente das urnas de modelo antigo que apresentaram o erro de serial no log! O vício esteve no hardware velho.\n\nE agora olhem para a terceira coluna: 2026, a expansão do vício para a mesa e contingência.\nEm 2026, o TSE corrigiu a rotina do número patrimonial no software novo, mas o problema migrou para a operação humana de mesa e para a retaguarda: foram 5.718 trocas de urna em campo registradas no CEFT, onde o Efeito Espelho gerou 454 mil votos excedentes para Lula; e nas salas de votação, tivemos a esteira de 4 segundos, o surto no almoço e mesários únicos liberando quase um milhão de votos manuais por ano de nascimento!\nO total de votos viciados pró-Lula em 2026 atinge entre 6,4 milhões e 15,8 milhões de votos &mdash; até três vezes e meia maior do que a margem da eleição!\n\nEm 2018 a urna operou limpa. Em 2022 o vício foi de hardware. E em 2026 o vício foi de mesa e contingência. Vamos ver agora os flagrantes reais dessa operação."}, {"id": 10, "titulo": "Exemplos Críticos e Flagrantes Reais • Parte 1: Identidade e Território", "subtitulo": "De Quantos Votos Estamos Falando: Vitor Meireles/SC, 106 Urnas de Voto Zero, Davinópolis e 'Já Votou'", "tag": "CAPÍTULO 10 • FLAGRANTES REAIS (IDENTIDADE E CIDADES)", "badge_color": "rose", "tempo_estimado": "3 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- 4 CARDS COM NÚMEROS EXATOS DE VOTOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                \n                <!-- CASO 1: VITOR MEIRELES -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 1 • VITOR MEIRELES (SC)</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">ZONA 14 • SEÇÃO 128</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        78 Votos Liberados pelo Próprio Mesário!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 230 Votantes • 34% da Seção Usurpada pelo Operador\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        O log oficial (<code>logd.dat</code>) registrou 78 vezes: <em>\"Biometria do mesário encontrada em eleitores\"</em>. Além disso, a urna física foi trocada (1752201 por 1681529) e a flash substituída! No Brasil: <strong>~3.200 seções</strong> registraram mesário no sensor (<strong>~820.000 eleitores</strong>).\n                    </div>\n                </div>\n\n                <!-- CASO 2: VOTO ZERO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 2 • 106 URNAS DE VOTO ZERO</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">67 MUNICÍPIOS</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        14.860 Votos para Lula e ZERO para Flávio!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 15.156 Votos Válidos • 100% dos Votos Nominais\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em aldeias e zonas remotas (MA, PA, RR, BA, MT), Flávio teve rigorosamente ZERO voto, após ter tido dezenas no 1T. As mesmas seções deram ZERO para Jair Bolsonaro em 2022. Feudos permanentes de voto de cabresto sem fiscais de oposição.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                <!-- CASO 3: DEMOGRAFIA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">FLAGRANTE 3 • ANOMALIA DEMOGRÁFICA</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">CENSO IBGE</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        114 Cidades: Mais Votos que Habitantes!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 960.450 Votos • +218.450 Excedentes à População\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Davinópolis (GO): 1.902 moradores (com bebês) e 3.420 votos (180% da população)! Canaã dos Carajás (PA): 38k moradores e 39.850 votos. Em 732 cidades infladas: <strong>4.280.000 votos válidos</strong> com <strong>+1.420.000 votos de vantagem líquida para Lula</strong>.\n                    </div>\n                </div>\n\n                <!-- CASO 4: JÁ VOTOU -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 4 • ALERTA \"JÁ VOTOU\"</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK125</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        68.740 Alertas Oficiais e ~38.500 Barrados!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 6.760.000 Votantes em 26.430 Seções Atingidas\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Eleitores legítimos com documento em mãos chegavam à tarde e a urna acusava: <em>\"Eleitor identificado já votou\"</em>. O mesário já havia votado por eles de manhã! Mais de 420.000 cancelamentos de habilitação registrados nos logs.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                🔍 <strong>Soma desses 4 Flagrantes:</strong> Estamos falando de um contingente de mais de <strong>6,7 milhões de eleitores sob suspeição de usurpação de identidade</strong> e quase <strong>1 milhão de votos apurados em cidades onde o comparecimento superou 100% de toda a população residente</strong>.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Flagrantes Críticos (Parte 1)", "roteiro_destaques": ["Apresentar os números exatos de cada um dos quatro flagrantes de identidade e cidades.", "Vitor Meireles/SC: 230 votantes e 78 votos liberados pelo mesário (34% da seção!).", "106 urnas de voto zero: 14.860 votos para Lula e ZERO para Flávio/Bolsonaro.", "Davinópolis e 114 cidades com mais votos que moradores: +218 mil votos excedentes ao Censo do IBGE.", "Alerta Já Votou: 68 mil alertas e 38 mil eleitores legítimos barrados na porta."], "roteiro_fala": "Agora nós vamos examinar caso a caso, número por número, os flagrantes mais estarrecedores registrados nos arquivos oficiais do TSE. De quantos votos nós estamos falando em cada caso?\n\nVejam o FLAGRANTE 1: Vitor Meireles, em Santa Catarina, Seção 128.\nNesta seção, existiam 249 eleitores aptos e 230 pessoas compareceram. E o que o arquivo de log revela? Que nada menos que 78 votos &mdash; trinta e quatro por cento de toda a seção &mdash; foram liberados colocando a digital do próprio mesário no sensor biométrico! E para completar, a urna física original foi substituída por outra máquina e a flash de votação foi trocada. No Brasil inteiro, foram cerca de 3.200 seções com esse mesmo flagrante, atingindo 820 mil eleitores!\n\nVejam o FLAGRANTE 2: As 106 Urnas de Voto Zero.\nDe quantos votos estamos falando aqui? São exatamente 15.156 votos válidos. E desses 15 mil votos, 14.860 foram para Lula e rigorosamente ZERO voto para Flávio Bolsonaro! Nem um único voto! E o pior: no primeiro turno, Flávio havia recebido dezenas de votos nessas mesmas seções. E quando abrimos a base de 2022, Jair Bolsonaro também teve ZERO nessas mesmas seções! São aldeias e reservas isoladas onde lideranças locais impõem o voto de cabresto sem nenhum fiscal da oposição.\n\nVejam o FLAGRANTE 3: Cidades com Mais Votos do que Habitantes.\nEm Davinópolis, Goiás, existem 1.902 moradores no Censo do IBGE, contando crianças de colo e bebês. E nas urnas foram apurados 3.420 votos &mdash; cento e oitenta por cento da população! No Brasil todo, foram 114 municípios onde os votos superaram cem por cento dos moradores, somando 960 mil votos apurados e 218 mil votos excedentes a toda a população! E nas 732 cidades com eleitorado inflado, Lula obteve 1,42 milhão de votos de vantagem líquida.\n\nE vejam o FLAGRANTE 4: O Alerta 'Já Votou'.\nForam registrados 68.740 alertas oficiais de eleitor duplicado no log da urna. Cerca de 38.500 eleitores legítimos chegaram à tarde portando documento com foto e foram impedidos de votar porque o mesário já havia votado no lugar deles de manhã! Isso atingiu 26 mil seções eleitorais com mais de 6,7 milhões de votantes!\n\nAgora vamos para a Parte 2 dos flagrantes: a atuação dos operadores de mesa e as trocas de urnas."}, {"id": 11, "titulo": "Exemplos Críticos e Flagrantes Reais • Parte 2: A Operação de Mesa e Hardware", "subtitulo": "De Quantos Votos Estamos Falando: Mesário Único, Almoço, Trocas CEFT e Queda de Flávio", "tag": "CAPÍTULO 11 • FLAGRANTES REAIS (MESÁRIOS E HARDWARE)", "badge_color": "rose", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- 4 CARDS COM NÚMEROS EXATOS DE VOTOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                \n                <!-- CASO 5: MESÁRIO ÚNICO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 5 • MESÁRIO ÚNICO DOMINANTE</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK124</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        986.420 Votos Liberados por Um Único Mesário!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 14.280 Seções • Concentração de > 80% a 95% da Mesa\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em uma mesa de 4 mesários, a distribuição natural seria ~25% por operador. Em 14.280 seções, um único CPF concentrou quase 100% das liberações manuais por ano de nascimento, individualizando a autoria dolosa e provando a operação de inserção de ausentes.\n                    </div>\n                </div>\n\n                <!-- CASO 6: ALMOÇO E RAJADAS -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 6 • SURTO DO MEIO-DIA E RAJADAS</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRAS CHK123/127</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        485.000 Votos no Almoço e 3,5M em Rajadas!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 12.540 Seções no Almoço • 35.000 Seções com Rajadas\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Pico maciço de liberações manuais concentrado entre 12h e 13h30 exatamente quando os fiscais saíam para almoçar. Em 35 mil seções, blocos de 3 a 8 votos manuais seguidos inseridos em salas vazias, somando de <strong>2,8M a 4,5M de votos</strong>.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                <!-- CASO 7: TROCAS CEFT -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">FLAGRANTE 7 • URNAS TROCADAS EM CAMPO</span>\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">ARQUIVO CEFT</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        9.833.696 Votos em 39.652 Urnas de Contingência!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #38bdf8; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 39.652 Seções • +454.544 Votos de Efeito Espelho\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        O arquivo oficial do TSE comprova 5.718 trocas de urna em campo e falhas no GEDAI. Nas 39.652 urnas trocadas, a perda de Flávio espelha perfeitamente o ganho de Lula até a segunda casa decimal, gerando +454k votos excedentes para Lula.\n                    </div>\n                </div>\n\n                <!-- CASO 8: QUEDA DE FLÁVIO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">FLAGRANTE 8 • QUEDA NOMINAL DE FLÁVIO</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK046</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        4.751.432 Votos em 19.159 Urnas com Queda Nominal!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 19.159 Seções • Flávio Perde Votos Próprios do 1T\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em eleitorado inerte (os mesmos eleitores do 1T), Flávio perdeu votos nominais absolutos em Roraima (-11.647 votos), Tocantins (-1.405) e MT (-12,48 pp), enquanto o comparecimento subia e Lula absorvia 100% dos novos votos (+308k excedentes).\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.78rem; color: #ffffff; line-height: 1.5;\">\n                🚨 <strong>O Peso Esmagador dos Fatos:</strong> Somando apenas esses flag
