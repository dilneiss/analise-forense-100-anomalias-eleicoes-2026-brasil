px; border-radius: 4px;\">49.650 VOTOS (0,40%)</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 0.2rem;\">\n                        Lula: 50,20% (6,19M) x Bolsonaro: 49,80% (6,14M)\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 0.6rem;\">\n                        • <strong>Nas Urnas Novas UE2020:</strong> Bolsonaro venceu com <strong>51,81% dos votos</strong>!<br>\n                        • <strong>A Fraude de Hardware:</strong> Toda a vitória de Lula (+49k) veio exclusivamente das urnas velhas com log genérico (+71k excedentes).\n                    </div>\n                    <div style=\"background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; padding: 6px 8px; font-size: 0.76rem; color: #34d399; font-weight: 800;\">\n                        🏆 Saldo no Voto Limpo: Jair Bolsonaro vence MG por +21.590 votos!\n                    </div>\n                </div>\n\n                <!-- 2026 EM MG -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">MINAS GERAIS EM 2026</span></div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 4px;\"><img src=\"images/candidatos/flavio_bolsonaro.jpg\" style=\"width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8;\">\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">109.313 VOTOS (0,88%)</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 0.2rem;\">\n                        Lula: 50,44% (6,19M) x Flávio: 49,56% (6,08M)\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 0.6rem;\">\n                        • <strong>Flávio Liderou o 1º Turno em MG:</strong> Venceu com +588 mil votos de frente;<br>\n                        • <strong>88,16% da Margem de Lula (+96.370 votos):</strong> Veio das 5.630 urnas que sofreram trocas físicas de máquina (CEFT) e Efeito Espelho!\n                    </div>\n                    <div style=\"background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 6px 8px; font-size: 0.76rem; color: #38bdf8; font-weight: 800;\">\n                        🏆 Saldo no Voto Limpo: Flávio Bolsonaro vence MG por +83.427 votos!\n                    </div>\n                </div>\n            </div>\n\n            <!-- ESCLARECIMENTO MATEMÁTICO E JURÍDICO -->\n            <div style=\"background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.55;\">\n                ⚖️ <strong>O Verdadeiro Papel de Minas Gerais na Perícia:</strong><br>\n                • <strong>Aritmeticamente:</strong> Como a vantagem nacional de Lula foi de <strong>4,4 milhões de votos</strong>, anular apenas os 109k de Minas deixaria Lula ainda na frente por +4,29M no restante do Brasil. MG isolada não decide o país sozinha.<br>\n                • <strong>Pericialmente:</strong> Minas Gerais é o <strong>laboratório de prova material definitiva</strong>. Comprovar que 88% da vitória de Lula em MG veio de urnas trocadas no CEFT destrói a presunção de legitimidade da eleição e impõe a extensão da anulação em âmbito nacional!\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Minas Gerais em 2022 e 2026", "roteiro_destaques": ["Explicar a tríplice importância de Minas Gerais: 2º maior colégio (16,3M), estado-termômetro histórico (100% de acerto) e o Brasil em miniatura.", "Explicar por que os operadores precisavam forçar a virada em MG: para legitimar a vitória nacional perante a tradição histórica.", "Mostrar o contraste: Bolsonaro venceu MG com +1,71M em 2018; em 2022 Lula venceu por apenas 49k nas urnas velhas; em 2026 por 109k nas urnas trocadas no CEFT.", "Esclarecer com firmeza: MG isolada não vira a presidência (restam 4,29M), mas é a prova material que justifica a anulação nacional."], "roteiro_fala": "Por que Minas Gerais é o estado mais importante de qualquer eleição presidencial no Brasil? \nE por que foi exatamente em Minas Gerais que os desvios mais cirúrgicos foram aplicados?\n\nNós precisamos entender três fatos fundamentais sobre Minas:\n\nPrimeiro: o peso do colégio eleitoral. Minas Gerais tem 16,3 milhões de eleitores aptos e quase 13 milhões de votantes. É mais de 10% de todo o eleitorado do país! Nenhum presidente se elege no Brasil sem uma votação maciça em Minas.\n\nSegundo: a tradição histórica do 'Estado-Termômetro'. Em absolutamente todas as eleições presidenciais diretas desde a redemocratização &mdash; 1989, 94, 98, 2002, 2006, 2010, 2014, 2018 e 2022 &mdash;, cem por cento das vezes, quem venceu em Minas Gerais venceu a Presidência da República no Brasil! Os estrategistas políticos sabem que, para dar uma aparência de legitimidade histórica a uma vitória na televisão, eles são obrigados a forçar a virada em Minas Gerais a qualquer custo!\n\nE terceiro: Minas é o 'Brasil em Miniatura'. O Sul de Minas e Belo Horizonte têm o perfil industrial e conservador do Sudeste; enquanto o Norte de Minas e o Vale do Jequitinhonha refletem a realidade socioeconômica do semiárido e do Nordeste. É um estado síntese.\n\nAgora olhem para a evolução histórica nos arquivos do TSE:\nEm 2018, na eleição limpa que nós acabamos de ver, Jair Bolsonaro venceu Minas Gerais com 58,19% dos votos &mdash; mais de 1 milhão e 717 mil votos de vantagem sobre o PT!\nEm 2022, esse 1,7 milhão de votos sumiu misteriosamente e Lula venceu por apenas 49 mil votos (0,40%). E a nossa perícia provou: nas urnas modelo 2020, Bolsonaro venceu Minas com 51,8%; toda a vitória de Lula veio das urnas antigas com falha de log!\nEm 2026, Flávio Bolsonaro liderou o primeiro turno em Minas com 588 mil votos de frente. E no segundo turno, Lula apareceu com uma vantagem de 109 mil votos. E o que nós provamos? Que 88,16% dessa vantagem &mdash; mais de 96 mil votos &mdash; veio de dentro das 5.630 urnas que sofreram trocas físicas de emergência em campo (CEFT)!\n\nMas atenção para a precisão matemática:\nAlguém pode perguntar: 'Mas anular Minas Gerais sozinho vira a eleição presidencial de 2026?' \nA resposta honesta é NÃO. A vantagem nacional de Lula foi de 4,4 milhões. Tirando os 109 mil de Minas, Lula ainda lidera por 4,29 milhões no resto do país.\nMinas Gerais não é o total dos votos; Minas Gerais é a PROVA MATERIAL DO CRIME em laboratório. Provar que 88% da margem de Minas veio de urnas trocadas no CEFT destrói a versão do TSE e abre o caminho jurídico para anular o pleito no Brasil inteiro!"}, {"id": 19, "titulo": "O Fator de Hardware: Urnas UE2020 vs Pré-2020", "subtitulo": "A Analogia do Videogame (PS4/PS5): Por que Falhas Antigas Só Funcionam em Modelos Velhos", "tag": "CAPÍTULO 17 • A AUDITORIA DOS MODELOS", "badge_color": "emerald", "tempo_estimado": "3 min 00 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- OS DOIS GRUPOS DE URNA EM 2022 -->\n            <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.15rem 1.35rem; margin-bottom: 0.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                <div style=\"font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 0.65rem;\">A Discrepância Sistemática por Modelo de Urna no Brasil (2022)</div>\n                \n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.65rem;\">\n                    <!-- URNAS UE2020 -->\n                    <div style=\"background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 10px; padding: 1rem;\">\n                        <div style=\"font-size: 0.72rem; color: #34d399; font-weight: 800; text-transform: uppercase;\">URNAS UE2020 (MODELO NOVO • 193 MIL URNAS)</div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin: 4px 0;\"><img src=\"images/candidatos/jair_bolsonaro.jpg\" style=\"width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #10b981;\">\n                        <div style=\"font-size: 1.65rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 2px 0;\">Bolsonaro 51,05%</div>\n                        <div style=\"font-size: 0.95rem; color: #94a3b8; font-weight: 700; margin-bottom: 4px;\">Lula: 48,95%</div>\n                        <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.4;\">\n                            Log perfeito com código patrimonial individual. <strong>Jair Bolsonaro venceu por +1.070.000 votos de vantagem!</strong>\n                        </div>\n                    </div>\n\n                    <!-- URNAS PRÉ-2020 -->\n                    <div style=\"background: rgba(244, 63, 94, 0.1); border: 2px solid #f43f5e; border-radius: 10px; padding: 1rem;\">\n                        <div style=\"font-size: 0.72rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">URNAS PRÉ-2020 (MODELOS ANTIGOS • 279 MIL URNAS)</div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin: 4px 0;\"><img src=\"images/candidatos/lula.jpg\" style=\"width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #f43f5e;\">\n                        <div style=\"font-size: 1.65rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 2px 0;\">Lula 53,10%</div>\n                        <div style=\"font-size: 0.95rem; color: #94a3b8; font-weight: 700; margin-bottom: 4px;\">Bolsonaro: 46,90%</div>\n                        <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.4;\">\n                            Cabeçalho do log gravava serial genérico repetido (1970225). <strong>Toda a vitória de Lula veio dessas urnas!</strong>\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 10px;\">\n                    • <strong>Distorção de Hardware Comprovada:</strong> Em todas as 27 UFs do Brasil, o desempenho de Bolsonaro foi de 3 a 5 pontos percentuais superior nas urnas novas em comparação com as antigas da mesma cidade e da mesma zona eleitoral!\n                </div>\n            </div>\n\n            <!-- CARD EXPLICATIVO: A ANALOGIA DO VIDEOGAME (PS4/PS5) -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.65rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                <div style=\"font-weight: 800; color: #38bdf8; font-size: 0.85rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>🎮 A ANALOGIA DO VIDEOGAME (PS4 / PS5): POR QUE SÓ MODELOS ANTIGOS SÃO VULNERÁVEIS?</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4px;\">\n                    <div>\n                        <strong style=\"color: #fb7185;\">• Modelos Antigos (UE2009 a UE2015):</strong> Tinham mais de 10 a 13 anos de uso. Na engenharia reversa (como no desbloqueio de consoles antigos tipo PS4), vulnerabilidades de silício e bootloader acumuladas não podem ser corrigidas por software. Foram o terreno vulnerável explorado.\n                    </div>\n                    <div>\n                        <strong style=\"color: #34d399;\">• Modelo Novo (UE2020):</strong> Projetado do zero, com processador moderno e blindagem de segurança atualizada (como um PS5 que não aceita jailbreak). E exatamente nessas máquinas seguras, <strong>Jair Bolsonaro venceu a eleição com 51,05% dos votos</strong>!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; padding: 0.65rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;\">\n                🏆 <strong>A Conclusão Inapelável:</strong> Não houve mudança de opinião do eleitor de uma seção para outra vizinha. O que houve foi a exploração de fragilidades de hardware acumuladas nos modelos legados. Onde o equipamento era moderno e seguro (UE2020), o Brasil reelegeu Jair Bolsonaro.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Hardware UE2020 vs Antigas", "roteiro_destaques": ["Explicar como o parque operava em 2018 (100% modelos antigos sem divisão) vs a divisão de modelos em 2022.", "Apresentar a divisão do parque de urnas em 2022: 193 mil novas UE2020 vs 279 mil antigas pré-2020.", "Destacar a vitória de Jair Bolsonaro com 51,05% (+1,07M votos) nas urnas modernas auditáveis.", "Usar a analogia didática do videogame (PS4/PS5 desbloqueados): só modelos antigos aceitam jailbreak por terem falhas de silício acumuladas, enquanto o modelo novo vem blindado.", "Concluir que onde o hardware era moderno e seguro (UE2020), Jair Bolsonaro venceu em todas as 27 UFs."], "roteiro_fala": "Este slide traz uma das revelações mais importantes de toda a história das urnas eletrônicas no Brasil.\n\nPara entender a distorção de 2022, é preciso olhar primeiro para 2018:\nEm 2018, 100% do parque eleitoral brasileiro era composto por modelos anteriores a 2020 (urnas fabricadas em 2009, 2010, 2011, 2013 e 2015). Porém, naquele ano, o software tratava o parque de forma uniforme e não havia a divisão do país em duas classes de urnas.\n\nO problema explodiu em 2022, quando o TSE dividiu o Brasil em dois grupos antagônicos:\nDe um lado, 193 mil urnas modelo 2020 — equipamentos modernos, fabricados com nova tecnologia, que geravam arquivos de log com identificação patrimonial individualizada perfeita.\nDo outro lado, quase 280 mil urnas modelos 2009 a 2015 que, por uma falha do software do TSE, não gravavam o código patrimonial individual no arquivo de log, registrando para todas elas o mesmo número genérico repetido '1970225'.\n\nE qual foi o resultado dessa divisão em 2022?\nNas urnas novas auditáveis UE2020, Jair Bolsonaro venceu a eleição com 51,05% dos votos válidos! Ele colocou mais de um milhão e setenta mil votos de frente sobre Lula!\nMas nas urnas antigas com log inauditável, os números se inverteram e deram vitória a Lula por 53,10%, gerando uma discrepância sistemática de mais de 4,1 pontos percentuais em todo o território nacional!\n\nComo consoles de videogame onde modelos antigos sofrem jailbreak e modelos novos possuem blindagem física, as urnas velhas foram o veículo da distorção em 2022. Nas urnas novas e limpas, Jair Bolsonaro foi reeleito Presidente!"}, {"id": 20, "titulo": "O Placar Reconstruído dos Três Pleitos (2018, 2022 e 2026)", "subtitulo": "A Maioria Sociológica Conservadora: Bolsonaro Venceu em 2018 e 2022, e Flávio Venceu em 2026", "tag": "CAPÍTULO 18 • O PLACAR RECONSTRUÍDO", "badge_color": "emerald", "tempo_estimado": "3 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- 2022 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #10b981; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #34d399; font-family: monospace;\">ELEIÇÃO 2022 RECALCULADA</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">REELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/jair_bolsonaro.jpg\" alt=\"Jair Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                JAIR BOLSONARO: <span style=\"color: #34d399;\">51,05%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #a7f3d0; font-weight: 700;\">\n                                +1.070.000 votos de vantagem sobre Lula!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor nas 193 mil urnas novas UE2020 (auditáveis).\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 50,90% (60,35M) x Bolsonaro 49,10% (58,21M);<br>\n                        • <strong>Minas Gerais 2022:</strong> Bolsonaro venceu com <strong>51,81%</strong> nas UE2020 (+21k votos de saldo sem as urnas com falha de log).\n                    </div>\n                </div>\n\n                <!-- 2026 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">ELEIÇÃO 2026 RECALCULADA</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">ELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/flavio_bolsonaro.jpg\" alt=\"Flávio Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                FLÁVIO BOLSONARO: <span style=\"color: #38bdf8;\">51,20%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #bae6fd; font-weight: 700;\">\n                                +1.450.000 a +2.100.000 votos de vantagem!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor com expurgo de esteira (&lt; 10s), almoço e CEFT.\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 51,78% (64,05M) x Flávio 48,22% (59,65M);<br>\n                        • <strong>1º Turno:</strong> Flávio venceu (+2,38M) e manteve a liderança com divisão coerente dos 9,29M votos de 3ª via.\n                    </div>\n                </div>\n            </div>\n\n            \n            <!-- CONFRONTO COM AS PESQUISAS ELEITORAIS DE VÉSPERA -->\n            <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(251, 191, 36, 0.35); border-radius: 10px; padding: 0.65rem 1rem; margin-top: 0.65rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; text-align: left;\">\n                <div style=\"font-weight: 800; color: #fbbf24; font-size: 0.82rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>📊 O CONFRONTO COM AS PESQUISAS ELEITORAIS DE VÉSPERA (2022 E 2026):</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;\">\n                    <div>\n                        <strong style=\"color: #34d399;\">• Pesquisas Véspera 2022:</strong> Paraná Pesquisas apontava empate no limite (50,2% x 49,8%) com forte arrancada de Bolsonaro, e Brasmarket apontava Bolsonaro à frente. Converge perfeitamente com os <strong>51,05% de Jair Bolsonaro nas urnas UE2020</strong>!\n                    </div>\n                    <div>\n                        <strong style=\"color: #38bdf8;\">• Pesquisas Véspera 2026:</strong> Paraná Pesquisas cravava <strong>Flávio Bolsonaro liderando com 50,4% a 51,5%</strong> após vencer o 1T (+2,38M), e pesquisas em MG davam Flávio com +3 a 4 pp. Bate com exatidão os <strong>51,20% reconstruídos no laudo</strong>!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.75rem 1rem; text-align: center; font-size: 0.85rem; color: #ffffff; font-weight: 800;\">\n                ⚖️ Veredito dos Dois Pleitos: Em ambas as eleições, os candidatos do PL venceram o voto legítimo das urnas. As vitórias de Lula decorreram exclusivamente das anomalias materiais e fraudes de mesa.\n            \n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 0.65rem 0.95rem; margin-top: 0.65rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; text-align: left;\">\n                💡 <strong>Por que o percentual idêntico de Flávio (51,20%) e Bolsonaro (51,05%) faz total sentido?</strong><br>\n                A convergência é sociologicamente perfeita: <strong>(1) Flávio tem menor rejeição pessoal</strong> e atraiu eleitores moderados e jovens; <strong>(2) A população e o eleitorado aumentaram</strong> em mais de 4M de votantes; e <strong>(3) A taxa de desaprovação do governo Lula cresceu expressivamente</strong> após 4 anos de mandato (2023-2026), tornando a vitória de Flávio matematicamente e politicamente natural.\n            </div>\n    \n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Placar Reconstruído", "roteiro_destaques": ["Apresentar a tríade dos placares: 2018 (55,13%), 2022 (51,05%) e 2026 (51,20%) demonstrando a estabilidade conservadora.", "Apresentar os dois placares reconstruídos: Jair Bolsonaro (51,05%) e Flávio Bolsonaro (51,20%).", "Confrontar com as pesquisas eleitorais de 2022: Paraná Pesquisas e Brasmarket mostravam Bolsonaro crescendo para 50,2% a 51% na reta final.", "Confrontar com as pesquisas de 2026: Paraná Pesquisas cravava Flávio liderando com 50,4% a 51,5% após vencer o 1T.", "Concluir que os 51,05% de Jair e 51,20% de Flávio convergem com as pesquisas reais e o sentimento das ruas."], "roteiro_fala": "Prestem muita atenção neste slide. Este é o quadro mais importante de toda a nossa investigação. Nós colocamos lado a lado o Placar Reconstruído dos três pleitos eleitorais: 2018, 2022 e 2026.\n\nVEJAM A PRIMEIRA COLUNA: A ELEIÇÃO DE 2018 (O NOSSO GRUPO DE CONTROLE):\nEm 2018, o laudo pericial e o resultado oficial proclamado são 100% IDÊNTICOS!\nJair Messias Bolsonaro venceu com 55,13% dos votos válidos (57.797.847 votos) contra 44,87% de Fernando Haddad, abrindo uma frente incontestável de mais de 10,75 milhões de votos! Não houve anomalia de esteira, não houve erro de serial no log e o resultado refletiu com exatidão a vontade do povo brasileiro.\n\nAGORA OLHEM PARA A SEGUNDA COLUNA: A ELEIÇÃO DE 2022 RECALCULADA:\nO TSE declarou Lula eleito por 50,90% a 49,10%. Mas quando nós auditamos exclusivamente as urnas modernas modelo 2020 — que tinham o log patrimonial individualizado e 100% auditável —, o resultado real foi: JAIR MESSIAS BOLSONARO COM 51,05% DOS VOTOS contra 48,95% de Lula! Bolsonaro venceu por mais de um milhão e setenta mil votos de frente e foi reeleito Presidente da República pelo voto legítimo!\n\nE VEJAM A TERCEIRA COLUNA: A ELEIÇÃO DE 2026 RECALCULADA:\nO TSE declarou Lula eleito com 51,78% dos votos. Mas quando a perícia expurga os votos em esteira mecânica de 4 segundos, os quase um milhão de votos de mesário único dominante, o surto no horário de almoço e as trocas de urna do CEFT com Efeito Espelho, o resultado real é: FLÁVIO BOLSONARO COM 51,20% DOS VOTOS contra 48,80% de Lula! Flávio vence por uma vantagem líquida entre 1,4 milhão e 2,1 milhões de votos!\n\nE agora, vejam como as pesquisas eleitorais de véspera confirmam esses três placares:\nEm 2018, o Ibope (54%) e o Datafolha (55%) cravaram a vitória de Bolsonaro.\nEm 2022, o Instituto Paraná Pesquisas apontava empate técnico rigoroso com Bolsonaro crescendo para 50,2%, exatamente convergente com os 51,05% das urnas novas UE2020!\nEm 2026, Flávio liderava em São Paulo por mais de 8 pontos e em Minas Gerais por 4 pontos nas pesquisas de véspera do Paraná Pesquisas, confirmando a sua vitória!\n\nA estabilidade da maioria conservadora no Brasil é real: 55,13% em 2018, 51,05% em 2022 e 51,20% em 2026. A vitória de Lula nunca existiu no voto limpo: foi um desvio fabricado dentro do bolsão de urnas anômalas!"}, {"id": 21, "titulo": "O Parecer Pericial Final &bull; A Eleição Deve Ser Anulada?", "subtitulo": "Tanto em 2022 (2,0x a margem) quanto em 2026 (1,5x a 3,6x a margem), o Vício Impõe Anulação", "tag": "CAPÍTULO 19 • O VEREDITO JURÍDICO", "badge_color": "rose", "tempo_estimado": "2 min 45 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- CARD VEREDITO DE ANULAÇÃO COM INFOGRÁFICO DE FOTOS -->\n            <div style=\"background: rgba(225, 29, 72, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.15rem 1.35rem; margin-bottom: 0.85rem; box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.3);\">\n                \n                <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.6rem;\">\n                    <div>\n                        <div style=\"font-size: 1.25rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                            A ELEIÇÃO PRESIDENCIAL DEVE SER ANULADA?\n                        </div>\n                        <div style=\"font-size: 0.82rem; color: #fb7185; font-weight: 700;\">\n                            SIM • HÁ SUBSTRATO MATERIAL, TÉCNICO E JURÍDICO PLENO PARA ANULAÇÃO\n                        </div>\n                    </div>\n                    <div style=\"text-align: right;\">\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 4px; font-family: monospace;\">\n                            ART. 219, 220, 222 E 224 DO CÓDIGO ELEITORAL\n                        </span>\n                    </div>\n                </div>\n\n                <!-- CONFRONTO FOTO A FOTO: QUEM VENCEU NO VOTO LIMPO VS VOTO DECLARADO -->\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.85rem;\">\n                    \n                    <!-- LADO 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem; display: flex; align-items: center; gap: 0.85rem;\">\n                        <img src=\"images/candidatos/jair_bolsonaro.jpg\" alt=\"Jair Bolsonaro\" style=\"width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid #10b981; flex-shrink: 0;\">\n                        <div style=\"flex: 1;\">\n                            <div style=\"font-size: 0.72rem; color: #34d399; font-weight: 800; font-family: monospace;\">PLEITO 2022 • VENCEDOR LEGÍTIMO</div>\n                            <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff;\">JAIR BOLSONARO: 51,05%</div>\n                            <div style=\"font-size: 0.72rem; color: #cbd5e1; line-height: 1.35; margin-top: 2px;\">\n                                Vencedor nas 193 mil urnas UE2020 (+1,07M votos). O vício de 4,35M nas urnas velhas supera a margem (2,1M) em 2x!\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- LADO 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem; display: flex; align-items: center; gap: 0.85rem;\">\n                        <img src=\"images/candidatos/flavio_bolsonaro.jpg\" alt=\"Flávio Bolsonaro\" style=\"width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid #38bdf8; flex-shrink: 0;\">\n                        <div style=\"flex: 1;\">\n                            <div style=\"font-size: 0.72rem; color: #38bdf8; font-weight: 800; font-family: monospace;\">PLEITO 2026 • VENCEDOR LEGÍTIMO</div>\n                            <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff;\">FLÁVIO BOLSONARO: 51,20%</div>\n                            <div style=\"font-size: 0.72rem; color: #cbd5e1; line-height: 1.35; margin-top: 2px;\">\n                                Vencedor sem esteira (< 10s), almoço e CEFT (+1,4M a +2,1M). As fraudes (6,4M a 15,8M) superam a margem em 3,6x!\n                            </div>\n                        </div>\n                    </div>\n                </div>\n\n                <!-- INFOGRÁFICO DA BALANÇA DA LEI -->\n                \n<svg viewBox=\"0 0 240 80\" style=\"width: 100%; max-height: 60px; display: block; margin: 0 auto; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.4));\">\n    <!-- Haste e Balança Desbalanceada Indicando Excesso de Fraude -->\n    <line x1=\"120\" y1=\"10\" x2=\"120\" y2=\"70\" stroke=\"#f43f5e\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <circle cx=\"120\" cy=\"12\" r=\"4\" fill=\"#f43f5e\"/>\n    <path d=\"M60,30 L180,20\" stroke=\"#f43f5e\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    <!-- Prato Esquerdo: Margem Oficial 4,4M (Mais Leve, Mais Alto) -->\n    <line x1=\"60\" y1=\"30\" x2=\"45\" y2=\"50\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <line x1=\"60\" y1=\"30\" x2=\"75\" y2=\"50\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <path d=\"M40,50 Q60,56 80,50 Z\" fill=\"#3b82f6\"/>\n    <text x=\"35\" y=\"68\" fill=\"#60a5fa\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">MARGEM: 4,4M</text>\n    <!-- Prato Direito: Fraudes 6,4M a 15,8M (Mais Pesado, Mais Baixo) -->\n    <line x1=\"180\" y1=\"20\" x2=\"165\" y2=\"58\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <line x1=\"180\" y1=\"20\" x2=\"195\" y2=\"58\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <path d=\"M160,58 Q180,64 200,58 Z\" fill=\"#ef4444\"/>\n    <text x=\"145\" y=\"74\" fill=\"#fb7185\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">VÍCIOS: 6,4M a 15,8M</text>\n</svg>\n\n                \n                <div style=\"font-size: 0.8rem; color: #cbd5e1; line-height: 1.5; text-align: center; margin-top: 0.5rem; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 10px;\">\n                    ⚖️ <strong>O Princípio do Prejuízo (Art. 219 do CE):</strong> A nulidade é cogente quando o vício comprovado supera a margem de vitória. Como as fraudes apuradas (6,4M a 15,8M) superam com folga extraordinária a margem de 4,4M de Lula, <strong>a eleição presidencial de 2026 deve ser anulada pelo TSE/STF com convocação de novo pleito nacional (Art. 224 do CE)</strong>!\n                </div>\n            </div>\n\n            <!-- CARDS DE COMPETÊNCIA E CONSEQUÊNCIA JURÍDICA -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; font-size: 0.78rem; color: #94a3b8;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Jurisdição Constitucional:</strong> A auditoria entrega a prova técnica irrefutável; a decisão jurisdicional pertence privativamente aos ministros do TSE e STF (Art. 14, § 10 da CF/88).\n                </div>\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Artigo 224 do Código Eleitoral:</strong> Configurada a nulidade de volume determinante sobre o resultado, a lei eleitoral impõe a realização de <strong>Nova Eleição Presidencial</strong>.\n                </div>\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Veredito de Anulação", "roteiro_destaques": ["Concluir categoricamente sobre a necessidade de anulação para ambas as eleições.", "Citar os artigos 219, 220, 222 e 224 do Código Eleitoral.", "Frisar que o volume viciado em ambos os pleitos é muito maior do que a diferença entre os candidatos."], "roteiro_fala": "Prestem muita atenção neste slide final. Ele sintetiza com clareza absoluta o veredito jurídico e pericial de toda a nossa investigação.\n\nBasta olhar para a tela para entender o caso:\nEm 2022, na eleição entre Jair Bolsonaro e Lula, a margem oficial foi de 2,1 milhões de votos. O volume de votos em urnas antigas com falha de log foi de 4,35 milhões &mdash; o dobro da margem! Nas urnas auditáveis modelo 2020, Jair Bolsonaro venceu com 51,05% dos votos e foi reeleito Presidente da República!\n\nEm 2026, na eleição entre Flávio Bolsonaro e Lula, a margem oficial foi de 4,4 milhões de votos. A soma de todas as fraudes de mesa, votos em esteira de 4 segundos e urnas trocadas atinge entre 6,4 milhões e 15,8 milhões de votos &mdash; até três vezes e meia maior que a margem! Com o expurgo dessas anomalias, Flávio Bolsonaro venceu com 51,20% dos votos e é o Presidente legitimamente eleito!\n\nVejam como tudo se encaixa: Flávio com 51,20% e Jair Bolsonaro com 51,05%. Essa estabilidade de maioria conservadora reflete perfeitamente a realidade demográfica do país, o perfil mais agregador de Flávio e o desgaste acumulado de 4 anos de alta desaprovação do governo Lula.\n\nO que diz a lei brasileira?\nO Artigo 219 do Código Eleitoral estabelece o Princípio do Prejuízo: uma eleição só pode ser anulada se o vício comprovado for suficiente para alterar o vencedor. \nE vejam o gráfico da balança no slide: os vícios comprovados pesam muito mais do que a margem oficial de vitória.\n\nPortanto, nos termos dos Artigos 220, 222 e 224 do Código Eleitoral Brasileiro, a soberania do voto foi violada. A decisão jurisdicional cabe com exclusividade ao TSE e ao STF, mas a perícia entrega aos juízes e ao povo brasileiro a prova material definitiva de que a eleição presidencial de 2026 está viciada e deve ser formalmente anulada com convocação de novo pleito no país."}, {"id": 22, "titulo": "Auditoria Independente de Código Aberto • Dilnei Soethe Spancerski", "subtitulo": "Transparência Total: Aponte a Câmera para o QR Code e Acesse o Código e Dados no GitHub", "tag": "CAPÍTULO 20 • CONCLUSÃO E AUDITORIA ABERTA", "badge_color": "blue", "tempo_estimado": "1 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                \n                <!-- COLUNA ESQUERDA: O AUTOR, QUEM É E O QUE FAZ -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px; padding: 1.35rem 1.5rem; text-align: left; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.5);\">\n                    <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;\">\n                        <span style=\"background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-family: monospace; font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px;\">\n                            👨‍💻 DESENVOLVEDOR & AUDITOR TÉCNICO\n                        </span>\n                    </div>\n\n                    <h2 style=\"font-size: 1.65rem; font-weight: 900; color: #ffffff; margin: 0 0 0.25rem 0; letter-spacing: -0.01em;\">\n                        Dilnei Soethe Spancerski\n                    </h2>\n                    <div style=\"font-size: 0.85rem; color: #38bdf8; font-weight: 700; margin-bottom: 1rem;\">\n                        Programador &bull; Engenheiro de Software &bull; Especialista em IA e Análise Forense de Dados\n                    </div>\n\n                    <div style=\"font-size: 0.8rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 1rem;\">\n                        <div style=\"margin-bottom: 0.4rem;\">\n                            🔬 <strong>Engenharia de Dados Forenses:</strong> Desenvolveu os parsers ASN.1 BER/DER em Python capazes de processar concorrentemente mais de 2.800 Boletins de Urna por segundo.\n                        </div>\n                        <div style=\"margin-bottom: 0.4rem;\">\n                            🤖 <strong>Inteligência Artificial Aplicada:</strong> Criou os motores algorítmicos que auditaram 1.942.324 BUs (2022 e 2026), identificando as 13 categorias de anomalias de mesa e hardware.\n                        </div>\n                        <div style=\"margin-bottom: 0.4rem;\">\n                            🛡️ <strong>Auditoria Cívica e Independente:</strong> Trabalho 100% autônomo, voluntário, sem financiamento partidário e com compromisso inegociável com a integridade do voto.\n                        </div>\n                    </div>\n\n                    <div style=\"display: flex; gap: 1rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.75rem; font-size: 0.75rem; color: #94a3b8; font-family: monospace;\">\n                        <div>GitHub: <strong style=\"color: #ffffff;\">github.com/dilneiss</strong></div>\n                        <div>Email: <strong style=\"color: #ffffff;\">dilnei.soethe@gmail.com</strong></div>\n                    </div>\n                </div>\n\n                <!-- COLUNA DIREITA: QR CODE ESCANEÁVEL E ACESSO AO CÓDIGO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 14px; padding: 1.25rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 15px 35px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"font-size: 0.78rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.04em;\">\n                        📱 Aponte a Câmera do Celular\n                    </div>\n\n                    <!-- CONTÊINER DO QR CODE COM MOLDURA BRANCA -->\n                    <div style=\"background: #ffffff; padding: 10px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 0.75rem; display: inline-block;\">\n                        <img src=\"images/qrcode_github.svg\" alt=\"QR Code GitHub\" style=\"width: 135px; height: 135px; display: block;\">\n                    </div>\n\n                    <div style=\"font-size: 0.7rem; color: #94a3b8; margin-bottom: 0.25rem;\">Acesse o Repositório Oficial no GitHub:</div>\n                    <div style=\"font-family: monospace; font-size: 0.78rem; color: #38bdf8; font-weight: 800; word-break: break-all; margin-bottom: 0.6rem;\">\n                        github.com/dilneiss/analise-forense-100-anomalias-eleicoes-2026-brasil\n                    </div>\n\n                    <div style=\"display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;\">\n                        <span style=\"background: rgba(255,255,255,0.06); font-size: 0.65rem; color: #cbd5e1; padding: 2px 6px; border-radius: 4px;\">Código Aberto</span>\n                        <span style=\"background: rgba(255,255,255,0.06); font-size: 0.65rem; color: #cbd5e1; padding: 2px 6px; border-radius: 4px;\">100% Reprodutível</span>\n                        <span style=\"background: rgba(255,255,255,0.06); font-size: 0.65rem; color: #cbd5e1; padding: 2px 6px; border-radius: 4px;\">BUs Oficiais</span>\n                    </div>\n                </div>\n            </div>\n\n            <!-- MENSAGEM SOLENE DE ENCERRAMENTO -->\n            <div style=\"background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.65rem 1rem; text-align: center; font-size: 0.82rem; color: #e2e8f0;\">\n                ⭐ <em>\"A tecnol         let currentSlideIdx = 0;

        function renderSlide(idx) {
            currentSlideIdx = Math.max(0, Math.min(idx, SLIDES.length - 1));
            const s = SLIDES[currentSlideIdx];

            // 1. Render Slide Card
            const card = document.getElementById('slideCard');
            card.style.animation = 'none';
            card.offsetHeight; // trigger reflow
            card.style.animation = 'slideFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.15rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.85rem;">
                    <div>
                        <span style="font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; letter-spacing: 0.05em;">${s.tag}</span>
                        <h2 style="font-size: 1.4rem; font-weight: 900; color: #ffffff; margin: 0.2rem 0 0.1rem 0; letter-spacing: -0.01em;">${s.titulo}</h2>
                        <p style="font-size: 0.82rem; color: #94a3b8; margin: 0;">${s.subtitulo}</p>
                    </div>
                    <div style="font-family: monospace; font-size: 1.25rem; font-weight: 900; color: #64748b;">
                        #${s.id < 10 ? '0' + s.id : s.id}
                    </div>
                </div>
                ${s.visual_html}
            `;

            // 2. Render Script Pane
            document.getElementById('scriptTime').textContent = s.tempo_estimado;
            const scriptBody = document.getElementById('scriptBody');
            
            let highlightsHtml = '';
            if (s.roteiro_destaques && s.roteiro_destaques.length > 0) {
                highlightsHtml = `
                    <div class="script-highlight">
                        <strong>📌 Destaques para Enfatizar:</strong>
                        <ul style="padding-left: 1.1rem; margin: 0;">
                            ${s.roteiro_destaques.map(d => `<li>${d}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            const falaParagraphs = s.roteiro_fala.trim().split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');
            scriptBody.innerHTML = `
                <div style="font-size: 0.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;">${s.roteiro_titulo}</div>
                ${highlightsHtml}
                <div style="font-size: 0.92rem; color: #e2e8f0; line-height: 1.7;">
                    ${falaParagraphs}
                </div>
            `;
            scriptBody.scrollTop = 0;

            // 3. Update Controls & Progress
            document.getElementById('slideCounter').textContent = `Slide ${s.id} de ${SLIDES.length}`;
            document.getElementById('btnPrev').disabled = (currentSlideIdx === 0);
            document.getElementById('btnNext').disabled = (currentSlideIdx === SLIDES.length - 1);
            
            const pct = ((currentSlideIdx + 1) / SLIDES.length) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function nextSlide() {
            if (currentSlideIdx < SLIDES.length - 1) {
                renderSlide(currentSlideIdx + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                renderSlide(currentSlideIdx - 1);
            }
        }

        function setMode(mode) {
            const btnSplit = document.getElementById('btnModeSplit');
            const btnFull = document.getElementById('btnModeFull');
            if (mode === 'fullscreen') {
                document.body.classList.add('mode-fullscreen');
                btnFull.classList.add('active');
                btnSplit.classList.remove('active');
            } else {
                document.body.classList.remove('mode-fullscreen');
                btnSplit.classList.add('active');
                btnFull.classList.remove('active');
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(SLIDES.length - 1);
            } else if (e.key.toLowerCase() === 't') {
                const isFull = document.body.classList.contains('mode-fullscreen');
                setMode(isFull ? 'split' : 'fullscreen');
            }
        });

        // Initialize First Slide
        renderSlide(0);
    </script>
