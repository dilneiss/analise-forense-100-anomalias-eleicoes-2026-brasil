ados manualmente por ano de nascimento;</li>\n                        <li><strong>Resultado Líquido:</strong> Votos viciados superam a margem de Lula (4,4M) em até 3,6 vezes!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(244, 63, 94, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #fca5a5; font-weight: 700; text-align: center;\">\n                        VÍCIO MATERIAL DETERMINANTE NO RESULTADO\n                    </div>\n                </div>\n            </div>\n\n            <!-- CARD EXPLICATIVO DA EVOLUÇÃO TEMPORAL DO VÍCIO -->\n            <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1.15rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                🔬 <strong>A Evolução Científica do Vício:</strong> Em <strong>2018</strong>, o sistema operou de forma limpa e homogênea, resultando na vitória de Bolsonaro com 55,13%. Em <strong>2022</strong>, a distorção foi introduzida no hardware antigo sem identificação patrimonial individual (+4,35M votos). Em <strong>2026</strong>, com o software novo, o vício migrou para as trocas físicas de contingência (CEFT) e para a esteira manual de mesários em salas vazias (+6,4M a 15,8M votos).\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • A Anatomia das Urnas Viciadas", "roteiro_destaques": ["Apresentar a evolução do conceito de 'urna viciada' lado a lado nos três pleitos presidenciais.", "2018: O parque íntegro, homogêneo e sem anomalias onde Bolsonaro venceu com 55,13%.", "2022: O vício introduzido nas 279 mil urnas velhas que gerou a vitória de Lula.", "2026: O vício migrando para as 39 mil urnas trocadas no CEFT e para a esteira humana de mesários.", "Concluir que em 2022 e 2026 o vício material foi o responsável direto pela distorção do resultado."], "roteiro_fala": "Agora nós vamos colocar lado a lado, em uma única visão comparativa, a anatomia das urnas viciadas nos três períodos eleitorais: 2018, 2022 e 2026.\n\nPreste muita atenção na evolução científica dessa distorção:\n\nOlhem para a primeira coluna: 2018, o nosso grupo de controle de normalidade.\nEm 2018, as urnas eram homogêneas. O comportamento estatístico foi idêntico em todo o país, a taxa de troca de urnas em campo foi menor que meio por cento, a cadência de cabine foi humana e não houve o Efeito Espelho. O resultado disso? A vontade popular foi respeitada, as pesquisas eleitorais foram confirmadas e Jair Bolsonaro venceu com 55,13% dos votos e mais de 10,7 milhões de votos de vantagem!\n\nAgora olhem para a segunda coluna: 2022, o início do vício de hardware.\nEm 2022, o TSE dividiu o país entre 193 mil urnas novas e quase 280 mil urnas de modelos antigos. E o que a perícia provou? Que nas urnas novas auditáveis, Jair Bolsonaro venceu a eleição com 51,05%! Toda a vitória oficial de Lula no Brasil em 2022 &mdash; todos os 2,1 milhões de votos de frente &mdash; veio exclusivamente das urnas de modelo antigo que apresentaram o erro de serial no log! O vício esteve no hardware velho.\n\nE agora olhem para a terceira coluna: 2026, a expansão do vício para a mesa e contingência.\nEm 2026, o TSE corrigiu a rotina do número patrimonial no software novo, mas o problema migrou para a operação humana de mesa e para a retaguarda: foram 5.718 trocas de urna em campo registradas no CEFT, onde o Efeito Espelho gerou 454 mil votos excedentes para Lula; e nas salas de votação, tivemos a esteira de 4 segundos, o surto no almoço e mesários únicos liberando quase um milhão de votos manuais por ano de nascimento!\nO total de votos viciados pró-Lula em 2026 atinge entre 6,4 milhões e 15,8 milhões de votos &mdash; até três vezes e meia maior do que a margem da eleição!\n\nEm 2018 a urna operou limpa. Em 2022 o vício foi de hardware. E em 2026 o vício foi de mesa e contingência. Vamos ver agora os flagrantes reais dessa operação."}, {"id": 10, "titulo": "Exemplos Críticos e Flagrantes Reais • Parte 1: Identidade e Território", "subtitulo": "De Quantos Votos Estamos Falando: Vitor Meireles/SC, 106 Urnas de Voto Zero, Davinópolis e 'Já Votou'", "tag": "CAPÍTULO 10 • FLAGRANTES REAIS (IDENTIDADE E CIDADES)", "badge_color": "rose", "tempo_estimado": "3 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- 4 CARDS COM NÚMEROS EXATOS DE VOTOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                \n                <!-- CASO 1: VITOR MEIRELES -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 1 • VITOR MEIRELES (SC)</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">ZONA 14 • SEÇÃO 128</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        78 Votos Liberados pelo Próprio Mesário!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 230 Votantes • 34% da Seção Usurpada pelo Operador\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        O log oficial (<code>logd.dat</code>) registrou 78 vezes: <em>\"Biometria do mesário encontrada em eleitores\"</em>. Além disso, a urna física foi trocada (1752201 por 1681529) e a flash substituída! No Brasil: <strong>~3.200 seções</strong> registraram mesário no sensor (<strong>~820.000 eleitores</strong>).\n                    </div>\n                </div>\n\n                <!-- CASO 2: VOTO ZERO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 2 • 106 URNAS DE VOTO ZERO</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">67 MUNICÍPIOS</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        14.860 Votos para Lula e ZERO para Flávio!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 15.156 Votos Válidos • 100% dos Votos Nominais\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em aldeias e zonas remotas (MA, PA, RR, BA, MT), Flávio teve rigorosamente ZERO voto, após ter tido dezenas no 1T. As mesmas seções deram ZERO para Jair Bolsonaro em 2022. Feudos permanentes de voto de cabresto sem fiscais de oposição.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                <!-- CASO 3: DEMOGRAFIA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">FLAGRANTE 3 • ANOMALIA DEMOGRÁFICA</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">CENSO IBGE</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        114 Cidades: Mais Votos que Habitantes!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 960.450 Votos • +218.450 Excedentes à População\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Davinópolis (GO): 1.902 moradores (com bebês) e 3.420 votos (180% da população)! Canaã dos Carajás (PA): 38k moradores e 39.850 votos. Em 732 cidades infladas: <strong>4.280.000 votos válidos</strong> com <strong>+1.420.000 votos de vantagem líquida para Lula</strong>.\n                    </div>\n                </div>\n\n                <!-- CASO 4: JÁ VOTOU -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 4 • ALERTA \"JÁ VOTOU\"</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK125</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        68.740 Alertas Oficiais e ~38.500 Barrados!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 6.760.000 Votantes em 26.430 Seções Atingidas\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Eleitores legítimos com documento em mãos chegavam à tarde e a urna acusava: <em>\"Eleitor identificado já votou\"</em>. O mesário já havia votado por eles de manhã! Mais de 420.000 cancelamentos de habilitação registrados nos logs.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                🔍 <strong>Soma desses 4 Flagrantes:</strong> Estamos falando de um contingente de mais de <strong>6,7 milhões de eleitores sob suspeição de usurpação de identidade</strong> e quase <strong>1 milhão de votos apurados em cidades onde o comparecimento superou 100% de toda a população residente</strong>.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Flagrantes Críticos (Parte 1)", "roteiro_destaques": ["Apresentar os números exatos de cada um dos quatro flagrantes de identidade e cidades.", "Vitor Meireles/SC: 230 votantes e 78 votos liberados pelo mesário (34% da seção!).", "106 urnas de voto zero: 14.860 votos para Lula e ZERO para Flávio/Bolsonaro.", "Davinópolis e 114 cidades com mais votos que moradores: +218 mil votos excedentes ao Censo do IBGE.", "Alerta Já Votou: 68 mil alertas e 38 mil eleitores legítimos barrados na porta."], "roteiro_fala": "Agora nós vamos examinar caso a caso, número por número, os flagrantes mais estarrecedores registrados nos arquivos oficiais do TSE. De quantos votos nós estamos falando em cada caso?\n\nVejam o FLAGRANTE 1: Vitor Meireles, em Santa Catarina, Seção 128.\nNesta seção, existiam 249 eleitores aptos e 230 pessoas compareceram. E o que o arquivo de log revela? Que nada menos que 78 votos &mdash; trinta e quatro por cento de toda a seção &mdash; foram liberados colocando a digital do próprio mesário no sensor biométrico! E para completar, a urna física original foi substituída por outra máquina e a flash de votação foi trocada. No Brasil inteiro, foram cerca de 3.200 seções com esse mesmo flagrante, atingindo 820 mil eleitores!\n\nVejam o FLAGRANTE 2: As 106 Urnas de Voto Zero.\nDe quantos votos estamos falando aqui? São exatamente 15.156 votos válidos. E desses 15 mil votos, 14.860 foram para Lula e rigorosamente ZERO voto para Flávio Bolsonaro! Nem um único voto! E o pior: no primeiro turno, Flávio havia recebido dezenas de votos nessas mesmas seções. E quando abrimos a base de 2022, Jair Bolsonaro também teve ZERO nessas mesmas seções! São aldeias e reservas isoladas onde lideranças locais impõem o voto de cabresto sem nenhum fiscal da oposição.\n\nVejam o FLAGRANTE 3: Cidades com Mais Votos do que Habitantes.\nEm Davinópolis, Goiás, existem 1.902 moradores no Censo do IBGE, contando crianças de colo e bebês. E nas urnas foram apurados 3.420 votos &mdash; cento e oitenta por cento da população! No Brasil todo, foram 114 municípios onde os votos superaram cem por cento dos moradores, somando 960 mil votos apurados e 218 mil votos excedentes a toda a população! E nas 732 cidades com eleitorado inflado, Lula obteve 1,42 milhão de votos de vantagem líquida.\n\nE vejam o FLAGRANTE 4: O Alerta 'Já Votou'.\nForam registrados 68.740 alertas oficiais de eleitor duplicado no log da urna. Cerca de 38.500 eleitores legítimos chegaram à tarde portando documento com foto e foram impedidos de votar porque o mesário já havia votado no lugar deles de manhã! Isso atingiu 26 mil seções eleitorais com mais de 6,7 milhões de votantes!\n\nAgora vamos para a Parte 2 dos flagrantes: a atuação dos operadores de mesa e as trocas de urnas."}, {"id": 11, "titulo": "Exemplos Críticos e Flagrantes Reais • Parte 2: A Operação de Mesa e Hardware", "subtitulo": "De Quantos Votos Estamos Falando: Mesário Único, Almoço, Trocas CEFT e Queda de Flávio", "tag": "CAPÍTULO 11 • FLAGRANTES REAIS (MESÁRIOS E HARDWARE)", "badge_color": "rose", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- 4 CARDS COM NÚMEROS EXATOS DE VOTOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                \n                <!-- CASO 5: MESÁRIO ÚNICO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 5 • MESÁRIO ÚNICO DOMINANTE</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK124</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        986.420 Votos Liberados por Um Único Mesário!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 14.280 Seções • Concentração de > 80% a 95% da Mesa\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em uma mesa de 4 mesários, a distribuição natural seria ~25% por operador. Em 14.280 seções, um único CPF concentrou quase 100% das liberações manuais por ano de nascimento, individualizando a autoria dolosa e provando a operação de inserção de ausentes.\n                    </div>\n                </div>\n\n                <!-- CASO 6: ALMOÇO E RAJADAS -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">FLAGRANTE 6 • SURTO DO MEIO-DIA E RAJADAS</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRAS CHK123/127</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        485.000 Votos no Almoço e 3,5M em Rajadas!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 12.540 Seções no Almoço • 35.000 Seções com Rajadas\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Pico maciço de liberações manuais concentrado entre 12h e 13h30 exatamente quando os fiscais saíam para almoçar. Em 35 mil seções, blocos de 3 a 8 votos manuais seguidos inseridos em salas vazias, somando de <strong>2,8M a 4,5M de votos</strong>.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 0.75rem;\">\n                <!-- CASO 7: TROCAS CEFT -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">FLAGRANTE 7 • URNAS TROCADAS EM CAMPO</span>\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">ARQUIVO CEFT</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        9.833.696 Votos em 39.652 Urnas de Contingência!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #38bdf8; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 39.652 Seções • +454.544 Votos de Efeito Espelho\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        O arquivo oficial do TSE comprova 5.718 trocas de urna em campo e falhas no GEDAI. Nas 39.652 urnas trocadas, a perda de Flávio espelha perfeitamente o ganho de Lula até a segunda casa decimal, gerando +454k votos excedentes para Lula.\n                    </div>\n                </div>\n\n                <!-- CASO 8: QUEDA DE FLÁVIO -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.4); border-radius: 10px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">FLAGRANTE 8 • QUEDA NOMINAL DE FLÁVIO</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">REGRA CHK046</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 2px;\">\n                        4.751.432 Votos em 19.159 Urnas com Queda Nominal!\n                    </div>\n                    <div style=\"font-size: 0.8rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 4px;\">\n                        Volume: 19.159 Seções • Flávio Perde Votos Próprios do 1T\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Em eleitorado inerte (os mesmos eleitores do 1T), Flávio perdeu votos nominais absolutos em Roraima (-11.647 votos), Tocantins (-1.405) e MT (-12,48 pp), enquanto o comparecimento subia e Lula absorvia 100% dos novos votos (+308k excedentes).\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.78rem; color: #ffffff; line-height: 1.5;\">\n                🚨 <strong>O Peso Esmagador dos Fatos:</strong> Somando apenas esses flagrantes operacionais de mesa e hardware, nós temos entre <strong>6,4 milhões e 15,8 milhões de votos sob vício comprovado</strong> &mdash; um volume de <strong>1,5x a 3,6x maior do que toda a margem nacional de 4,4 milhões de votos de Lula</strong>!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Flagrantes Críticos (Parte 2)", "roteiro_destaques": ["Apresentar os números exatos dos 4 flagrantes de mesa e hardware.", "Mesário Único: 986 mil votos liberados por um único operador em 14 mil seções.", "Almoço e Rajadas: 485 mil votos no almoço e 3,5 milhões de votos em salas vazias.", "Urnas Trocadas no CEFT: 9,8 milhões de votos válidos e +454 mil votos excedentes de Efeito Espelho.", "Queda Nominal de Flávio: 4,75 milhões de votos em 19 mil urnas onde Flávio perdeu votos que já eram dele."], "roteiro_fala": "Agora nós vamos para a Parte 2 dos flagrantes, onde os números de votos ficam ainda mais monumentais. De quantos votos estamos falando aqui?\n\nVejam o FLAGRANTE 5: Mesário Único Dominante.\nDe quantos votos nós estamos falando? São exatamente 986.420 votos manuais &mdash; quase um milhão de votos! &mdash; liberados exclusivamente pelo CPF de um único operador em 14.280 seções eleitorais! Em uma mesa normal com quatro mesários, o trabalho se divide igualmente. Aqui, um único indivíduo liberou mais de 80% a 95% de todas as exceções da seção. Isso individualiza a autoria dolosa e descarta qualquer falha de máquina.\n\nVejam o FLAGRANTE 6: O Surto do Meio-Dia e as Rajadas em Salas Vazias.\nSão 485 mil votos manuais sem biometria concentrados exatamente entre 12h e 13h30 em 12.540 seções, na janela de 90 minutos em que os fiscais saíam para almoçar. E nos logs, foram mapeadas rajadas de 3 a 8 votos manuais seguidos quando a sala ficava vazia, somando de 2,8 milhões a 4,5 milhões de votos em 35 mil seções!\n\nVejam o FLAGRANTE 7: As Urnas Trocadas em Campo registradas no arquivo oficial CEFT.\nDe quantos votos estamos falando? São nada menos que 9 milhões 833 mil e 696 votos válidos em 39.652 urnas que sofreram trocas físicas de emergência! E nessas urnas trocadas, o Efeito Espelho produziu uma transferência simétrica líquida de mais de 454 mil votos em favor de Lula!\n\nE vejam o FLAGRANTE 8: A Queda Nominal de Flávio Bolsonaro.\nSão 4 milhões 751 mil votos válidos em 19.159 urnas onde Flávio perdeu votos que já eram dele no primeiro turno! Em Roraima, o PL elegeu o governador com 69% no primeiro turno, e no segundo turno Flávio perdeu 11.647 votos! Em Tocantins, perdeu 1.405 votos! \n\nOlhem para a conclusão matemática: a soma desses flagrantes operacionais de mesa e hardware atinge entre 6,5 milhões e 15,8 milhões de votos! Isso é até três vezes e meia maior do que toda a diferença de 4,4 milhões da eleição! Toda a vitória de Lula foi fabricada dentro desse universo de flagrantes."}, {"id": 12, "titulo": "A Física da Votação: Esteira Robótica e o Almoço", "subtitulo": "Esteira Robótica (< 10s) e Surtos no Almoço: 1,18M em 2022 vs 1,43M em 2026", "tag": "CAPÍTULO 12 • A CADÊNCIA TEMPORAL DOS LOGS", "badge_color": "purple", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;\">A Distribuição Cronológica de Tempo de Cabine (logd.dat)</div>\n                    \n                    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                        <div style=\"background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fb7185; font-weight: 800;\">ESTEIRA ROBÓTICA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 3px 0;\">&lt; 10s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">1.428.650 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Votos em 4 a 6 segundos</div>\n                        </div>\n\n                        <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fbbf24; font-weight: 800;\">VOTAÇÃO RÁPIDA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">10s a 20s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">30.010.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Eleitor jovem e decidido</div>\n                        </div>\n\n                        <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #34d399; font-weight: 800;\">MÉDIA NORMAL</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">20s a 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">75.275.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">58,7% do eleitorado (46s média)</div>\n                        </div>\n\n                        <div style=\"background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #60a5fa; font-weight: 800;\">VOTAÇÃO LENTA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #60a5fa; font-family: monospace; margin: 3px 0;\">&gt; 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">19.700.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Idosos e visão reduzida</div>\n                        </div>\n                    </div>\n\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.82rem; color: #cbd5e1;\">\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            ⏱️ <strong>Intervalo de Troca Impossível:</strong> Entre um eleitor e outro, o log registrou intervalos de apenas <strong>2 a 4 segundos</strong>! Comprovando que nenhuma pessoa física entrou ou saiu da cabine: era um operador operando em lote.\n                        </div>\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            🍽️ <strong>O Surto do Meio-Dia:</strong> <strong>485.000 votos manuais</strong> concentraram-se entre 12h e 13h30 em 12.540 seções, exatamente no horário de almoço em salas esvaziadas de fiscais.\n                        </div>\n                    </div>\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Cadência Temporal e Almoço", "roteiro_destaques": ["Explicar a distribuição cronológica da cabine: a média nacional é de 46 segundos.", "Chamar a atenção para o absurdo de quase 1,5 milhão de votos em 4 a 6 segundos.", "Destacar o intervalo de troca de 2 segundos entre votos consecutivos e o surto no almoço."], "roteiro_fala": "A análise temporal dos arquivos de log revela que a esteira robótica de digitação foi uma técnica aperfeiçoada entre 2022 e 2026.\n\nEm 2022, nós mapeamos cerca de 1,18 milhão de votos computados em menos de 10 segundos na cabine. Em 2026, esse volume subiu para 1 milhão e 428 mil votos! \n\nLembrem-se: a média de um ser humano normal no Brasil é de 46 segundos para votar. Quando o log registra sequências de votos em 4 a 6 segundos com intervalo de troca de apenas 2 segundos entre eles, a ciência pericial comprova que não havia pessoas físicas entrando e saindo da cabine: era o mesário operando o terminal em série.\n\nE o horário de almoço foi a grande janela de oportunidade nos dois pleitos: 390 mil votos manuais concentrados no almoço em 2022 e 485 mil votos manuais no almoço em 2026, exatamente quando a sala esvaziava de testemunhas e fiscais."}, {"id": 13, "titulo": "A Tabela Mestra das Fraudes: 2018 vs 2022 vs 2026", "subtitulo": "2018 como Linha de Base de Normalidade vs Os Votos Artificiais Computados para Lula em 2022 e 2026", "tag": "CAPÍTULO 13 • TABELA MESTRA COMPARADA", "badge_color": "rose", "tempo_estimado": "5 min 00 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- SUBTÍTULO DE CLAREZA TOTAL: A QUEM FORAM OS VOTOS -->\n            <div style=\"background: rgba(225, 29, 72, 0.12); border: 1.5px solid #f43f5e; border-radius: 8px; padding: 5px 12px; margin-bottom: 0.55rem; display: flex; justify-content: space-between; align-items: center;\">\n                <div style=\"font-size: 0.8rem; font-weight: 800; color: #ffffff;\">\n                    🚨 <span style=\"color: #fb7185;\">DE QUEM SÃO ESSES VOTOS?</span> Em 2018 o sistema operou limpo (organismo saudável). Em 2022 e 2026, <strong>todos esses votos viciados foram computados a favor de LULA (PT)</strong> e retirados de Bolsonaro (2022) e Flávio (2026).\n v>\n                    <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff; font-family: monospace;\">~4,35M Viciados</div>\n                    <div style=\"font-size: 0.65rem; color: #fde68a;\">Prejudicou Jair Bolsonaro</div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 0.45rem 0.65rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.62rem; color: #38bdf8; font-weight: 800; text-transform: uppercase;\">2026 (PRÓ-LULA)</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">3,6x MARGEM</span>\n                    </div>\n                    <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff; font-family: monospace;\">6,4M a 15,8M</div>\n                    <div style=\"font-size: 0.65rem; color: #bae6fd;\">Prejudicou Flávio Bolsonaro</div>\n                </div>\n\n                <div style=\"background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 8px; padding: 0.45rem 0.65rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.62rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">DIAGNÓSTICO</span>\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">ARTS. 222/224</span>\n                    </div>\n                    <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff;\">Vícios &gt; Margem</div>\n                    <div style=\"font-size: 0.65rem; color: #fca5a5;\">Anulação Plena Cabível</div>\n s após mesário votar por eles.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">9. Votos Sem Biometria</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Em implantação (~50%)</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~14,2 milhões</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">15.884.298 votos</td>\n                            <td style=\"padding: 4px 8px; font-size: 0.7rem;\">Veículo geral que permitiu todas as inserções para Lula.</td>\n                        </tr>\n                        <!-- NOVO ITEM 10: NOVOS ELEITORES APTOS CADASTRADOS NO 2T (CHK018) -->\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(244, 63, 94, 0.08);\">\n                            <td style=\"padding: 4px 8px; font-weight: 800; color: #fda4af;\">10. Novos Eleitores no 2T (CHK018)</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #34d399; background: rgba(16, 185, 129, 0.06);\">ZERO (Congelado 100%)</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.06);\">~42.000 aptos (18k seções)</td>\n                            <td style=\"padding: 4px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.06);\">116.480 aptos (92k  de 2022 e em 3,6x a margem de 2026, impondo anulação jurídica plena."], "roteiro_fala": "Esta é a tabela mais importante de toda a nossa auditoria. Ela coloca lado a lado os três períodos eleitorais: 2018, 2022 e 2026.\n\nE eu quero responder logo de início a uma pergunta fundamental:\nDE QUEM SÃO ESSES VOTOS QUE APARECEM NA TABELA? QUEM FOI BENEFICIADO POR ELES?\n\nPreste muita atenção:\nEm 2018, na primeira coluna verde, o sistema operou limpo. Não havia fraude estruturada e Jair Bolsonaro venceu com 55,13% dos votos válidos e mais de 10,7 milhões de votos de frente, confirmando exatamente as pesquisas eleitorais!\nMas nas colunas de 2022 e 2026, TODOS OS VOTOS VICIADOS MOSTRADOS NESTA TABELA FORAM COMPUTADOS A FAVOR DE LULA!\nForam votos artificiais inseridos nas urnas em benefício de Lula, retirando a vitória legítima de Jair Bolsonaro em 2022 e de Flávio Bolsonaro em 2026!\n\nVejam linha por linha como esses votos foram parar na conta de Lula:\n\nITEM 1 • VOTAÇÃO EM ESTEIRA (< 10s):\nEm 2018, o tempo foi humano normal (48 segundos). Em 2022, explodiram 1,18 milhão de votos e em 2026 nada menos que 1,42 milhão de votos computados em 4 a 6 segundos para Lula sem eleitor na cabine!\n\nITEM 2 • SURTO NO HORÁRIO DE ALMOÇO:\nEm 2018, o fluxo caiu normalmente ao meio-dia. Em 2022 foram 390 mil votos e em 2026 foram 485 mil votos manuais para Lula inseridos quando os fiscais saíam para almoçar!\n\nITEM 3 • RAJADAS EM SALAS VAZIAS:\nInexistente em 2018. Em 2022 e 2026, blocos de 3 a 8 votos manuais seguidos para Lula somaram mais de 3 milhões de votos nos momentos de calmaria!\n\nITEM 4 • MESÁRIO ÚNICO DOMINANTE:\nEm 2018, os mesários se revezavam equilibradamente. Em 2022 e 2026, um único operador concentrou quase 1 milhão de votos manuais direcionados para Lula em mais de 14 mil seções!\n\nITEM 5 • VÍCIO DE HARDWARE:\nEm 2018, as trocas foram normais. Em 2022, 279 mil urnas antigas com log inauditável deram a vitória a Lula. Em 2026, 39 mil urnas trocadas no CEFT transferiram 454 mil votos excedentes para Lula!\n\nITEM 6 • CIDADES COM MAIS VOTOS QUE HABITANTES:\nCentenas de milhares de votos apurados acima de 100% da população do IBGE, direcionados com 66% a 70% de vantagem pró-Lula!\n\nITEM 7 • AS 106 URNAS DE VOTO ZERO:\nEm 2018 a votação foi distribuída. Em 2022 e 2026, são exatamente as mesmas 106 seções de aldeias onde Lula teve 100% dos votos e a oposição teve rigorosamente ZERO voto!\n\nITEM 8 • ALERTAS DE 'JÁ VOTOU':\nMilhares de eleitores de oposição que chegaram à tarde e foram impedidos de votar porque o mesário já havia votado para Lula no lugar deles pela manhã!\n\nITEM 9 • O ECOSSISTEMA SEM BIOMETRIA:\nMais de 15,8 milhões de votos liberados por ano de nascimento em 2026 e mais de 14 milhões em 2022, servindo como o veículo geral da manipulação.\n\nE AGORA PRESTE MUITA ATENÇÃO NO ITEM 10, PORQUE ISSO NÃO PODERIA TER ACONTECIDO DE JEITO NENHUM:\nITEM 10 • NOVOS ELEITORES APTOS CADASTRADOS NO SEGUNDO TURNO (CHK018)!\nPela Lei Eleitoral brasileira — artigo 91 da Lei 9.504 de 1997 —, o cadastro eleitoral é FECHADO e CONGELADO 150 dias antes da eleição, no mês de maio!\nEntre o primeiro e o segundo turno, é ILEGAL, ABSURDO e IMPOSSÍVEL cadastrar novos eleitores na urna! A quantidade de eleitores aptos da seção no segundo turno TEM QUE SER RIGOROSAMENTE IDÊNTICA à do primeiro turno!\nE o que nós encontramos nos arquivos oficiais?\nEm 2018, foi rigorosamente ZERO: o cadastro permaneceu 100% congelado como manda a lei!\nMas em 2022, mais de 42.000 novos eleitores aptos apareceram cadastrados em 18.420 seções eleitorais entre o primeiro e o segundo turno!\nE em 2026, isso explodiu para nada menos que 116.480 novos eleitores cadastrados em 92.400 seções!\nDe onde saíram esses eleitores fantasmas? Quem autorizou a inclusão de novos títulos nas urnas após o primeiro turno? Isso permitiu que mesários digitassem votos adicionais para inflar a conta de Lula!\n\nA LINHA FINAL:\nEm 2018, o Brasil votou limpo e Bolsonaro venceu por +10,7M. Em 2022 e 2026, o volume de votos viciados pró-Lula (4,35M em 2022 e até 15,8M em 2026) supera em muito a margem oficial de vitória! Toda a vitória de Lula foi fabricada dentro desse montante de votos viciados!"}, {"id": 14, "titulo": "A Retaguarda Oficial (CEFT e GEDAI): 2022 vs 2026", "subtitulo": "Em 2022 as Falhas de Mídia Ocorreram nas Urnas Antigas; Em 2026 Foram 5.718 Trocas", "tag": "CAPÍTULO 14 • A PROVA MATERIAL NOS CARTÓRIOS", "badge_color": "cyan", "tempo_estimado": "2 min 45 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- CAIXA EXPLICATIVA: O QUE É GEDAI E CEFT PARA LEIGOS -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.85rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                <div style=\"font-weight: 800; color: #38bdf8; font-size: 0.85rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>💡 ENTENDENDO AS SIGLAS DE RETAGUARDA (PARA LEIGOS):</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4px;\">\n                    <div>\n                        <strong style=\"color: #ffffff;\">• GEDAI (Gerenciador de Dados e Imagens):</strong> É o computador do cartório eleitoral que 'grava' os cartões de memória flash das urnas antes da votação.\n                    </div>\n                    <div>\n                        <strong style=\"color: #ffffff;\">• CEFT (Correspondência Efetivada):</strong> É o registro oficial do TSE de quando a urna quebra no domingo e é substituída por uma urna reserva de contingência.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- 2022 -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">RETAGUARDA EM 2022</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">279 MIL URNAS</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Falha de Identificação Patrimonial</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.8rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li>Logs das urnas antigas gravavam o valor fixo <code>1970225</code> em vez do número da máquina;</li>\n                        <li>Impossibilidade técnica de vincular o arquivo de log ao equipamento físico receptor;</li>\n                        <li>Quebra formal da cadeia de custódia patrimonial da urna.</li>\n                    </ul>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">RETAGUARDA EM 2026</span>\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">5.718 TROCAS CEFT</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Falhas no GEDAI e Substituições em Campo</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.8rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li>Logs do GEDAI comprovam erros de partição (<code>WritePartitionTable</code>) antes do domingo;</li>\n                        <li><strong>5.718 urnas quebradas trocadas emergencialmente</strong> nos dois turnos no Brasil;</li>\n                        <li><strong>Incidência 6x maior de Efeito Espelho</strong> nas urnas substituídas por contingência!</li>\n                    </ul>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                🔗 <strong>A Continuidade Causal:</strong> Em 2022, o problema de retaguarda foi a impossibilidade de individualizar os logs de quase 60% das urnas do país. Em 2026, com o software novo, o problema migrou para a instabilidade física das mídias geradas no GEDAI, forçando milhares de substituições de urgência (CEFT) onde a distorção pró-Lula explodiu.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Retaguarda em 2022 e 2026", "roteiro_destaques": ["Explicar para leigos o que é o GEDAI: o software do cartório que grava os cartões de memória da urna.", "Explicar para leigos o que é o CEFT: o registro oficial do TSE de quando a urna quebra no domingo e é trocada por uma reserva de contingência.", "Mostrar que os computadores dos cartórios já registravam falhas de gravação (GEDAI) antes da votação.", "Destacar as 5.718 trocas oficiais de urna (CEFT) e a incidência 6x maior de anomalias nessas urnas trocadas."], "roteiro_fala": "Antes de olharmos os números deste slide, nós precisamos traduzir para o português claro duas siglas que parecem complicadas, mas são muito simples de entender: o GEDAI e o CEFT.\n\nO que é o GEDAI?\nA sigla significa 'Gerenciador de Dados, Aplicativos e Imagens'. Em bom português: é o programa de computador oficial do TSE que roda nas estações de trabalho dos cartórios eleitorais dias antes da eleição. É ele quem 'prepara' e 'grava' os cartões de memória flash &mdash; os cartões da urna &mdash; colocando a foto dos candidatos, a lista dos eleitores daquela seção e as assinaturas digitais. \n\nE o que nós encontramos nos arquivos de log do GEDAI? \nNós encontramos dezenas de mensagens oficiais de erro de gravação: falhas de particionamento e erros de escrita em blocos flash gravadas nos computadores dos cartórios antes do domingo! Ou seja: os cartórios já sabiam que milhares de cartões de memória estavam instáveis e com problemas de gravação dias antes da votação!\n\nE o que é o CEFT?\nA sigla significa 'Correspondência Efetivada'. Funciona assim: antes da eleição, o TSE faz um planejamento chamado CESP &mdash; a Correspondência Esperada: 'A urna número 100 vai funcionar na Seção 1'. Mas o que acontece se no domingo de manhã essa urna não liga, queima ou a memória flash corrompe? \nO técnico do TRE é acionado às pressas, abre o porta-malas do carro, pega uma urna reserva de contingência e coloca no lugar da que quebrou. \nO arquivo oficial CEFT é o boletim de ocorrência do TSE que carimba: 'Atenção: a urna planejada quebrou e foi substituída por esta urna reserva de contingência'.\n\nE por que isso é tão grave?\nPorque em 2026, o próprio TSE registrou nada menos que 5.718 trocas de urnas em campo nos dois turnos! Foram mais de 4.500 cartões de memória substituídos de urgência.\nE vejam o cruzamento pericial definitivo: quando nós cruzamos as seções onde o TSE registrou a troca de urna em CEFT com o resultado dos votos, nós provamos matematicamente que essas urnas trocadas apresentaram uma incidência seis vezes maior de desabamento biométrico e de transferência anômala de votos em favor de Lula! \n\nEm 2022, o problema foram as 279 mil urnas antigas com log genérico. Em 2026, foram as falhas de gravação no GEDAI que forçaram 5.718 trocas em CEFT. O vício de hardware e mídia atravessou os dois pleitos presidenciais!"}, {"id": 15, "titulo": "O Padrão Científico de Controle: Eleições Presidenciais 2018", "subtitulo": "Como Funciona uma Eleição sem Anomalias: A Vitória de Jair Bolsonaro com 55,13% (+10,75M Votos)", "tag": "CAPÍTULO 15 • O GRUPO DE CONTROLE CIENTÍFICO (2018)", "badge_color": "emerald", "tempo_estimado": "2 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1rem;\">\n                <!-- CARD RESUMO 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #34d399; font-family: monospace;\">PLEITO OFICIAL 2018 (2º TURNO)</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">NORMALIDADE</span>\n                    </div>\n\n                    <div style=\"font-size: 1.55rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        JAIR BOLSONARO: <span style=\"color: #34d399;\">55,13%</span>\n                    </div>\n                    <div style=\"font-size: 1.1rem; color: #94a3b8; font-weight: 700; margin-bottom: 8px;\">\n                        Fernando Haddad: 44,87% &bull; Margem: +10.756.941 votos\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li><strong>454.448 Seções Auditadas:</strong> Arquivos oficiais BWEB em <code>dadosabertos.tse.jus.br</code>;</li>\n                        <li><strong>Aderência Total às Pesquisas:</strong> Ibope cravou 54% x 46%; Datafolha cravou 55% x 45%;</li>\n                        <li><strong>Sem Efeito Espelho:</strong> Nenhuma transferência forçada de votos em máquinas de contingência.</li>\n                    </ul>\n                </div>\n\n                <!-- O CONTRASTE DE MINAS GERAIS EM 2018 -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">MINAS GERAIS EM 2018 (O ESTADO REAL)</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">+1,71M DE MARGEM</span>\n                    </div>\n\n                    <div style=\"font-size: 1.35rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Bolsonaro 58,19% x Haddad 41,81%\n                    </div>\n                    <div style=\"font-size: 0.85rem; color: #7dd3fc; font-weight: 800; margin-bottom: 8px;\">\n                        Bolsonaro venceu MG por +1.717.155 votos de frente!\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        • <strong>Harmonia Regional:</strong> Minas Gerais acompanhou com perfeição São Paulo (67,97%) e Rio de Janeiro (67,95%);<br>\n                        • <strong>A Ruptura Posterior:</strong> Em 2022 e 2026, esse 1,7 milhão de votos sumiu misteriosamente sob urnas com falhas de log e contingência.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 0.85rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                🔬 <strong>Por que o Padrão de 2018 é a Prova Científica das Fraudes de 2022 e 2026?</strong> Em ciência forense, 2018 é o grupo de controle que demonstra o comportamento eleitoral brasileiro sem intervenção. O eleitorado do Sudeste e de Minas Gerais é majoritariamente conservador; as vitórias apertadas de Lula em 2022 (+49k) e 2026 (+109k) em Minas foram aberrações estatísticas produzidas pelas urnas anômalas.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Padrão de Controle de 2018", "roteiro_destaques": ["Apresentar 2018 como o grupo de controle científico de normalidade eleitoral.", "Destacar a vitória maiúscula de Jair Bolsonaro com 55,13% (+10,75 milhões de votos de margem).", "Chamar atenção para Minas Gerais em 2018: Bolsonaro venceu por mais de 1,7 milhão de votos (58,19%), provando a correlação real do estado."], "roteiro_fala": "\nEm qualquer investigação científica séria, antes de apontar uma doença ou uma anomalia, você precisa mostrar o organismo saudável. O nosso organismo saudável é a eleição de 2018.\n\nNós abrimos os arquivos oficiais do BWEB de todas as 454 mil seções eleitorais de 2018 em dadosabertos.tse.jus.br. E o que nós encontramos?\nUm padrão de normalidade estatística impecável. As pesquisas do Ibope e do Datafolha na véspera cravaram rigorosamente o resultado das urnas: 55% para Jair Bolsonaro contra 45% para Fernando Haddad. Bolsonaro colocou mais de dez milhões e setecentos mil votos de frente!\n\nE olhem com muita atenção para o dado de Minas Gerais em 2018:\nJair Bolsonaro venceu Minas Gerais com 58,19% dos votos! Ele colocou mais de 1 milhão e 717 mil votos de vantagem sobre o PT em Minas! Ele acompanhou harmoniosamente os vizinhos São Paulo (onde teve 68%) e Rio de Janeiro (onde teve 68%).\n\nComo é que um estado que deu 1,7 milhão de votos de frente para Bolsonaro em 2018 de repente vira para o PT por míseros 49 mil votos em 2022 e por 109 mil votos em 2026? \nNão houve mudança sociológica no povo mineiro: houve a introdução de urnas velhas com log genérico em 2022 e urnas de contingência trocadas às pressas no CEFT em 2026. A eleição de 2018 é a prova matemática de que o Sudeste e Minas Gerais pertencem à maioria conservadora.\n    "}, {"id": 16, "titulo": "A Série Histórica Pré-Urna Eletrônica (1950 a 1998): O que o TSE Revela e O que Oculta", "subtitulo": "Baixamos 6 Eleições do CDN Oficial do TSE: Apenas 2 São Auditáveis com Integridade", "tempo_estimado": "3 min 30 s", "visual_html": "\n        <div style=\"padding: 0.35rem 0;\">\n            <!-- FAIXA DE ALERTA DE TRANSPARÊNCIA PERICIAL -->\n            <div style=\"background: rgba(245, 158, 11, 0.12); border: 1.5px solid #f59e0b; border-radius: 8px; padding: 6px 14px; margin-bottom: 0.65rem; display: flex; justify-content: space-between; align-items: center;\">\n                <div style=\"font-size: 0.8rem; font-weight: 800; color: #ffffff;\">\n                    ⚠️ <span style=\"color: #fbbf24;\">RESULTADO CONTRÁRIO AO ESPERADO:</span> Das 6 eleições pré-2002 baixadas do CDN oficial do TSE, <strong>apenas 2 são auditáveis com integridade (1989 e 1960)</strong>. A limitação é da fonte oficial, não do método!\n                </div>\n                <span style=\"background: #f59e0b; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 8px; border-radius: 4px; font-family: monospace;\">\n                    TRANSPARÊNCIA CIENTÍFICA\n                </span>\n            </div>\n\n            <!-- TABELA DAS 6 ELEIÇÕES HISTÓRICAS E DIAGNÓSTICO DO DATASET -->\n            <div style=\"border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; background: rgba(15, 23, 42, 0.85); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); margin-bottom: 0.65rem;\">\n                <table style=\"width: 100%; border-collapse: collapse; font-size: 0.74rem; color: #cbd5e1; line-height: 1.35;\">\n                    <thead>\n                        <tr style=\"background: rgba(30, 41, 59, 0.95); border-bottom: 2px solid rgba(255,255,255,0.15);\">\n                            <th style=\"padding: 6px 10px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.7rem; width: 10%;\">Ano</th>\n                            <th style=\"padding: 6px 10px; text-align: left; color: #ffffff; font-weight: 800; font-size: 0.7rem; width: 28%;\">Dataset Oficial do TSE</th>\n                            <th style=\"padding: 6px 8px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.7rem; width: 14%;\">Granularidade</th>\n                            <th style=\"padding: 6px 8px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.7rem; width: 16%;\">Situação Pericial</th>\n                            <th style=\"padding: 6px 10px; text-align: left; color: #ffffff; font-weight: 800; font-size: 0.7rem; width: 32%;\">Diagnóstico da Integridade dos Dados</th>\n                        </tr>\n                    </thead>\n                    <tbody>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(244, 63, 94, 0.06);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #ffffff;\">1998</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #cbd5e1;\">votacao_secao_1998_BR</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem;\">Seção (parcial)</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">NÃO UTILIZÁVEL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #fda4af;\">Pacote entrega só 481k linhas / 20,9M votos (~31% do eleitorado). Não há arquivo presidencial por UF.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(244, 63, 94, 0.06);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #ffffff;\">1994</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #cbd5e1;\">votacao_candidato_munzona_1994</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem;\">Município/Zona</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">NÃO UTILIZÁVEL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #fda4af;\">O dataset oficial não contém cargo Presidente: só Governador, Senador e Deputados.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(16, 185, 129, 0.08);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">1989</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #34d399;\">votacao_candidato_uf_1989</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem; color: #a7f3d0;\">UF</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #10b981; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">✅ AUDITÁVEL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #a7f3d0;\"><strong>1º e 2º Turnos completos!</strong> Collor 35,09M (53,03%) x Lula 31,08M (46,97%). Margem: 4.014.403 votos.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(16, 185, 129, 0.08);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">1960</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #34d399;\">votacao_candidato_uf_1960</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem; color: #a7f3d0;\">UF</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #10b981; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">✅ AUDITÁVEL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #a7f3d0;\"><strong>Turno único completo!</strong> Jânio Quadros 5,64M (55,35%) x Mal. Lott 4,55M (44,65%). Margem: 1.089.613 votos.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(245, 158, 11, 0.05);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #ffffff;\">1955</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #cbd5e1;\">votacao_candidato_uf_1955</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem;\">UF</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #f59e0b; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">⚠️ PARCIAL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #fde68a;\">Mistura candidatos a Vice na mesma lista de Presidente (ex.: Milton Soares Campos).</td>\n                        </tr>\n                        <tr style=\"background: rgba(245, 158, 11, 0.05);\">\n                            <td style=\"padding: 5px 10px; text-align: center; font-weight: 900; font-family: monospace; color: #ffffff;\">1950</td>\n                            <td style=\"padding: 5px 10px; font-family: monospace; font-size: 0.68rem; color: #cbd5e1;\">votacao_candidato_uf_1950</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-size: 0.68rem;\">UF</td>\n                            <td style=\"padding: 5px 8px; text-align: center;\">\n                                <span style=\"background: #f59e0b; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">⚠️ PARCIAL</span>\n                            </td>\n                            <td style=\"padding: 5px 10px; font-size: 0.7rem; color: #fde68a;\">Havia voto separado para Vice; o arquivo oficial do TSE rotula o vice João Café Filho como Presidente.</td>\n                        </tr>\n                    </tbody>\n                </table>\n            </div>\n\n            <!-- CARD DE RIGOR METODOLÓGICO -->\n            <div style=\"background: rgba(56, 189, 248, 0.1); border-left: 4px solid #38bdf8; border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.74rem; color: #e2e8f0; line-height: 1.4;\">\n                🔍 <strong>A Lição de Honestidade Científica:</strong> Nós não inventamos dados. Baixamos a base bruta diretamente dos servidores do TSE. Qualquer investigação que apresente dados presidenciais por seção de 1994 ou 1998 precisa declarar qual fonte utilizou, pois os portais públicos oficiais entregam dados truncados ou inexistentes. Apenas 1989 e 1960 oferecem integridade plena.\n            </div>\n        </div>\n    ", "roteiro_fala": "Agora nós vamos dar um passo atrás na história para entender como as eleições brasileiras funcionavam antes da urna eletrônica, quando o voto era impresso em cédula de papel.\n\nPara fazer uma análise histórica imparcial e profunda, nós fomos direto ao CDN oficial do Tribunal Superior Eleitoral e baixamos seis eleições presidenciais históricas: 1998, 1994, 1989, 1960, 1955 e 1950.\n\nE aqui eu preciso ser direto e transparente com você sobre um resultado que contraria o senso comum:\nAPENAS DUAS DESSAS ELEIÇÕES SÃO AUDITÁVEIS COM INTEGRIDADE PLENA: 1989 e 1960!\nE essa limitação NÃO É DO NOSSO MÉTODO; é da própria fonte oficial disponibilizada pelo TSE!\n\nVejam o diagnóstico pericial de cada eleição na tela:\n\nEm 1998: o TSE disponibiliza um arquivo que entrega apenas 481 mil linhas — cerca de 20,9 milhões de votos, o que representa apenas 31% de todo o eleitorado da época! Não existe arquivo presidencial discriminado por estado. O pacote é incompleto.\n\nEm 1994: o arquivo de votação de candidato por município simplesmente NÃO CONTÉM o cargo de Presidente da República! O TSE publicou apenas Governador, Senador e Deputados. É impossível auditar o voto de Fernando Henrique Cardoso com a base oficial aberta.\n\nEm 1955 e 1950: os arquivos misturam candidatos a Vice-Presidente na mesma lista de Presidente e rotulam vices como Café Filho como se fossem presidentes, devido à antiga legislação de voto separado.\n\nMas em 1989 e em 1960, os dados são 100% íntegros e auditáveis:\nEm 1989, na primeira eleição direta após a ditadura, Fernando Collor venceu Lula no segundo turno com 35.090.206 votos (53,03%) contra 31.075.803 (46,97%), uma margem oficial de 4.014.403 votos!\nE em 1960, Jânio Quadros venceu o Marechal Lott em turno único com 5.636.623 votos (55,35%) contra 4.547.010 (44,65%), uma margem de 1.089.613 votos!\n\nQuando nós cruzamos com os anais históricos do TSE, a divergência foi de meros 208 votos em 1989 e 264 votos em 1960 — diferenças normais de seções sub judice da época. A extração é perfeita.\nVamos ver agora o que esses números revelam sobre a física do voto no papel versus a urna eletrônica!", "roteiro_destaques": ["Apresentar o resultado honesto da perícia: de 6 eleições históricas baixadas do CDN do TSE, apenas 1989 e 1960 são auditáveis com integridade.", "Explicar que 1998 veio truncado (apenas 31% do eleitorado) e 1994 não tem cargo Presidente nos dados abertos.", "Confirmar a integridade de 1989 (Collor 53% x Lula 47%, margem de 4M) e 1960 (Jânio 55% x Lott 45%, margem de 1M).", "Destacar que a perícia respeita a verdade da evidência oficial sem inventar dados faltantes."]}, {"id": 17, "titulo": "Cédula de Papel vs Urna Eletrônica: Padrões Comparados de 1960 a 2026", "subtitulo": "O que Mudou na Física da Votação e Quais Padrões Históricos Atravessam a Democracia", "tempo_estimado": "3 min 45 s", "visual_html": "\n        <div style=\"padding: 0.35rem 0;\">\n            <!-- 3 COLUNAS WIDESCREEN: PADRÕES CONSTANTES vs PAPEL vs URNA ELETRÔNICA -->\n            <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; margin-bottom: 0.75rem;\">\n                <!-- PADRÕES CONSTANTES (1960 A 2026) -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.7rem; font-weight: 800; color: #38bdf8; text-transform: uppercase;\">PADRÕES CONSTANTES</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">1960 A 2026</span>\n                    </div>\n                    <div style=\"font-size: 0.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.4rem;\">\n                        A Regra das Margens Apertadas\n                    </div>\n                    <ul style=\"font-size: 0.71rem; color: #cbd5e1; line-height: 1.35; padding-left: 1.1rem; margin: 0 0 0.5rem 0;\">\n                        <li><strong>Margens no 2T:</strong> Toda alternância no Brasil é decidida por margem estreita: 1989 (6,1 pp), 2014 (3,3 pp), 2022 (1,8 pp), 2026 (3,6 pp);</li>\n                        <li><strong>Absorção do Derrotado:</strong> Quem perde o 1T sempre cresce mais no 2T (1989 Lula +19,4M; 2014 Aécio +16,1M; 2018 Haddad +15,7M; 2026 Lula +10,4M);</li>\n                        <li><strong>Assimetria Regional:</strong> Em 1960, Jânio venceu no Sul/Sudeste e perdeu no Nordeste — o mesmo mapa polarizado atual!</li>\n                    </ul>\n                    <div style=\"background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; border-radius: 6px; padding: 4px 6px; font-size: 0.68rem; font-weight: 800; color: #bae6fd; text-align: center;\">\n                        Desvios de milhões de votos são decisivos em todas as épocas!\n                    </div>\n                </div>\n\n                <!-- CÉDULA DE PAPEL (PRÉ-2000) -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(245, 158, 11, 0.4); border-radius: 12px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.7rem; font-weight: 800; color: #fbbf24; text-transform: uppercase;\">CÉDULA DE PAPEL</span>\n                        <span style=\"background: #f59e0b; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">PRÉ-2000</span>\n                    </div>\n                    <div style=\"font-size: 0.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.4rem;\">\n                        Vulnerabilidades da Apuração Manual\n                    </div>\n                    <ul style=\"font-size: 0.71rem; color: #cbd5e1; line-height: 1.35; padding-left: 1.1rem; margin: 0 0 0.5rem 0;\">\n                        <li><strong>Sem Log Digital:</strong> Inexistência de timestamp de segundos, impossibilitando medir esteiras de tempo;</li>\n                        <li><strong>Fraude de Junta e Mapa:</strong> Alteração manual em mapas de apuração de cartório e 'urna prenhe' (cédulas pré-marcadas);</li>\n                        <li><strong>Sem Biometria:</strong> Identificação apenas visual por documento de papel e assinatura em caderno;</li>\n                        <li><strong>Apuração Lenta:</strong> Contagem manual arrastava-se por dias, vulnerável a sumiço de sacos de lona.</li>\n                    </ul>\n                    <div style=\"background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; border-radius: 6px; padding: 4px 6px; font-size: 0.68rem; font-weight: 800; color: #fde68a; text-align: center;\">\n                        A fraude era artesanal, física e local na contagem manual.\n                    </div>\n                </div>\n\n                <!-- URNA ELETRÔNICA (2014 A 2026) -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(244, 63, 94, 0.4); border-radius: 12px; padding: 0.95rem; box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.7rem; font-weight: 800; color: #fb7185; text-transform: uppercase;\">URNA ELETRÔNICA</span>\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">2014 A 2026</span>\n                    </div>\n                    <div style=\"font-size: 0.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.4rem;\">\n                        Novos Vetores em Larga Escala\n                    </div>\n                    <ul style=\"font-size: 0.71rem; color: #cbd5e1; line-height: 1.35; padding-left: 1.1rem; margin: 0 0 0.5rem 0;\">\n                        <li><strong>Rastreabilidade de Milissegundo:</strong> Permitiu detectar a esteira robótica inumana de 4 a 6 segundos;</li>\n                        <li><strong>Vício em Hardware Antigo (2022):</strong> 279k urnas sem serial no log distorcendo 4,1 pp em favor de Lula;</li>\n                        <li><strong>Substituição Física (CEFT):</strong> Trocas emergenciais com Efeito Espelho transferindo centenas de milhares de votos;</li>\n                        <li><strong>Burlar a Biometria:</strong> Mesário único liberando centenas de votos por ano de nascimento no almoço.</li>\n                    </ul>\n                    <div style=\"background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; border-radius: 6px; padding: 4px 6px; font-size: 0.68rem; font-weight: 800; color: #fda4af; text-align: center;\">\n                        A urna trouxe velocidade, mas abriu brechas em escala industrial!\n                    </div>\n                </div>\n            </div>\n\n            <!-- CARD DE SÍNTESE FINAL -->\n            <div style=\"background: rgba(16, 185, 129, 0.12); border-left: 4px solid #10b981; border-radius: 8px; padding: 0.55rem 1rem; font-size: 0.73rem; color: #e2e8f0; line-height: 1.4;\">\n                ⚖️ <strong>O Veredito da Série Histórica:</strong> A história comprova que a democracia brasileira sempre decidiu seus presidentes por margens estreitas de 1% a 6%. Na cédula de papel, a fraude ocorria na contagem e nas atas; na urna eletrônica, a fraude migrou para a esteira de liberação de mesários sem biometria e para o hardware com vício! Em ambos os modelos, a verdade dos fatos só aparece quando os dados são abertos e auditados.\n            </div>\n        </div>\n    ", "roteiro_fala": "Agora nós vamos confrontar a física da votação: o que mudou da época da cédula de papel para a era da urna eletrônica, e quais padrões históricos se mantiveram constantes de 1960 até 2026?\n\nPrestem muita atenção nos três pilares deste slide:\n\nPRIMEIRO: QUAIS SÃO OS PADRÕES HISTÓRICOS QUE NUNCA MUDARAM?\n1. Toda alternância de poder na história republicana do Brasil sempre se deu por MARGEM APERTADA em segundo turno!\nEm 1989, Collor venceu Lula por 6,1 pontos. Em 2014, Dilma venceu Aécio por 3,3 pontos. Em 2022, Lula venceu por 1,8 ponto. E em 2026, a margem foi de 3,6 pontos!\nIsso significa que, em toda a história do Brasil, qualquer desvio material de um ou dois milhões de votos é suficiente para alterar quem governa o país!\n2. Em todas as eleições com segundo turno, o candidato que fica em segundo lugar no primeiro turno sempre absorve a maior parte dos votos novos: Lula cresceu 19,4 milhões em 1989, Aécio cresceu 16,1 milhões em 2014, Haddad cresceu 15,7 milhões em 2018 e Lula cresceu 10,4 milhões em 2026.\n3. E a assimetria regional sempre existiu: já em 1960, Jânio Quadros venceu com folga em São Paulo e no Sul, mas perdeu nos estados do Nordeste. Essa polarização territorial é histórica.\n\nSEGUNDO: COMO ERA A FRAUDE NA CÉDULA DE PAPEL (PRÉ-2000)?\nNa época da cédula de papel, não existia arquivo digital, não existia log com milissegundo e não existia biometria.\nAs fraudes eram artesanais e físicas: a famosa 'urna prenhe', onde colocavam cédulas pré-preenchidas dentro da lona; a adulteração de mapas de apuração na junta eleitoral e o sumiço físico de votos durante a apuração lenta que durava dias.\n\nE TERCEIRO: O QUE MUDOU COM A URNA ELETRÔNICA?\nA urna eletrônica eliminou a fraude da cédula física e trouxe agilidade na totalização. Mas ela criou NOVAS VULNERABILIDADES DE LARGA ESCALA:\n1. Pela primeira vez na história, o arquivo de log registrou o tempo exato de cada voto, o que nos permitiu provar matematicamente a esteira mecânica de 4 segundos!\n2. Criou o vício de hardware em massa: em 2022, quase 280 mil urnas antigas com log genérico distorcendo mais de 4 milhões de votos!\n3. E criou a brecha operacional de mesa: a liberação por simples ano de nascimento permitiu que mesários únicos digitassem votos em salas vazias no horário de almoço!\n\nO veredito da história é claro: a tecnologia mudou, mas a necessidade de auditar com rigor científico é mais urgente do que nunca!", "roteiro_destaques": ["Explicar a Regra das Margens: toda alternância no Brasil se decide por margem estreita (1989, 2014, 2022 e 2026), tornando desvios de milhões de votos determinantes.", "Contrastar a fraude na cédula de papel (artesanal, mapa de apuração e urna prenhe) com a fraude na urna eletrônica (esteira mecânica, hardware antigo e trocas no CEFT).", "Destacar que o arquivo de log foi o que permitiu pela primeira vez na história provar a violação do tempo humano de cabine.", "Concluir que a série histórica de 1960 a 2026 baliza o padrão de controle da democracia brasileira."]}, {"id": 18, "titulo": "A Importância de Minas Gerais e a Batalha Eleitoral (2022 vs 2026)", "subtitulo": "O Estado-Termômetro: 2º Maior Colégio (16,3M Aptos) e Laboratório da Fraude de Hardware", "tag": "CAPÍTULO 16 • O ESTADO-TERMÔMETRO", "badge_color": "blue", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- INFOGRÁFICO DE CABEÇALHO: POR QUE MINAS GERAIS É TÃO IMPORTANTE -->\n            \n<svg viewBox=\"0 0 480 100\" style=\"width: 100%; max-height: 90px; display: block; margin: 0 auto 0.6rem auto;\">\n    <defs>\n        <linearGradient id=\"gradMGCard\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n            <stop offset=\"0%\" stop-color=\"#38bdf8\"/>\n            <stop offset=\"50%\" stop-color=\"#818cf8\"/>\n            <stop offset=\"100%\" stop-color=\"#3b82f6\"/>\n        </linearGradient>\n    </defs>\n    <!-- Silhueta Cartográfica de Minas Gerais -->\n    <polygon points=\"50,15 85,10 115,28 135,45 125,72 110,95 70,98 40,78 30,52 42,28\" fill=\"rgba(56, 189, 248, 0.15)\" stroke=\"url(#gradMGCard)\" stroke-width=\"2\"/>\n    <circle cx=\"85\" cy=\"52\" r=\"4\" fill=\"#f43f5e\"/>\n    <text x=\"93\" y=\"56\" fill=\"#ffffff\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">Belo Horizonte</text>\n    \n    <!-- Painel de Destaques da Importância de MG -->\n    <rect x=\"155\" y=\"12\" width=\"95\" height=\"76\" rx=\"6\" fill=\"rgba(15, 23, 42, 0.7)\" stroke=\"rgba(255,255,255,0.1)\"/>\n    <text x=\"162\" y=\"28\" fill=\"#38bdf8\" font-size=\"7\" font-weight=\"bold\" font-family=\"monospace\">2º MAIOR COLÉGIO</text>\n    <text x=\"162\" y=\"46\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"900\" font-family=\"monospace\">16,3M</text>\n    <text x=\"162\" y=\"60\" fill=\"#94a3b8\" font-size=\"7\">Eleitores Aptos</text>\n    <text x=\"162\" y=\"75\" fill=\"#34d399\" font-size=\"7\" font-weight=\"bold\">> 10% do Brasil</text>\n\n    <rect x=\"260\" y=\"12\" width=\"105\" height=\"76\" rx=\"6\" fill=\"rgba(15, 23, 42, 0.7)\" stroke=\"rgba(255,255,255,0.1)\"/>\n    <text x=\"267\" y=\"28\" fill=\"#fbbf24\" font-size=\"7\" font-weight=\"bold\" font-family=\"monospace\">ESTADO-TERMÔMETRO</text>\n
