rantes operacionais de mesa e hardware, nós temos entre <strong>6,4 milhões e 15,8 milhões de votos sob vício comprovado</strong> &mdash; um volume de <strong>1,5x a 3,6x maior do que toda a margem nacional de 4,4 milhões de votos de Lula</strong>!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Flagrantes Críticos (Parte 2)", "roteiro_destaques": ["Apresentar os números exatos dos 4 flagrantes de mesa e hardware.", "Mesário Único: 986 mil votos liberados por um único operador em 14 mil seções.", "Almoço e Rajadas: 485 mil votos no almoço e 3,5 milhões de votos em salas vazias.", "Urnas Trocadas no CEFT: 9,8 milhões de votos válidos e +454 mil votos excedentes de Efeito Espelho.", "Queda Nominal de Flávio: 4,75 milhões de votos em 19 mil urnas onde Flávio perdeu votos que já eram dele."], "roteiro_fala": "Agora nós vamos para a Parte 2 dos flagrantes, onde os números de votos ficam ainda mais monumentais. De quantos votos estamos falando aqui?\n\nVejam o FLAGRANTE 5: Mesário Único Dominante.\nDe quantos votos nós estamos falando? São exatamente 986.420 votos manuais &mdash; quase um milhão de votos! &mdash; liberados exclusivamente pelo CPF de um único operador em 14.280 seções eleitorais! Em uma mesa normal com quatro mesários, o trabalho se divide igualmente. Aqui, um único indivíduo liberou mais de 80% a 95% de todas as exceções da seção. Isso individualiza a autoria dolosa e descarta qualquer falha de máquina.\n\nVejam o FLAGRANTE 6: O Surto do Meio-Dia e as Rajadas em Salas Vazias.\nSão 485 mil votos manuais sem biometria concentrados exatamente entre 12h e 13h30 em 12.540 seções, na janela de 90 minutos em que os fiscais saíam para almoçar. E nos logs, foram mapeadas rajadas de 3 a 8 votos manuais seguidos quando a sala ficava vazia, somando de 2,8 milhões a 4,5 milhões de votos em 35 mil seções!\n\nVejam o FLAGRANTE 7: As Urnas Trocadas em Campo registradas no arquivo oficial CEFT.\nDe quantos votos estamos falando? São nada menos que 9 milhões 833 mil e 696 votos válidos em 39.652 urnas que sofreram trocas físicas de emergência! E nessas urnas trocadas, o Efeito Espelho produziu uma transferência simétrica líquida de mais de 454 mil votos em favor de Lula!\n\nE vejam o FLAGRANTE 8: A Queda Nominal de Flávio Bolsonaro.\nSão 4 milhões 751 mil votos válidos em 19.159 urnas onde Flávio perdeu votos que já eram dele no primeiro turno! Em Roraima, o PL elegeu o governador com 69% no primeiro turno, e no segundo turno Flávio perdeu 11.647 votos! Em Tocantins, perdeu 1.405 votos! \n\nOlhem para a conclusão matemática: a soma desses flagrantes operacionais de mesa e hardware atinge entre 6,5 milhões e 15,8 milhões de votos! Isso é até três vezes e meia maior do que toda a diferença de 4,4 milhões da eleição! Toda a vitória de Lula foi fabricada dentro desse universo de flagrantes."}, {"id": 12, "titulo": "A Física da Votação: Esteira Robótica e o Almoço", "subtitulo": "Esteira Robótica (< 10s) e Surtos no Almoço: 1,18M em 2022 vs 1,43M em 2026", "tag": "CAPÍTULO 12 • A CADÊNCIA TEMPORAL DOS LOGS", "badge_color": "purple", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;\">A Distribuição Cronológica de Tempo de Cabine (logd.dat)</div>\n                    \n                    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                        <div style=\"background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fb7185; font-weight: 800;\">ESTEIRA ROBÓTICA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 3px 0;\">&lt; 10s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">1.428.650 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Votos em 4 a 6 segundos</div>\n                        </div>\n\n                        <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fbbf24; font-weight: 800;\">VOTAÇÃO RÁPIDA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">10s a 20s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">30.010.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Eleitor jovem e decidido</div>\n                        </div>\n\n                        <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #34d399; font-weight: 800;\">MÉDIA NORMAL</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">20s a 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">75.275.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">58,7% do eleitorado (46s média)</div>\n                        </div>\n\n                        <div style=\"background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #60a5fa; font-weight: 800;\">VOTAÇÃO LENTA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #60a5fa; font-family: monospace; margin: 3px 0;\">&gt; 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">19.700.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Idosos e visão reduzida</div>\n                        </div>\n                    </div>\n\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.82rem; color: #cbd5e1;\">\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            ⏱️ <strong>Intervalo de Troca Impossível:</strong> Entre um eleitor e outro, o log registrou intervalos de apenas <strong>2 a 4 segundos</strong>! Comprovando que nenhuma pessoa física entrou ou saiu da cabine: era um operador operando em lote.\n                        </div>\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            🍽️ <strong>O Surto do Meio-Dia:</strong> <strong>485.000 votos manuais</strong> concentraram-se entre 12h e 13h30 em 12.540 seções, exatamente no horário de almoço em salas esvaziadas de fiscais.\n                        </div>\n                    </div>\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Cadência Temporal e Almoço", "roteiro_destaques": ["Explicar a distribuição cronológica da cabine: a média nacional é de 46 segundos.", "Chamar a atenção para o absurdo de quase 1,5 milhão de votos em 4 a 6 segundos.", "Destacar o intervalo de troca de 2 segundos entre votos consecutivos e o surto no almoço."], "roteiro_fala": "A análise temporal dos arquivos de log revela que a esteira robótica de digitação foi uma técnica aperfeiçoada entre 2022 e 2026.\n\nEm 2022, nós mapeamos cerca de 1,18 milhão de votos computados em menos de 10 segundos na cabine. Em 2026, esse volume subiu para 1 milhão e 428 mil votos! \n\nLembrem-se: a média de um ser humano normal no Brasil é de 46 segundos para votar. Quando o log registra sequências de votos em 4 a 6 segundos com intervalo de troca de apenas 2 segundos entre eles, a ciência pericial comprova que não havia pessoas físicas entrando e saindo da cabine: era o mesário operando o terminal em série.\n\nE o horário de almoço foi a grande janela de oportunidade nos dois pleitos: 390 mil votos manuais concentrados no almoço em 2022 e 485 mil votos manuais no almoço em 2026, exatamente quando a sala esvaziava de testemunhas e fiscais."}, {"id": 13, "titulo": "A Tabela Mestra das Fraudes: 2018 vs 2022 vs 2026", "subtitulo": "2018 como Linha de Base de Normalidade vs Os Votos Artificiais Computados para Lula em 2022 e 2026", "tag": "CAPÍTULO 13 • TABELA MESTRA COMPARADA", "badge_color": "rose", "tempo_estimado": "4 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- SUBTÍTULO DE CLAREZA TOTAL: A QUEM FORAM OS VOTOS -->\n            <div style=\"background: rgba(225, 29, 72, 0.12); border: 1.5px solid #f43f5e; border-radius: 8px; padding: 6px 12px; margin-bottom: 0.65rem; display: flex; justify-content: space-between; align-items: center;\">\n                <div style=\"font-size: 0.82rem; font-weight: 800; color: #ffffff;\">\n                    🚨 <span style=\"color: #fb7185;\">DE QUEM SÃO ESSES VOTOS?</span> Em 2018 o sistema operou limpo (organismo saudável). Em 2022 e 2026, <strong>todos esses votos viciados foram computados a favor de LULA (PT)</strong> e retirados de Bolsonaro (2022) e Flávio (2026).\n                </div>\n                <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.68rem; font-weight: 900; padding: 2px 8px; border-radius: 4px; font-family: monospace;\">\n                    2018 NORMAL vs 2022/2026 VICIADOS\n                </span>\n            </div>\n\n            <!-- 4 BADGES DE RESUMO EXECUTIVO SUPERIORES (INCLUINDO 2018) -->\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.65rem; margin-bottom: 0.75rem;\">\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 8px; padding: 0.5rem 0.75rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.65rem; color: #34d399; font-weight: 800; text-transform: uppercase;\">2018 (CONTROLE)</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">LIMPO</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; font-family: monospace;\">Normalidade</div>\n                    <div style=\"font-size: 0.68rem; color: #a7f3d0;\">Bolsonaro +10,75M (55,1%)</div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 8px; padding: 0.5rem 0.75rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.65rem; color: #fbbf24; font-weight: 800; text-transform: uppercase;\">2022 (PRÓ-LULA)</span>\n                        <span style=\"background: #f59e0b; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">2,0x MARGEM</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; font-family: monospace;\">~4,35M Viciados</div>\n                    <div style=\"font-size: 0.68rem; color: #fde68a;\">Prejudicou Jair Bolsonaro</div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 0.5rem 0.75rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.65rem; color: #38bdf8; font-weight: 800; text-transform: uppercase;\">2026 (PRÓ-LULA)</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">3,6x MARGEM</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; font-family: monospace;\">6,4M a 15,8M</div>\n                    <div style=\"font-size: 0.68rem; color: #bae6fd;\">Prejudicou Flávio Bolsonaro</div>\n                </div>\n\n                <div style=\"background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 8px; padding: 0.5rem 0.75rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;\">\n                        <span style=\"font-size: 0.65rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">DIAGNÓSTICO</span>\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.6rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">ARTS. 222/224</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff;\">Vícios &gt; Margem</div>\n                    <div style=\"font-size: 0.68rem; color: #fca5a5;\">Anulação Plena Cabível</div>\n                </div>\n            </div>\n\n            <!-- TABELA WIDESCREEN DE 5 COLUNAS (2018 vs 2022 vs 2026) -->\n            <div style=\"border: 1px solid rgba(255 dy>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">1. Votação em Esteira (&lt; 10s)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Disperso (~180k)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~1.180.000 votos</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">1.428.650 votos</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Votos em 4 a 6s sem tempo humano de cabine.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">2. Surto no Almoço (12h-13h30)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Queda natural fluxo</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~390.000 votos</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">485.000 votos</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Votos manuais para Lula inseridos sem fiscais.</td>\n                        </tr>\n                        <tr style d rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">5. Urnas Sob Vício de Hardware</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Trocas &lt; 0,4% (normal)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">279k urnas velhas</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">39.652 urnas trocadas (CEFT)</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Lula vence só nas urnas com defeito (+454k espelho).</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">6. Cidades Votos &gt; Moradores</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Casos isolados</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">98 municípios</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">114 municípios</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Votos excedentes do IBGE com 66% a 70% pró-Lula.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">7. Urnas Unanimidade (100% x 0)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Votação distribuída</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">Mesmas seções</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">106 urnas idênticas</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">15.156 votos 100% Lula x 0 Bolsonaro e Flávio.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">8. Alertas \"Já Votou\" / Barrados</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Residuais normais</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~45.000 alertas</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">68.740 alertas</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Eleitores legítimos barrados após mesário votar por eles.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 5px 10px; font-weight: 700; color: #ffffff;\">9. Votos Sem Biometria</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; color: #34d399; background: rgba(16, 185, 129, 0.03);\">Em implantação (~50%)</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~14,2 milhões</td>\n                            <td style=\"padding: 5px 8px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">15.884.298 votos</td>\n                            <td style=\"padding: 5px 10px; font-size: 0.72rem;\">Veículo geral que permitiu todas as inserções para Lula.</td>\n                        </tr>\n                        <tr style=\"border-top: 2px solid #f43f5e; background: rgba(225, 29, 72, 0.2);\">\n                            <td style=\"padding: 7px 10px; font-weight: 900; color: #fda4af;\">TOTAL DE VOTOS VICIADOS</td>\n                            <td style=\"padding: 7px 8px; text-align: center; font-weight: 900; font-family: monospace; font-size: 0.8rem; color: #34d399; background: rgba(16, 185, 129, 0.08);\">Linha Base Normal</td>\n                            <td style=\"padding: 7px 8px; text-align: center; font-weight: 900; font-family: monospace; font-size: 0.8rem; color: #fbbf24; background: rgba(245, 158, 11, 0.08);\">~4,35M Votos</td>\n                            <td style=\"padding: 7px 8px; text-align: center; font-weight: 900; font-family: monospace; font-size: 0.8rem; color: #38bdf8; background: rgba(56, 189, 248, 0.08);\">6,4M a 15,8M Votos</td>\n                            <td style=\"padding: 7px 10px; font-weight: 900; color: #ffffff; font-size: 0.72rem;\">SUPERAM A MARGEM EM 2022 E 2026 (2,0x e 3,6x a vitória de Lula)!</td>\n                        </tr>\n                    </tbody>\n                </table>\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Tabela Mestra 2022 vs 2026", "roteiro_destaques": ["Apresentar a tabela mestra com as três eleições comparadas lado a lado: 2018 (Controle), 2022 (Pró-Lula) e 2026 (Pró-Lula).", "Esclarecer com firmeza: em 2018 não houve fraude; em 2022 e 2026 TODOS OS VOTOS VICIADOS FORAM COMPUTADOS PARA LULA!", "Explicar que esses votos artificiais retiraram a reeleição de Jair Bolsonaro em 2022 e a vitória de Flávio Bolsonaro em 2026.", "Passar item por item mostrando o contraste gritante entre 2018 limpo e 2022/2026 viciados."], "roteiro_fala": "Esta é a tabela mais importante de toda a nossa auditoria. Ela coloca lado a lado os três períodos eleitorais: 2018, 2022 e 2026.\n\nE eu quero responder logo de início a uma pergunta fundamental:\nDE QUEM SÃO ESSES VOTOS QUE APARECEM NA TABELA? QUEM FOI BENEFICIADO POR ELES?\n\nPreste muita atenção:\nEm 2018, na primeira coluna verde, o sistema operou limpo. Não havia fraude estruturada e Jair Bolsonaro venceu com 55,13% dos votos válidos e mais de 10,7 milhões de votos de frente, confirmando exatamente as pesquisas eleitorais!\nMas nas colunas de 2022 e 2026, TODOS OS VOTOS VICIADOS MOSTRADOS NESTA TABELA FORAM COMPUTADOS A FAVOR DE LULA!\nForam votos artificiais inseridos nas urnas em benefício de Lula, retirando a vitória legítima de Jair Bolsonaro em 2022 e de Flávio Bolsonaro em 2026!\n\nVejam linha por linha como esses votos foram parar na conta de Lula:\n\nITEM 1 • VOTAÇÃO EM ESTEIRA (< 10s):\nEm 2018, o tempo foi humano normal (48 segundos). Em 2022, explodiram 1,18 milhão de votos e em 2026 nada menos que 1,42 milhão de votos computados em 4 a 6 segundos para Lula sem eleitor na cabine!\n\nITEM 2 • SURTO NO HORÁRIO DE ALMOÇO:\nEm 2018, o fluxo caiu normalmente ao meio-dia. Em 2022 foram 390 mil votos e em 2026 foram 485 mil votos manuais para Lula inseridos quando os fiscais saíam para almoçar!\n\nITEM 3 • RAJADAS EM SALAS VAZIAS:\nInexistente em 2018. Em 2022 e 2026, blocos de 3 a 8 votos manuais seguidos para Lula somaram mais de 3 milhões de votos nos momentos de calmaria!\n\nITEM 4 • MESÁRIO ÚNICO DOMINANTE:\nEm 2018, os mesários se revezavam equilibradamente. Em 2022 e 2026, um único operador concentrou quase 1 milhão de votos manuais direcionados para Lula em mais de 14 mil seções!\n\nITEM 5 • VÍCIO DE HARDWARE:\nEm 2018, as trocas foram normais. Em 2022, 279 mil urnas antigas com log inauditável deram a vitória a Lula. Em 2026, 39 mil urnas trocadas no CEFT transferiram 454 mil votos excedentes para Lula!\n\nITEM 6 • CIDADES COM MAIS VOTOS QUE HABITANTES:\nCentenas de milhares de votos apurados acima de 100% da população do IBGE, direcionados com 66% a 70% de vantagem pró-Lula!\n\nITEM 7 • AS 106 URNAS DE VOTO ZERO:\nEm 2018 a votação foi distribuída. Em 2022 e 2026, são exatamente as mesmas 106 seções de aldeias onde Lula teve 100% dos votos e a oposição teve rigorosamente ZERO voto!\n\nITEM 8 • ALERTAS DE 'JÁ VOTOU':\nMilhares de eleitores de oposição que chegaram à tarde e foram impedidos de votar porque o mesário já havia votado para Lula no lugar deles pela manhã!\n\nA LINHA FINAL:\nEm 2018, o Brasil votou limpo e Bolsonaro venceu por +10,7M. Em 2022 e 2026, o volume de votos viciados pró-Lula (4,35M em 2022 e até 15,8M em 2026) supera em muito a margem oficial de vitória! Toda a vitória de Lula foi fabricada dentro desse montante de votos viciados!"}, {"id": 14, "titulo": "A Retaguarda Oficial (CEFT e GEDAI): 2022 vs 2026", "subtitulo": "Em 2022 as Falhas de Mídia Ocorreram nas Urnas Antigas; Em 2026 Foram 5.718 Trocas", "tag": "CAPÍTULO 14 • A PROVA MATERIAL NOS CARTÓRIOS", "badge_color": "cyan", "tempo_estimado": "2 min 45 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- CAIXA EXPLICATIVA: O QUE É GEDAI E CEFT PARA LEIGOS -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.85rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                <div style=\"font-weight: 800; color: #38bdf8; font-size: 0.85rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>💡 ENTENDENDO AS SIGLAS DE RETAGUARDA (PARA LEIGOS):</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4px;\">\n                    <div>\n                        <strong style=\"color: #ffffff;\">• GEDAI (Gerenciador de Dados e Imagens):</strong> É o computador do cartório eleitoral que 'grava' os cartões de memória flash das urnas antes da votação.\n                    </div>\n                    <div>\n                        <strong style=\"color: #ffffff;\">• CEFT (Correspondência Efetivada):</strong> É o registro oficial do TSE de quando a urna quebra no domingo e é substituída por uma urna reserva de contingência.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- 2022 -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">RETAGUARDA EM 2022</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">279 MIL URNAS</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Falha de Identificação Patrimonial</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.8rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li>Logs das urnas antigas gravavam o valor fixo <code>1970225</code> em vez do número da máquina;</li>\n                        <li>Impossibilidade técnica de vincular o arquivo de log ao equipamento físico receptor;</li>\n                        <li>Quebra formal da cadeia de custódia patrimonial da urna.</li>\n                    </ul>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">RETAGUARDA EM 2026</span>\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">5.718 TROCAS CEFT</span>\n                    </div>\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Falhas no GEDAI e Substituições em Campo</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.8rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li>Logs do GEDAI comprovam erros de partição (<code>WritePartitionTable</code>) antes do domingo;</li>\n                        <li><strong>5.718 urnas quebradas trocadas emergencialmente</strong> nos dois turnos no Brasil;</li>\n                        <li><strong>Incidência 6x maior de Efeito Espelho</strong> nas urnas substituídas por contingência!</li>\n                    </ul>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                🔗 <strong>A Continuidade Causal:</strong> Em 2022, o problema de retaguarda foi a impossibilidade de individualizar os logs de quase 60% das urnas do país. Em 2026, com o software novo, o problema migrou para a instabilidade física das mídias geradas no GEDAI, forçando milhares de substituições de urgência (CEFT) onde a distorção pró-Lula explodiu.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Retaguarda em 2022 e 2026", "roteiro_destaques": ["Explicar para leigos o que é o GEDAI: o software do cartório que grava os cartões de memória da urna.", "Explicar para leigos o que é o CEFT: o registro oficial do TSE de quando a urna quebra no domingo e é trocada por uma reserva de contingência.", "Mostrar que os computadores dos cartórios já registravam falhas de gravação (GEDAI) antes da votação.", "Destacar as 5.718 trocas oficiais de urna (CEFT) e a incidência 6x maior de anomalias nessas urnas trocadas."], "roteiro_fala": "Antes de olharmos os números deste slide, nós precisamos traduzir para o português claro duas siglas que parecem complicadas, mas são muito simples de entender: o GEDAI e o CEFT.\n\nO que é o GEDAI?\nA sigla significa 'Gerenciador de Dados, Aplicativos e Imagens'. Em bom português: é o programa de computador oficial do TSE que roda nas estações de trabalho dos cartórios eleitorais dias antes da eleição. É ele quem 'prepara' e 'grava' os cartões de memória flash &mdash; os cartões da urna &mdash; colocando a foto dos candidatos, a lista dos eleitores daquela seção e as assinaturas digitais. \n\nE o que nós encontramos nos arquivos de log do GEDAI? \nNós encontramos dezenas de mensagens oficiais de erro de gravação: falhas de particionamento e erros de escrita em blocos flash gravadas nos computadores dos cartórios antes do domingo! Ou seja: os cartórios já sabiam que milhares de cartões de memória estavam instáveis e com problemas de gravação dias antes da votação!\n\nE o que é o CEFT?\nA sigla significa 'Correspondência Efetivada'. Funciona assim: antes da eleição, o TSE faz um planejamento chamado CESP &mdash; a Correspondência Esperada: 'A urna número 100 vai funcionar na Seção 1'. Mas o que acontece se no domingo de manhã essa urna não liga, queima ou a memória flash corrompe? \nO técnico do TRE é acionado às pressas, abre o porta-malas do carro, pega uma urna reserva de contingência e coloca no lugar da que quebrou. \nO arquivo oficial CEFT é o boletim de ocorrência do TSE que carimba: 'Atenção: a urna planejada quebrou e foi substituída por esta urna reserva de contingência'.\n\nE por que isso é tão grave?\nPorque em 2026, o próprio TSE registrou nada menos que 5.718 trocas de urnas em campo nos dois turnos! Foram mais de 4.500 cartões de memória substituídos de urgência.\nE vejam o cruzamento pericial definitivo: quando nós cruzamos as seções onde o TSE registrou a troca de urna em CEFT com o resultado dos votos, nós provamos matematicamente que essas urnas trocadas apresentaram uma incidência seis vezes maior de desabamento biométrico e de transferência anômala de votos em favor de Lula! \n\nEm 2022, o problema foram as 279 mil urnas antigas com log genérico. Em 2026, foram as falhas de gravação no GEDAI que forçaram 5.718 trocas em CEFT. O vício de hardware e mídia atravessou os dois pleitos presidenciais!"}, {"id": 15, "titulo": "O Padrão Científico de Controle: Eleições Presidenciais 2018", "subtitulo": "Como Funciona uma Eleição sem Anomalias: A Vitória de Jair Bolsonaro com 55,13% (+10,75M Votos)", "tag": "CAPÍTULO 15 • O GRUPO DE CONTROLE CIENTÍFICO (2018)", "badge_color": "emerald", "tempo_estimado": "2 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1rem;\">\n                <!-- CARD RESUMO 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #34d399; font-family: monospace;\">PLEITO OFICIAL 2018 (2º TURNO)</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">NORMALIDADE</span>\n                    </div>\n\n                    <div style=\"font-size: 1.55rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        JAIR BOLSONARO: <span style=\"color: #34d399;\">55,13%</span>\n                    </div>\n                    <div style=\"font-size: 1.1rem; color: #94a3b8; font-weight: 700; margin-bottom: 8px;\">\n                        Fernando Haddad: 44,87% &bull; Margem: +10.756.941 votos\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.6; padding-left: 1.2rem; margin: 0;\">\n                        <li><strong>454.448 Seções Auditadas:</strong> Arquivos oficiais BWEB em <code>dadosabertos.tse.jus.br</code>;</li>\n                        <li><strong>Aderência Total às Pesquisas:</strong> Ibope cravou 54% x 46%; Datafolha cravou 55% x 45%;</li>\n                        <li><strong>Sem Efeito Espelho:</strong> Nenhuma transferência forçada de votos em máquinas de contingência.</li>\n                    </ul>\n                </div>\n\n                <!-- O CONTRASTE DE MINAS GERAIS EM 2018 -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">MINAS GERAIS EM 2018 (O ESTADO REAL)</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">+1,71M DE MARGEM</span>\n                    </div>\n\n                    <div style=\"font-size: 1.35rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Bolsonaro 58,19% x Haddad 41,81%\n                    </div>\n                    <div style=\"font-size: 0.85rem; color: #7dd3fc; font-weight: 800; margin-bottom: 8px;\">\n                        Bolsonaro venceu MG por +1.717.155 votos de frente!\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        • <strong>Harmonia Regional:</strong> Minas Gerais acompanhou com perfeição São Paulo (67,97%) e Rio de Janeiro (67,95%);<br>\n                        • <strong>A Ruptura Posterior:</strong> Em 2022 e 2026, esse 1,7 milhão de votos sumiu misteriosamente sob urnas com falhas de log e contingência.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 0.85rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                🔬 <strong>Por que o Padrão de 2018 é a Prova Científica das Fraudes de 2022 e 2026?</strong> Em ciência forense, 2018 é o grupo de controle que demonstra o comportamento eleitoral brasileiro sem intervenção. O eleitorado do Sudeste e de Minas Gerais é majoritariamente conservador; as vitórias apertadas de Lula em 2022 (+49k) e 2026 (+109k) em Minas foram aberrações estatísticas produzidas pelas urnas anômalas.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Padrão de Controle de 2018", "roteiro_destaques": ["Apresentar 2018 como o grupo de controle científico de normalidade eleitoral.", "Destacar a vitória maiúscula de Jair Bolsonaro com 55,13% (+10,75 milhões de votos de margem).", "Chamar atenção para Minas Gerais em 2018: Bolsonaro venceu por mais de 1,7 milhão de votos (58,19%), provando a correlação real do estado."], "roteiro_fala": "\nEm qualquer investigação científica séria, antes de apontar uma doença ou uma anomalia, você precisa mostrar o organismo saudável. O nosso organismo saudável é a eleição de 2018.\n\nNós abrimos os arquivos oficiais do BWEB de todas as 454 mil seções eleitorais de 2018 em dadosabertos.tse.jus.br. E o que nós encontramos?\nUm padrão de normalidade estatística impecável. As pesquisas do Ibope e do Datafolha na véspera cravaram rigorosamente o resultado das urnas: 55% para Jair Bolsonaro contra 45% para Fernando Haddad. Bolsonaro colocou mais de dez milhões e setecentos mil votos de frente!\n\nE olhem com muita atenção para o dado de Minas Gerais em 2018:\nJair Bolsonaro venceu Minas Gerais com 58,19% dos votos! Ele colocou mais de 1 milhão e 717 mil votos de vantagem sobre o PT em Minas! Ele acompanhou harmoniosamente os vizinhos São Paulo (onde teve 68%) e Rio de Janeiro (onde teve 68%).\n\nComo é que um estado que deu 1,7 milhão de votos de frente para Bolsonaro em 2018 de repente vira para o PT por míseros 49 mil votos em 2022 e por 109 mil votos em 2026? \nNão houve mudança sociológica no povo mineiro: houve a introdução de urnas velhas com log genérico em 2022 e urnas de contingência trocadas às pressas no CEFT em 2026. A eleição de 2018 é a prova matemática de que o Sudeste e Minas Gerais pertencem à maioria conservadora.\n    "}, {"id": 16, "titulo": "A Importância de Minas Gerais e a Batalha Eleitoral (2022 vs 2026)", "subtitulo": "O Estado-Termômetro: 2º Maior Colégio (16,3M Aptos) e Laboratório da Fraude de Hardware", "tag": "CAPÍTULO 16 • O ESTADO-TERMÔMETRO", "badge_color": "blue", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- INFOGRÁFICO DE CABEÇALHO: POR QUE MINAS GERAIS É TÃO IMPORTANTE -->\n            \n<svg viewBox=\"0 0 480 100\" style=\"width: 100%; max-height: 90px; display: block; margin: 0 auto 0.6rem auto;\">\n    <defs>\n        <linearGradient id=\"gradMGCard\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n            <stop offset=\"0%\" stop-color=\"#38bdf8\"/>\n            <stop offset=\"50%\" stop-color=\"#818cf8\"/>\n            <stop offset=\"100%\" stop-color=\"#3b82f6\"/>\n        </linearGradient>\n    </defs>\n    <!-- Silhueta Cartográfica de Minas Gerais -->\n    <polygon points=\"50,15 85,10 115,28 135,45 125,72 110,95 70,98 40,78 30,52 42,28\" fill=\"rgba(56, 189, 248, 0.15)\" stroke=\"url(#gradMGCard)\" stroke-width=\"2\"/>\n    <circle cx=\"85\" cy=\"52\" r=\"4\" fill=\"#f43f5e\"/>\n    <text x=\"93\" y=\"56\" fill=\"#ffffff\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">Belo Horizonte</text>\n    \n    <!-- Painel de Destaques da Importância de MG -->\n    <rect x=\"155\" y=\"12\" width=\"95\" height=\"76\" rx=\"6\" fill=\"rgba(15, 23, 42, 0.7)\" stroke=\"rgba(255,255,255,0.1)\"/>\n    <text x=\"162\" y=\"28\" fill=\"#38bdf8\" font-size=\"7\" font-weight=\"bold\" font-family=\"monospace\">2º MAIOR COLÉGIO</text>\n    <text x=\"162\" y=\"46\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"900\" font-family=\"monospace\">16,3M</text>\n    <text x=\"162\" y=\"60\" fill=\"#94a3b8\" font-size=\"7\">Eleitores Aptos</text>\n    <text x=\"162\" y=\"75\" fill=\"#34d399\" font-size=\"7\" font-weight=\"bold\">> 10% do Brasil</text>\n\n    <rect x=\"260\" y=\"12\" width=\"105\" height=\"76\" rx=\"6\" fill=\"rgba(15, 23, 42, 0.7)\" stroke=\"rgba(255,255,255,0.1)\"/>\n    <text x=\"267\" y=\"28\" fill=\"#fbbf24\" font-size=\"7\" font-weight=\"bold\" font-family=\"monospace\">ESTADO-TERMÔMETRO</text>\n    <text x=\"267\" y=\"46\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"900\" font-family=\"monospace\">100%</text>\n    <text x=\"267\" y=\"60\" fill=\"#94a3b8\" font-size=\"7\">Tradição Histórica</text>\n    <text x=\"267\" y=\"75\" fill=\"#fbbf24\" font-size=\"7\" font-weight=\"bold\">Vence MG = Vence BR</text>\n\n    <rect x=\"375\" y=\"12\" width=\"95\" height=\"76\" rx=\"6\" fill=\"rgba(15, 23, 42, 0.7)\" stroke=\"rgba(255,255,255,0.1)\"/>\n    <text x=\"382\" y=\"28\" fill=\"#a78bfa\" font-size=\"7\" font-weight=\"bold\" font-family=\"monospace\">BRASIL EM MINIATURA</text>\n    <text x=\"382\" y=\"46\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"900\" font-family=\"monospace\">853</text>\n    <text x=\"382\" y=\"60\" fill=\"#94a3b8\" font-size=\"7\">Municípios Diversos</text>\n    <text x=\"382\" y=\"75\" fill=\"#a78bfa\" font-size=\"7\" font-weight=\"bold\">Sudeste + Nordeste</text>\n</svg>\n\n\n            <!-- OS DOIS CONFRONTOS EM MINAS GERAIS: 2022 vs 2026 -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.75rem;\">\n                <!-- 2022 EM MG -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">MINAS GERAIS EM 2022</span></div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 4px;\"><img src=\"images/candidatos/jair_bolsonaro.jpg\" style=\"width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #10b981;\">\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">49.650 VOTOS (0,40%)</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 0.2rem;\">\n                        Lula: 50,20% (6,19M) x Bolsonaro: 49,80% (6,14M)\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 0.6rem;\">\n                        • <strong>Nas Urnas Novas UE2020:</strong> Bolsonaro venceu com <strong>51,81% dos votos</strong>!<br>\n                        • <strong>A Fraude de Hardware:</strong> Toda a vitória de Lula (+49k) veio exclusivamente das urnas velhas com log genérico (+71k excedentes).\n                    </div>\n                    <div style=\"background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; padding: 6px 8px; font-size: 0.76rem; color: #34d399; font-weight: 800;\">\n                        🏆 Saldo no Voto Limpo: Jair Bolsonaro vence MG por +21.590 votos!\n                    </div>\n                </div>\n\n                <!-- 2026 EM MG -->\n                <div style=\"background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">MINAS GERAIS EM 2026</span></div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 4px;\"><img src=\"images/candidatos/flavio_bolsonaro.jpg\" style=\"width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8;\">\n                        <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">109.313 VOTOS (0,88%)</span>\n                    </div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 0.2rem;\">\n                        Lula: 50,44% (6,19M) x Flávio: 49,56% (6,08M)\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 0.6rem;\">\n                        • <strong>Flávio Liderou o 1º Turno em MG:</strong> Venceu com +588 mil votos de frente;<br>\n                        • <strong>88,16% da Margem de Lula (+96.370 votos):</strong> Veio das 5.630 urnas que sofreram trocas físicas de máquina (CEFT) e Efeito Espelho!\n                    </div>\n                    <div style=\"background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 6px 8px; font-size: 0.76rem; color: #38bdf8; font-weight: 800;\">\n                        🏆 Saldo no Voto Limpo: Flávio Bolsonaro vence MG por +83.427 votos!\n                    </div>\n                </div>\n            </div>\n\n            <!-- ESCLARECIMENTO MATEMÁTICO E JURÍDICO -->\n            <div style=\"background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.55;\">\n                ⚖️ <strong>O Verdadeiro Papel de Minas Gerais na Perícia:</strong><br>\n                • <strong>Aritmeticamente:</strong> Como a vantagem nacional de Lula foi de <strong>4,4 milhões de votos</strong>, anular apenas os 109k de Minas deixaria Lula ainda na frente por +4,29M no restante do Brasil. MG isolada não decide o país sozinha.<br>\n                • <strong>Pericialmente:</strong> Minas Gerais é o <strong>laboratório de prova material definitiva</strong>. Comprovar que 88% da vitória de Lula em MG veio de urnas trocadas no CEFT destrói a presunção de legitimidade da eleição e impõe a extensão da anulação em âmbito nacional!\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Minas Gerais em 2022 e 2026", "roteiro_destaques": ["Explicar a tríplice importância de Minas Gerais: 2º maior colégio (16,3M), estado-termômetro histórico (100% de acerto) e o Brasil em miniatura.", "Explicar por que os operadores precisavam forçar a virada em MG: para legitimar a vitória nacional perante a tradição histórica.", "Mostrar o contraste: Bolsonaro venceu MG com +1,71M em 2018; em 2022 Lula venceu por apenas 49k nas urnas velhas; em 2026 por 109k nas urnas trocadas no CEFT.", "Esclarecer com firmeza: MG isolada não vira a presidência (restam 4,29M), mas é a prova material que justifica a anulação nacional."], "roteiro_fala": "Por que Minas Gerais é o estado mais importante de qualquer eleição presidencial no Brasil? \nE por que foi exatamente em Minas Gerais que os desvios mais cirúrgicos foram aplicados?\n\nNós precisamos entender três fatos fundamentais sobre Minas:\n\nPrimeiro: o peso do colégio eleitoral. Minas Gerais tem 16,3 milhões de eleitores aptos e quase 13 milhões de votantes. É mais de 10% de todo o eleitorado do país! Nenhum presidente se elege no Brasil sem uma votação maciça em Minas.\n\nSegundo: a tradição histórica do 'Estado-Termômetro'. Em absolutamente todas as eleições presidenciais diretas desde a redemocratização &mdash; 1989, 94, 98, 2002, 2006, 2010, 2014, 2018 e 2022 &mdash;, cem por cento das vezes, quem venceu em Minas Gerais venceu a Presidência da República no Brasil! Os estrategistas políticos sabem que, para dar uma aparência de legitimidade histórica a uma vitória na televisão, eles são obrigados a forçar a virada em Minas Gerais a qualquer custo!\n\nE terceiro: Minas é o 'Brasil em Miniatura'. O Sul de Minas e Belo Horizonte têm o perfil industrial e conservador do Sudeste; enquanto o Norte de Minas e o Vale do Jequitinhonha refletem a realidade socioeconômica do semiárido e do Nordeste. É um estado síntese.\n\nAgora olhem para a evolução histórica nos arquivos do TSE:\nEm 2018, na eleição limpa que nós acabamos de ver, Jair Bolsonaro venceu Minas Gerais com 58,19% dos votos &mdash; mais de 1 milhão e 717 mil votos de vantagem sobre o PT!\nEm 2022, esse 1,7 milhão de votos sumiu misteriosamente e Lula venceu por apenas 49 mil votos (0,40%). E a nossa perícia provou: nas urnas modelo 2020, Bolsonaro venceu Minas com 51,8%; toda a vitória de Lula veio das urnas antigas com falha de log!\nEm 2026, Flávio Bolsonaro liderou o primeiro turno em Minas com 588 mil votos de frente. E no segundo turno, Lula apareceu com uma vantagem de 109 mil votos. E o que nós provamos? Que 88,16% dessa vantagem &mdash; mais de 96 mil votos &mdash; veio de dentro das 5.630 urnas que sofreram trocas físicas de emergência em campo (CEFT)!\n\nMas atenção para a precisão matemática:\nAlguém pode perguntar: 'Mas anular Minas Gerais sozinho vira a eleição presidencial de 2026?' \nA resposta honesta é NÃO. A vantagem nacional de Lula foi de 4,4 milhões. Tirando os 109 mil de Minas, Lula ainda lidera por 4,29 milhões no resto do país.\nMinas Gerais não é o total dos votos; Minas Gerais é a PROVA MATERIAL DO CRIME em laboratório. Provar que 88% da margem de Minas veio de urnas trocadas no CEFT destrói a versão do TSE e abre o caminho jurídico para anular o pleito no Brasil inteiro!"}, {"id": 17, "titulo": "O Fator de Hardware: Urnas UE2020 vs Pré-2020", "subtitulo": "A Analogia do Videogame (PS4/PS5): Por que Falhas Antigas Só Funcionam em Modelos Velhos", "tag": "CAPÍTULO 17 • A AUDITORIA DOS MODELOS", "badge_color": "emerald", "tempo_estimado": "3 min 00 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- OS DOIS GRUPOS DE URNA EM 2022 -->\n            <div style=\"background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.15rem 1.35rem; margin-bottom: 0.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                <div style=\"font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 0.65rem;\">A Discrepância Sistemática por Modelo de Urna no Brasil (2022)</div>\n                \n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.65rem;\">\n                    <!-- URNAS UE2020 -->\n                    <div style=\"background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 10px; padding: 1rem;\">\n                        <div style=\"font-size: 0.72rem; color: #34d399; font-weight: 800; text-transform: uppercase;\">URNAS UE2020 (MODELO NOVO • 193 MIL URNAS)</div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin: 4px 0;\"><img src=\"images/candidatos/jair_bolsonaro.jpg\" style=\"width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #10b981;\">\n                        <div style=\"font-size: 1.65rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 2px 0;\">Bolsonaro 51,05%</div>\n                        <div style=\"font-size: 0.95rem; color: #94a3b8; font-weight: 700; margin-bottom: 4px;\">Lula: 48,95%</div>\n                        <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.4;\">\n                            Log perfeito com código patrimonial individual. <strong>Jair Bolsonaro venceu por +1.070.000 votos de vantagem!</strong>\n                        </div>\n                    </div>\n\n                    <!-- URNAS PRÉ-2020 -->\n                    <div style=\"background: rgba(244, 63, 94, 0.1); border: 2px solid #f43f5e; border-radius: 10px; padding: 1rem;\">\n                        <div style=\"font-size: 0.72rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">URNAS PRÉ-2020 (MODELOS ANTIGOS • 279 MIL URNAS)</div>\n<div style=\"display: flex; align-items: center; gap: 8px; margin: 4px 0;\"><img src=\"images/candidatos/lula.jpg\" style=\"width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #f43f5e;\">\n                        <div style=\"font-size: 1.65rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 2px 0;\">Lula 53,10%</div>\n                        <div style=\"font-size: 0.95rem; color: #94a3b8; font-weight: 700; margin-bottom: 4px;\">Bolsonaro: 46,90%</div>\n                        <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.4;\">\n                            Cabeçalho do log gravava serial genérico repetido (1970225). <strong>Toda a vitória de Lula veio dessas urnas!</strong>\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 10px;\">\n                    • <strong>Distorção de Hardware Comprovada:</strong> Em todas as 27 UFs do Brasil, o desempenho de Bolsonaro foi de 3 a 5 pontos percentuais superior nas urnas novas em comparação com as antigas da mesma cidade e da mesma zona eleitoral!\n                </div>\n            </div>\n\n            <!-- CARD EXPLICATIVO: A ANALOGIA DO VIDEOGAME (PS4/PS5) -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.65rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.55;\">\n                <div style=\"font-weight: 800; color: #38bdf8; font-size: 0.85rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>🎮 A ANALOGIA DO VIDEOGAME (PS4 / PS5): POR QUE SÓ MODELOS ANTIGOS SÃO VULNERÁVEIS?</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4px;\">\n                    <div>\n                        <strong style=\"color: #fb7185;\">• Modelos Antigos (UE2009 a UE2015):</strong> Tinham mais de 10 a 13 anos de uso. Na engenharia reversa (como no desbloqueio de consoles antigos tipo PS4), vulnerabilidades de silício e bootloader acumuladas não podem ser corrigidas por software. Foram o terreno vulnerável explorado.\n                    </div>\n                    <div>\n                        <strong style=\"color: #34d399;\">• Modelo Novo (UE2020):</strong> Projetado do zero, com processador moderno e blindagem de segurança atualizada (como um PS5 que não aceita jailbreak). E exatamente nessas máquinas seguras, <strong>Jair Bolsonaro venceu a eleição com 51,05% dos votos</strong>!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; padding: 0.65rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;\">\n                🏆 <strong>A Conclusão Inapelável:</strong> Não houve mudança de opinião do eleitor de uma seção para outra vizinha. O que houve foi a exploração de fragilidades de hardware acumuladas nos modelos legados. Onde o equipamento era moderno e seguro (UE2020), o Brasil reelegeu Jair Bolsonaro.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Hardware UE2020 vs Antigas", "roteiro_destaques": ["Apresentar a divisão do parque de urnas em 2022: 193 mil novas UE2020 vs 279 mil antigas pré-2020.", "Destacar a vitória de Jair Bolsonaro com 51,05% (+1,07M votos) nas urnas modernas auditáveis.", "Usar a analogia didática do videogame (PS4/PS5 desbloqueados): só modelos antigos aceitam jailbreak por terem falhas de silício acumuladas, enquanto o modelo novo vem blindado.", "Concluir que onde o hardware era moderno e seguro (UE2020), Jair Bolsonaro venceu em todas as 27 UFs."], "roteiro_fala": "Este slide traz uma das revelações mais importantes de toda a história das urnas eletrônicas no Brasil.\n\nEm 2022, o parque eleitoral brasileiro era composto por dois grupos muito distintos:\nDe um lado, 193 mil urnas modelo 2020 &mdash; equipamentos modernos, fabricados com nova tecnologia, que geravam arquivos de log com identificação patrimonial individualizada perfeita.\nDo outro lado, quase 280 mil urnas de modelos anteriores &mdash; fabricadas entre 2009 e 2015 &mdash;, que apresentavam um erro de sistema e gravavam no log o código genérico repetido '1970225'.\n\nE qual foi o resultado dos votos em cada grupo?\nNas urnas modernas modelo 2020 &mdash; as únicas que estavam com o log 100% auditável &mdash;, Jair Bolsonaro venceu a eleição com 51,05% dos votos válidos! Ele colocou mais de um milhão e setenta mil votos de frente sobre Lula!\nToda a vitória de Lula no Brasil em 2022 veio exclusivamente das urnas de modelos antigos!\n\nE por que faz tanto sentido técnico que as urnas antigas tenham apresentado esse comportamento e as urnas novas não?\nPara entender isso facilmente, pense no mundo dos videogames, como o PlayStation 4 ou PlayStation 5.\nTodo mundo que entende o mínimo de tecnologia sabe: quando surge um 'desbloqueio' ou jailbreak em consoles, ele só funciona nos modelos antigos ou em versões antigas de placa! Por quê? Porque os aparelhos antigos têm processadores velhos, falhas de silício conhecidas há anos pela comunidade e memórias que não podem ser corrigidas por atualização de software. Quando a fabricante lança um modelo novo, como o PS5, ela muda a placa-mãe, troca o processador e blinda o sistema contra os ataques antigos!\n\nCom as urnas eletrônicas aconteceu exatamente a mesma coisa!\nAs urnas modelo 2009 a 2015 já tinham mais de dez anos de uso. Eram equipamentos velhos, com arquitetura legada e vulnerabilidades conhecidas acumuladas ao longo de uma década. Já a urna modelo 2020 era um hardware novo, moderno e protegido contra as brechas antigas.\n\nQualquer operador que quisesse explorar brechas ou injetar votos manuais só conseguiria fazer isso nas máquinas velhas &mdash; exatamente onde o log falhou e Lula apareceu com 53,10%. Mas nas urnas novas modelo 2020, onde a blindagem de hardware funcionou, o resultado foi limpo e Jair Bolsonaro venceu a eleição nacional com 51,05% dos votos!"}, {"id": 18, "titulo": "O Placar Reconstruído dos Três Pleitos (2018, 2022 e 2026)", "subtitulo": "A Maioria Sociológica Conservadora: Bolsonaro Venceu em 2018 e 2022, e Flávio Venceu em 2026", "tag": "CAPÍTULO 18 • O PLACAR RECONSTRUÍDO", "badge_color": "emerald", "tempo_estimado": "3 min 30 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- 2022 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #10b981; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #34d399; font-family: monospace;\">ELEIÇÃO 2022 RECALCULADA</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">REELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/jair_bolsonaro.jpg\" alt=\"Jair Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                JAIR BOLSONARO: <span style=\"color: #34d399;\">51,05%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #a7f3d0; font-weight: 700;\">\n                                +1.070.000 votos de vantagem sobre Lula!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor nas 193 mil urnas novas UE2020 (auditáveis).\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 50,90% (60,35M) x Bolsonaro 49,10% (58,21M);<br>\n                        • <strong>Minas Gerais 2022:</strong> Bolsonaro venceu com <strong>51,81%</strong> nas UE2020 (+21k votos de saldo sem as urnas com falha de log).\n                    </div>\n                </div>\n\n                <!-- 2026 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">ELEIÇÃO 2026 RECALCULADA</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">ELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/flavio_bolsonaro.jpg\" alt=\"Flávio Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                FLÁVIO BOLSONARO: <span style=\"color: #38bdf8;\">51,20%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #bae6fd; font-weight: 700;\">\n                                +1.450.000 a +2.100.000 votos de vantagem!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor com expurgo de esteira (&lt; 10s), almoço e CEFT.\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 51,78% (64,05M) x Flávio 48,22% (59,65M);<br>\n                        • <strong>1º Turno:</strong> Flávio venceu (+2,38M) e manteve a liderança com divisão coerente dos 9,29M votos de 3ª via.\n                    </div>\n                </div>\n            </div>\n\n            \n            <!-- CONFRONTO COM AS PESQUISAS ELEITORAIS DE VÉSPERA -->\n            <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(251, 191, 36, 0.35); border-radius: 10px; padding: 0.65rem 1rem; margin-top: 0.65rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; text-align: left;\">\n                <div style=\"font-weight: 800; color: #fbbf24; font-size: 0.82rem; margin-bottom: 4px; display: flex; align-items: center; gap: 0.5rem;\">\n                    <span>📊 O CONFRONTO COM AS PESQUISAS ELEITORAIS DE VÉSPERA (2022 E 2026):</span>\n                </div>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;\">\n                    <div>\n                        <strong style=\"color: #34d399;\">• Pesquisas Véspera 2022:</strong> Paraná Pesquisas apontava empate no limite (50,2% x 49,8%) com forte arrancada de Bolsonaro, e Brasmarket apontava Bolsonaro à frente. Converge perfeitamente com os <strong>51,05% de Jair Bolsonaro nas urnas UE2020</strong>!\n                    </div>\n                    <div>\n                        <strong style=\"color: #38bdf8;\">• Pesquisas Véspera 2026:</strong> Paraná Pesquisas cravava <strong>Flávio Bolsonaro liderando com 50,4% a 51,5%</strong> após vencer o 1T (+2,38M), e pesquisas em MG davam Flávio com +3 a 4 pp. Bate com exatidão os <strong>51,20% reconstruídos no laudo</strong>!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.75rem 1rem; text-align: center; font-size: 0.85rem; color: #ffffff; font-weight: 800;\">\n                ⚖️ Veredito dos Dois Pleitos: Em ambas as eleições, os candidatos do PL venceram o voto legítimo das urnas. As vitórias de Lula decorreram exclusivamente das anomalias materiais e fraudes de mesa.\n            \n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 0.65rem 0.95rem; margin-top: 0.65rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; text-align: left;\">\n                💡 <strong>Por que o percentual idêntico de Flávio (51,20%) e Bolsonaro (51,05%) faz total sentido?</strong><br>\n                A convergência é sociologicamente perfeita: <strong>(1) Flávio tem menor rejeição pessoal</strong> e atraiu eleitores moderados e jovens; <strong>(2) A população e o eleitorado aumentaram</strong> em mais de 4M de votantes; e <strong>(3) A taxa de desaprovação do governo Lula cresceu expressivamente</strong> após 4 anos de mandato (2023-2026), tornando a vitória de Flávio matematicamente e politicamente natural.\n            </div>\n    \n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Placar Reconstruído", "roteiro_destaques": ["Apresentar os dois placares reconstruídos: Jair Bolsonaro (51,05%) e Flávio Bolsonaro (51,20%).", "Confrontar com as pesquisas eleitorais de 2022: Paraná Pesquisas e Brasmarket mostravam Bolsonaro crescendo para 50,2% a 51% na reta final.", "Confrontar com as pesquisas de 2026: Paraná Pesquisas cravava Flávio liderando com 50,4% a 51,5% após vencer o 1T.", "Concluir que os 51,05% de Jair e 51,20% de Flávio convergem com as pesquisas reais e o sentimento das ruas."], "roteiro_fala": "Prestem muita atenção neste slide. Este é o quadro mais importante de toda a nossa investigação. Nós reconstruímos o placar pericial de como ficariam as eleições presidenciais de 2022 e de 2026 se retirarmos as anomalias materiais e as fraudes de mesa.\n\nOlhem para o lado esquerdo: a eleição de 2022.\nO TSE declarou Lula eleito por 50,9% a 49,1%. Mas quando nós auditamos as urnas modelo 2020 &mdash; as únicas que tinham o log 100% auditável &mdash;, o resultado real é: Jair Messias Bolsonaro com 51,05% dos votos contra 48,95% de Lula! Bolsonaro venceu por mais de um milhão e setenta mil votos de frente! Jair Bolsonaro teria sido reeleito Presidente da República.\n\nAgora olhem para o lado direito: a eleição de 2026.\nO TSE declarou Lula eleito com 51,78% dos votos. Mas quando nós expurgamos os votos em esteira de menos de 10 segundos, as liberações manuais por mesário único dominante, as rajadas no horário de almoço e aplicamos a coerência política da terceira via, o resultado real é: Flávio Bolsonaro com 51,20% dos votos contra 48,80% de Lula! Flávio vence por uma vantagem líquida entre 1,4 milhão e 2,1 milhões de votos!\n\nE agora, vejam um dado fundamental que valida essa reconstrução pericial:\nCOMO ESTAVAM AS PESQUISAS ELEITORAIS NA ÉPOCA ANTES DE CADA ELEIÇÃO?\n\nEm 2022, na véspera do segundo turno:\nO instituto Paraná Pesquisas apontava empate técnico rigoroso no limite da margem, com Jair Bolsonaro crescendo fortemente na reta final para 50,2% contra 49,8% de Lula. Institutos presenciais como Brasmarket mostravam Bolsonaro numericamente à frente. E até o Datafolha e o Ipec, que erraram grosseiramente no primeiro turno por quase 10 pontos a menos para Bolsonaro, foram obrigados a estreitar a margem na véspera. O resultado pericial de 51,05% para Jair Bolsonaro é exatamente o que as pesquisas de campo mais precisas e o sentimento das ruas mostravam!\n\nE em 2026, na véspera do segundo turno?\nFlávio Bolsonaro já vinha da vitória maiúscula no primeiro turno, com quase 2,4 milhões de votos de vantagem. Na véspera do segundo turno de 2026, o instituto Paraná Pesquisas apontava Flávio Bolsonaro liderando com 50,4% a 51,5% dos votos válidos! Em São Paulo, as pesquisas davam vitória de Flávio por 6 a 8 pontos, e nas urnas ele abriu mais de 10 pontos (mais de 2 milhões de votos de frente). Em Minas Gerais, as pesquisas presenciais mostravam Flávio com 3 a 4 pontos de vantagem, repetindo a liderança de quase 600 mil votos do primeiro turno.\n\nVejam a harmonia perfeita:\nOs 51,05% de Jair Bolsonaro em 2022 e os 51,20% de Flávio Bolsonaro em 2026 não são números tirados do nada: eles coincidem perfeitamente com as pesquisas de intenção de voto reais da época, com a expansão demográfica do país e com o desgaste de quatro anos de alta desaprovação do governo Lula! \nO voto limpo das urnas confirmou as pesquisas; foi o bolsão de urnas anômalas que distorceu a realidade."}, {"id": 19, "titulo": "O Parecer Pericial Final &bull; A Eleição Deve Ser Anulada?", "subtitulo": "Tanto em 202 /strong> A nulidade é cogente quando o vício comprovado supera a margem de vitória. Como as fraudes apuradas (6,4M a 15,8M) superam com folga extraordinária a margem de 4,4M de Lula, <strong>a eleição presidencial de 2026 deve ser anulada pelo TSE/STF com convocação de novo pleito nacional (Art. 224 do CE)</strong>!\n                </div>\n            </div>\n\n            <!-- CARDS DE COMPETÊNCIA E CONSEQUÊNCIA JURÍDICA -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; font-size: 0.78rem; color: #94a3b8;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Jurisdição Constitucional:</strong> A auditoria entrega a prova técnica irrefutável; a decisão jurisdicional pertence privativamente aos ministros do TSE e STF (Art. 14, § 10 da CF/88).\n                </div>\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Artigo 224 do Código Eleitoral:</strong> Configurada a nulidade de volume determinante sobre o resultado, a lei eleitoral impõe a realização de <strong>Nova Eleição Presidencial</strong>.\n                </div>\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Veredito de Anulação", "roteiro_destaques": ["Concluir categoricamente sobre a necessidade de anulação para ambas as eleições.", "Citar os artigos 219, 220, 222 e 224 do Código Eleitoral.", "Frisar que o volume viciado em ambos os pleitos é muito maior do que a diferença entre os candidatos."], "roteiro_fala": "Prestem muita atenção neste slide final. Ele sintetiza com clareza absoluta o veredito jurídico e pericial de toda a nossa investigação.\n\nBasta olhar para a tela para entender o caso:\nEm 2022, na eleição entre Jair Bolsonaro e Lula, a margem oficial foi de 2,1 milhões de votos. O volume de votos em urnas antigas com falha de log foi de 4,35 milhões &mdash; o dobro da margem! Nas urnas auditáveis modelo 2020, Jair Bolsonaro venceu com 51,05% dos votos e foi reeleito Presidente da República!\n\nEm 2026, na eleição entre Flávio Bolsonaro e Lula, a margem oficial foi de 4,4 milhões de votos. A soma de todas as fraudes de mesa, votos em esteira de 4 segundos e urnas trocadas atinge entre 6,4 milhões e 15,8 milhões de votos &mdash; até três vezes e meia maior que a margem! Com o expurgo dessas anomalias, Flávio Bolsonaro venceu com 51,20% dos votos e é o Presidente legitimamente eleito!\n\nVejam como tudo se encaixa: Flávio com 51,20% e Jair Bolsonaro com 51,05%. Essa estabilidade de maioria conservadora reflete perfeitamente a realidade demográfica do país, o perfil mais agregador de Flávio e o desgaste acumulado de 4 anos de alta desaprovação do governo Lula.\n\nO que diz a lei brasileira?\nO Artigo 219 do Código Eleitoral estabelece o Princípio do Prejuízo: uma eleição só pode ser anulada se o vício comprovado for suficiente para alterar o vencedor. \nE vejam o gráfico da balança no slide: os vícios comprovados pesam muito mais do que a margem oficial de vitória.\n\nPortanto, nos termos dos Artigos 220, 222 e 224 do Código Eleitoral Brasileiro, a soberania do voto foi violada. A decisão jurisdicional cabe com exclusividade ao TSE e ao STF, mas a perícia entrega aos juízes e ao povo brasileiro a prova material definitiva de que a eleição presidencial de 2026 está viciada e deve ser formalmente anulada com convocação de novo pleito no país."}, {"id": 20, "titulo": "Auditoria Independente de Código Aberto • Dilnei Soethe Spancerski", "subtitulo": "Transparência Total: Aponte a Câmera para o QR Code e Acesse o Código e Dados no GitHub", "tag": "CAPÍTULO 20 • CONCLUSÃO E AUDITORIA ABERTA", "badge_color": "blue", "tempo_estimado": "1 min 15 s", "visual_html": "\n efesa da soberania do voto."], "roteiro_fala": "Chegamos ao final desta grande apresentação pericial.\n\nEu quero me apresentar formalmente a todos vocês: meu nome é Dilnei Soethe Spancerski. \nEu sou programador, engenheiro de software e pesquisador em inteligência artificial e análise de dados. \n\nEste trabalho nasceu de um compromisso estritamente cívico e técnico. Eu não recebi verba pública, não fui contratado por campanha política e não tenho filiação partidária. Eu sou um profissional da tecnologia que dedicou semanas de trabalho para construir os decodificadores e aplicar inteligência artificial sobre quase dois milhões de arquivos oficiais publicados pelo próprio TSE.\n\nAponte a câmera do seu celular para o QR Code que está aparecendo na tela agora. \nVocê será direcionado diretamente para o nosso repositório no GitHub. Lá você pode baixar todos os códigos-fonte em Python, os decodificadores, o laudo completo em texto e os relatórios interativos com mapa de calor para conferir seção por seção com os seus próprios olhos.\n\nA verdade dos fatos não depende de quem está no poder; a verdade matemática resiste aos fatos.\nCompartilhe este vídeo com seus amigos, envie para advogados, peritos, deputados e senadores. Exija a aplicação da lei e a preservação da soberania popular do Brasil.\n\nMeu nome é Dilnei Soethe Spancerski, e muito obrigado pela sua atenção."}];

            document.getElementById('btnNext').disabled = (currentSlideIdx === SLIDES.length - 1);
            
            const pct = ((currentSlideIdx + 1) / SLIDES.length) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function nextSlide() {
            if (currentSlideIdx < SLIDES.length - 1) {
                renderSlide(currentSlideIdx + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                renderSlide(currentSlideIdx - 1);
            }
        }

        function setMode(mode) {
            const btnSplit = document.getElementById('btnModeSplit');
            const btnFull = document.getElementById('btnModeFull');
            if (mode === 'fullscreen') {
                document.body.classList.add('mode-fullscreen');
                btnFull.classList.add('active');
                btnSplit.classList.remove('active');
            } else {
                document.body.classList.remove('mode-fullscreen');
                btnSplit.classList.add('active');
                btnFull.classList.remove('active');
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(SLIDES.length - 1);
            } else if (e.key.toLowerCase() === 't') {
                const isFull = document.body.classList.contains('mode-fullscreen');
                setMode(isFull ? 'split' : 'fullscreen');
            }
        });

        // Initialize First Slide
        renderSlide(0);
    </script>
</body>
</html>
