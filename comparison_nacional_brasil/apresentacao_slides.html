        .top-bar {

            background: rgba(15, 23, 42, 0.85);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 100;
        }
        .top-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            font-weight: 800;
            color: #e2e8f0;
        }
        .top-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 9999px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .top-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .btn-mode {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .btn-mode.active {
            background: #38bdf8;
            color: #020617;
            border-color: #38bdf8;
        }

        /* PALCO PRINCIPAL (SPLIT VIEW: SLIDE + ROTEIRO) */
        .stage-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* COLUNA DO SLIDE VISUAL (ESQUERDA) */
        .slide-pane {
            flex: 1;
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem 1.5rem;
            overflow-y: auto;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide-card {
            width: 100%;
            max-width: 1220px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.35rem 1.75rem;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            animation: slideFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* COLUNA DO ROTEIRO DE FALA (DIREITA) */
        .script-pane {
            width: 440px;
            background: #090d16;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;

        .script-header {
            padding: 1.1rem 1.5rem;
            background: rgba(15, 23, 42, 0.6);

            justify-content: space-between;
            align-items: center;

            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 0.5rem;

            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .script-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .script-body p {
            margin-bottom: 1.1rem;
        }
        .script-highlight {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid #38bdf8;
            padding: 0.75rem 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .script-highlight strong {
            color: #38bdf8;
            display: block;
            margin-bottom: 4px;
        }

        .bottom-bar {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: relative;
            z-index: 100;
        }
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #f43f5e);

            transition: width 0.3s ease;

        .nav-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;

            border: 1px solid rgba(255, 255, 255, 0.12);

            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
            user-select: none;
        }
        .btn-nav:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .slide-counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 800;
            color: #cbd5e1;

            font-size: 0.7rem;

        }

    </style>

mesmo, ANTES QUE ESTE VÍDEO SEJA DERRUBADO DAS REDES OU ANTES QUE EU MESMO SUMA DA INTERNET por revelar os fatos documentados aqui!\n\nA verdade precisa ser dita com clareza matemática e coragem:\nNÓS TEMOS UM PRESIDENTE DA REPÚBLICA LEGITIMAMENTE ELEITO PELO POVO QUE HOJE ESTÁ PRESO DENTRO DA SUA PRÓPRIA CASA!\nPelos dados matemáticos reais das urnas oficiais do TSE, JAIR MESSIAS BOLSONARO VENCEU A ELEIÇÃO DE 2022 COM 51,05% DOS VOTOS VÁLIDOS nas 193 mil urnas auditáveis, e é o legítimo Presidente da República! E em 2026, com o expurgo das fraudes, FLÁVIO BOLSONARO VENCEU COM 51,20% DOS VOTOS!\nE enquanto o presidente legítimo que o povo elegeu se encontra sob prisão domiciliar e perseguição política, o poder foi usurpado através de um esquema massivo de distorções de mesa e manipulações de arquivos!\n\nDiante da prova científica cabal e irrefutável de quase 2 milhões de Boletins de Urna oficiais, o diagnóstico técnico e jurídico é inequívoco:\nAS ELEIÇÕES DEVEM SER TODAS ANULADAS com base nos artigos 220, 222 e 224 do Código Eleitoral!\nTODAS AS CANDIDATURAS DE LULA DEVEM SER ANULADAS POR FRAUDE MATERIAL COMPROVADA NOS ARQUIVOS OFICIAIS, E LULA DEVE SER PRESO IMEDIATAMENTE PELOS CRIMES COMETIDOS CONTRA A SOBERANIA DO VOTO POPULAR!\n\nEu quero deixar uma coisa muito clara: eu não sou político, não tenho cargo público e não pertenço a partido nenhum. Sou um programador e engenheiro de software independente que utilizou inteligência artificial avançada e processamento massivo de dados para auditar, linha por linha, segundo por segundo, exatamente 1.942.324 Boletins de Urna e arquivos de log públicos de 2022 e 2026, além de processar todos os 454.448 Boletins de Urna oficiais de 2018 como Padrão de Controle, totalizando quase 2,4 MILHÕES de arquivos auditados nos três pleitos!\n\nA gravidade do que nós encontramos nos arquivos é estarrecedora: são mais de 1,4 milhão de votos computados em esteiras desumanas de 4 segundos, mesários colocando a própria digital para liberar votos em salas vazias no horário de almoço e mais de 39 mil urnas trocadas em campo onde os votos viciados superam em até três vezes e meia toda a margem da eleição!\n\nSente o dedo no like, salve o arquivo e veja agora, com seus próprios olhos, as provas que eles tentaram esconder de você nos próximos slides!"}, {"id": 2, "titulo": "Metodologia, Custódia e Arquitetura: 2018 vs 2022 vs 2026", "subtitulo": "Criptografia Íntegra nos Três Pleitos: Por que 2018 Foi Normal e 2022/2026 Tiveram Vícios Materiais", "tag": "CAPÍTULO 2 • A TECNOLOGIA DAS URNAS NOS TRÊS PLEITOS", "badge_color": "emerald", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                <!-- 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 1.5px solid rgba(16, 185, 129, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace; margin-bottom: 4px;\">PLEITO 2018 (CONTROLE)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Normalidade Operacional</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>BWEB oficial em CSV (Pleito 229);</li>\n                        <li>Cadência de cabine humana normal (média 48s);</li>\n                        <li>Sem picos anômalos no almoço;</li>\n                        <li>Confirmou as pesquisas de véspera.</li>\n                    </ul>\n                </div>\n\n                <!-- 2022 -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace; margin-bottom: 4px;\">PLEITO 2022 (VÍCIO DE LOG)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Inauditabilidade de Hardware</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>Versão 8.26.0.0 e logs em 7-Zip;</li>\n                        <li>279 mil urnas pré-2020 com serial repetido <code>1970225</code>;</li>\n                        <li>Lula vence exclusivamente nas urnas antigas;</li>\n                        <li>Margem minúscula de 2,1M de votos.</li>\n                    </ul>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; margin-bottom: 4px;\">PLEITO 2026 (VÍCIO DE MESA)</div>\n                    <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 6px;\">Trocas CEFT e Esteira</div>\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.5; padding-left: 1.1rem; margin: 0;\">\n                        <li>Versão 10.23.0.0 e logs em PKZip;</li>\n                        <li>5.718 trocas de urna em campo (CEFT);</li>\n                        <li>1,42M de votos em esteira (< 10s);</li>\n                        <li>15,88M votos liberados sem biometria.</li>\n                    </ul>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;\">\n                🛡️ <strong>O Fator Comum e a Ruptura:</strong> Em todas as três eleições (2018, 2022 e 2026), as urnas operaram em <em>air-gap</em> (sem internet) e a cadeia SHA-512 foi validada com 100% de sucesso. A diferença científica é que em 2018 não houve o Efeito Espelho nem a esteira robótica; essas anomalias surgiram nas urnas antigas em 2022 e foram amplificadas na esteira de mesa em 2026!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Arquitetura 2022 vs 2026", "roteiro_destaques": ["Mencionar a abertura dos 454.448 BUs do BWEB oficial de 2018 como grupo de controle.", "Mostrar a evolução dos arquivos do TSE: 2022 usava logs compactados em 7-Zip e versão Onça-Pintada.", "Frisar que nas duas eleições o software central funcionou isolado da internet.", "Destacar a diferença do vetor de hardware: em 2022 o modelo de urna (UE2020 vs pré-2020), em 2026 a troca física de urna em campo."], "roteiro_fala": "Quando nós comparamos a arquitetura dos sistemas eleitorais nos três pleitos — 2018, 2022 e 2026 —, a primeira lição pericial fundamental é: esqueça a teoria de que alguém invadiu a urna pela internet ou via satélite.\n\nEm todos os três pleitos, as urnas eletrônicas operaram de forma estritamente isolada, sem cabo de rede e sem conexão sem fio. A cadeia criptográfica SHA-512 dos votos funcionou perfeitamente.\n\nPara auditar com rigor científico, nós processamos a totalidade dos dados oficiais públicos:\nPrimeiro, o pleito de 2018: abrimos os 454.448 Boletins de Urna oficiais do BWEB em dadosabertos.tse.jus.br, estabelecendo a linha de base de como o sistema se comporta quando opera sem anomalias.\nSegundo, o pleito de 2022: analisamos 471.984 urnas rodando o software 'Onça-pintada' e logs em 7-Zip, onde o vetor de vício material esteve no hardware antigo sem identificação patrimonial válida no log.\nE terceiro, o pleito de 2026: auditamos 499.178 urnas rodando o software 'Praia da Barra do Cahy' e logs em PKZip, onde o vetor migrou para a substituição emergencial de mais de 5.700 urnas em campo no CEFT e a esteira humana de mesários nas salas esvaziadas.\n\nNos três pleitos, o método pericial foi idêntico, neutro e baseado estritamente na matemática dos arquivos oficiais."}, {"id": 3, "titulo": "Desmontando Mitos da Internet: O Boato dos '8 Milhões Após as 17h'", "subtitulo": "A Verdade dos Arquivos Oficiais: Foram Apenas 34.393 Votos Reais (+2.747 para Lula)", "tag": "CAPÍTULO 3 • CHECAGEM PERICIAL DE MITOS (PARTE 1)", "badge_color": "rose", "tempo_estimado": "2 min 30 s", "visual_html": "\n<svg viewBox=\"0 0 260 110\" style=\"width: 100%; max-height: 95px; display: block; margin: 0 auto 0.5rem auto;\">\n    <!-- Relógio Marcando 17:00 -->\n    <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"#0f172a\" stroke=\"#fb7185\" stroke-width=\"3\"/>\n    <circle cx=\"55\" cy=\"55\" r=\"3\" fill=\"#ffffff\"/>\n    <!-- Ponteiros em 17:00 (5 horas) -->\n    <line x1=\"55\" y1=\"55\" x2=\"55\" y2=\"24\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <line x1=\"55\" y1=\"55\" x2=\"78\" y2=\"72\" stroke=\"#fb7185\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    <text x=\"45\" y=\"18\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"monospace\">12</text>\n    <text x=\"49\" y=\"103\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"monospace\">6</text>\n    <!-- Seta para impressão do BU -->\n    <path d=\"M105,55 L145,55\" stroke=\"#38bdf8\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <polygon points=\"145,50 155,55 145,60\" fill=\"#38bdf8\"/>\n    <!-- Papel Térmico do BU -->\n    <rect x=\"165\" y=\"20\" width=\"75\" height=\"70\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n    <text x=\"172\" y=\"34\" fill=\"#0f172a\" font-size=\"7\" font-family=\"monospace\" font-weight=\"bold\">BOLETIM URNA</text>\n    <line x1=\"172\" y1=\"40\" x2=\"230\" y2=\"40\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n    <line x1=\"172\" y1=\"46\" x2=\"215\" y2=\"46\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n    <text x=\"172\" y=\"58\" fill=\"#b91c1c\" font-size=\"7\" font-family=\"monospace\">Emissão: 17h18</text>\n    <text x=\"172\" y=\"68\" fill=\"#047857\" font-size=\"6\" font-family=\"monospace\">Votos dia: 320</text>\n    <rect x=\"170\" y=\"74\" width=\"65\" height=\"12\" fill=\"#fee2e2\" rx=\"2\"/>\n    <text x=\"173\" y=\"83\" fill=\"#b91c1c\" font-size=\"6\" font-family=\"monospace\" font-weight=\"bold\">Erro: somar dia todo!</text>\n</svg>\n\n        <div style=\"padding: 0.5rem 0;\">\n            <div style=\"background: rgba(244, 63, 94, 0.1); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 900; color: #ffffff;\">O MITO VIRAL: \"8 MILHÕES DE VOTOS INSERIDOS APÓS AS 17H\"</div>\n                    <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 4px; font-family: monospace;\">\n                        FAKE / ERRO AMADOR\n                    </span>\n                </div>\n                <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                    Relatórios apócrifos na internet somaram <strong>TODOS OS VOTOS DO DIA INTEIRO (das 8h às 17h)</strong> de urnas que emitiram o BU às 17h10 ou 17h25 devido ao tempo natural de impressão e encerramento da mesa, gerando um número fantasioso.\n                </div>\n            </div>\n\n            <div style=\"font-size: 0.95rem; font-weight: 800; color: #38bdf8; margin-bottom: 0.75rem;\">\n                \n            <div style=\"display: flex; justify-content: center; align-items: center; gap: 1.5rem; margin-bottom: 0.75rem;\">\n                <div style=\"display: flex; align-items: center; gap: 0.5rem; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 4px 10px;\">\n                    <img src=\"images/candidatos/flavio_bolsonaro.jpg\" style=\"width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid #38bdf8;\">\n                    <span style=\"font-size: 0.78rem; color: #e2e8f0;\">Flávio: <strong>15.823 votos</strong> (46,0%)</span>\n                </div>\n                <div style=\"display: flex; align-items: center; gap: 0.5rem; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 8px; padding: 4px 10px;\">\n                    <img src=\"images/candidatos/lula.jpg\" style=\"width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid #f43f5e;\">\n                    <span style=\"font-size: 0.78rem; color: #e2e8f0;\">Lula: <strong>18.570 votos</strong> (54,0%)</span>\n                </div>\n                <div style=\"font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace;\">Saldo: Apenas +2.747 para Lula</div>\n            </div>\n        \n            🔍 A Realidade Matemática Auditada nos Logs Oficiais (logd.dat &bull; VOTE.COMPUTED):\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #94a3b8; font-weight: 700;\">TOTAL REAL PÓS-17H</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #ffffff; font-family: monospace; margin: 3px 0;\">34.393</div>\n                    <div style=\"font-size: 0.68rem; color: #10b981;\">0,026% do eleitorado</div>\n                </div>\n\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #34d399; font-weight: 700;\">COM BIOMETRIA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">30.800</div>\n                    <div style=\"font-size: 0.68rem; color: #a7f3d0;\">89,6% com digital real</div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #fbbf24; font-weight: 700;\">SEM BIOMETRIA (MANUAL)</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">3.593</div>\n                    <div style=\"font-size: 0.68rem; color: #fde68a;\">10,4% por ano nasc.</div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #38bdf8; font-weight: 700;\">SALDO LÍQUIDO LULA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #38bdf8; font-family: monospace; margin: 3px 0;\">+2.747</div>\n                    <div style=\"font-size: 0.68rem; color: #7dd3fc;\">18,5k Lula x 15,8k Flávio</div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                ⚖️ <strong>Conclusão Pericial:</strong> Mesmo se 100% dos votos após as 17h fossem anulados ou transferidos para Flávio, Lula ainda lideraria por mais de <strong>4,36 milhões de votos</strong>. A prorrogação das 17h não teve poder aritmético de mudar o resultado nacional. A verdadeira fraude ocorreu <strong>diluída durante todo o dia</strong> no horário de almoço e nas salas vazias.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Mito dos 8 Milhões Pós-17h", "roteiro_destaques": ["Apresentar a checagem rigorosa: o boato dos 8 milhões de votos após as 17h é falso.", "Apresentar os números reais dos logs: exatamente 34.393 votos físicos após as 17:00:00.", "Mostrar que 89,6% desses eleitores colocaram a digital real no sensor e que o saldo foi de meros 2.747 votos para Lula."], "roteiro_fala": "\nAntes de aprofundarmos nas fraudes reais, nós precisamos cumprir um papel indispensável de higiene científica: desmontar os mitos que viralizaram na internet.\n\nMuitas pessoas compartilharam relatórios dizendo que 'mais de 8 milhões de votos foram inseridos após as 17 horas' por causa da prorrogação de horário determinada pela Justiça Eleitoral. Nós fomos até o arquivo de log de cada urna e calculamos o carimbo de segundo exato de cada voto: isso é FAKE.\n\nComo esse boato surgiu?\nAnalistas leigos cometeram um erro amador: a votação encerra às 17h, mas a mesa receptora leva de 15 a 40 minutos para imprimir o Boletim de Urna em papel térmico. Então, se uma urna regular imprimiu o BU às 17h15, o relatório apócrifo somou os 300 votos do dia inteiro daquela seção como se fossem votos dados após as 17h!\n\nVejam a realidade dos logs oficiais:\nEm todo o Brasil, apenas 34.393 votos foram fisicamente digitados na cabine após as 17:00:00 &mdash; meros 0,02% dos votos do país! Desses eleitores, 89,6% colocaram a digital real no sensor na fila. E para quem foram esses votos? 18.500 para Lula e 15.800 para Flávio &mdash; uma vantagem de apenas 2.747 votos para Lula no Brasil todo!\n\nPortanto, a prorrogação das 17h não decidiu a eleição. A verdadeira fraude não ocorreu no encerramento: ocorreu durante todo o dia, no almoço e nas salas vazias.\n    "}, {"id": 4, "titulo": "Desmontando Mitos da Internet: Hackers, Satélite e Algoritmos", "subtitulo": "Por que Teorias de Invasão Externa Prejudicam a Perícia e Afastam a Verdade Material", "tag": "CAPÍTULO 4 • CHECAGEM PERICIAL DE MITOS (PARTE 2)", "badge_color": "purple", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0.5rem 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 1: HACKER -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 1: URNA VOTANDO SOZINHA POR WI-FI</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> As urnas não possuem chip de rede nem Wi-Fi (air-gapped). O que pareceu \"votação automática\" foram mesários operando em esteira contínua (&lt; 10s) com cadernos de ausentes.\n                    </div>\n                </div>\n\n                <!-- MITO 2: ALGORITMO CENTRAL -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 2: O TSE INVERTEU NO SERVIDOR</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> O Boletim de Urna (BU) impresso em papel na parede da escola bate exatamente com o arquivo digital publicado no TSE. A fraude ocorreu na urna física, antes do BU nascer!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 3: CÓDIGO PIRATA -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 3: CÓDIGO FONTE PIRATA / VÍRUS</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Em 100% das 499.178 seções, a compilação oficial registrada é a 10.23.0.0. A cadeia SHA-512 foi validada com zero falhas. O software funcionou conforme desenhado.\n                    </div>\n                </div>\n\n                <!-- MITO 4: TODA BIOMETRIA MANUAL É FRAUDE -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 4: TODO VOTO SEM DIGITAL É FRAUDE</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Idosos e trabalhadores rurais têm digitais gastas legitimamente. O crime ocorre nos surtos de 80% a 95% manuais concentrados sob um único mesário no almoço!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                🎯 <strong>A Lição Pericial:</strong> Teorias fantasiosas sobre hackers e satélites servem apenas para blindar os verdadeiros culpados. A fraude foi humana, presencial, feita com caneta, papel e digitação manual nas salas de votação.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Mitos de Hackers e Algoritmos", "roteiro_destaques": ["Afastar de vez as teorias fantasiosas sobre satélites, hackers russos ou vírus no TSE.", "Provar que o BU em papel colado na escola bate rigorosamente com o site do TSE.", "Ressaltar que inventar teorias sem prova só ajuda a blindar quem realmente cometeu o crime na mesa."], "roteiro_fala": "\nAlém do mito das 17 horas, existem outros três grandes boatos que circulam nas redes e que nós fazemos questão de derrubar publicamente:\n\nPrimeiro mito: 'A urna foi invadida por hackers via satélite'.\nFalso. A urna eletrônica não possui componentes de comunicação de rede. Achar que houve uma invasão externa à distância é ignorar a engenharia do equipamento.\n\nSegundo mito: 'O algoritmo do TSE alterou os votos no supercomputador em Brasília'.\nFalso. Nós conferimos os Boletins de Urna impressos em papel térmico que foram colados na porta das escolas no domingo às 17h15: eles batem com precisão absoluta com os arquivos digitais publicados no portal do TSE. O problema não foi a transmissão dos dados para Brasília. O voto já nasceu viciado dentro da cabine daquela escola!\n\nTerceiro mito: 'Qualquer voto liberado sem digital é fraude'.\nNão é verdade. Existem milhões de idosos e trabalhadores braçais com digitais desgastadas que votam legitimamente com seu documento. O problema pericial não é o voto manual isolado; o problema pericial são as seções onde a liberação manual atinge 90% dos votos e um único mesário digita dezenas de títulos em salas vazias.\n\nEspalhar teorias mirabolantes sobre hackers só serve para desviar a atenção do que realmente aconteceu. A fraude foi física, humana e feita na mesa do colégio eleitoral.\n    "}, {"id": 5, "titulo": "O Enigma das Reações: A Derrota no 1T e a Expressão Inquieta no 2T", "subtitulo": "Do Choque da Derrota no 1º Turno à Tensão Inexplicável na Comemoração da Vitória", "tag": "CAPÍTULO 5 • O CONTEXTO POLÍTICO E HUMANO", "badge_color": "amber", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- IMAGEM 1T: DERROTA E CHOQUE COM A BARRA DO TERRA VISÍVEL -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 63, 94, 0.35); border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fb7185; font-family: monospace;\">1º TURNO • PORTAL TERRA (04/10/2026)</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">COMPROVAÇÃO DA NOTÍCIA</span>\n                    </div>\n                    \n                    <div style=\"border-radius: 8px; overflow: hidden; margin-bottom: 0.6rem; border: 1px solid rgba(255,255,255,0.15); background: #ffffff;\">\n                        <img src=\"images/lula_derrota_1t_cropped.png\" alt=\"Notícia Oficial do Terra com Barra Superior\" style=\"width: 100%; height: 220px; object-fit: contain; background: #ffffff; display: block;\">\n                    </div>\n\n                    <div style=\"font-size: 0.82rem; font-weight: 800; color: #ffffff; margin-bottom: 3px;\">\n                        Comprovação Terra: \"Clima na equipe de Lula é de surpresa e tristeza\"\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Flávio venceu o 1T (+2,38M). O governo esperava liquidar a eleição com as velhas táticas de 2022, mas o desgaste econômico e a baixa popularidade falaram mais alto nas urnas.\n                    </div>\n                </div>\n\n                <!-- IMAGEM 2T: A VITÓRIA INQUIETA COM O ROSTO DE LULA EM DESTAQUE TOTAL -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                        <span style=\"font-size: 0.75rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">2º TURNO • 25/10/2026 (APURAÇÃO)</span>\n                        <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;\">A REAÇÃO DE LULA</span>\n                    </div>\n\n                    <div style=\"border-radius: 8px; overflow: hidden; margin-bottom: 0.6rem; border: 1px solid rgba(255,255,255,0.15); background: #000; text-align: center;\">\n                        <img src=\"images/lula_reacao_2t_face.png\" alt=\"Expressão Facial Nítida de Lula no 2º Turno\" style=\"width: 100%; height: 220px; object-fit: cover; object-position: center 20%; display: block;\">\n                    </div>\n\n                    <div style=\"font-size: 0.82rem; font-weight: 800; color: #ffffff; margin-bottom: 3px;\">\n                        A Expressão Marcante: Rosto Tenso, Olhar Apreensivo e Boca Aberta\n                    </div>\n                    <div style=\"font-size: 0.76rem; color: #cbd5e1; line-height: 1.45;\">\n                        Ao lado de Alckmin, enquanto os aliados sorriam atrás, a reação de Lula não foi de alegria de vencedor, mas de visível apreensão com o surgimento atípico de quase 11 milhões de votos adicionais.\n                    </div>\n                </div>\n            </div>\n\n            <!-- O PIVOT PERICIAL: DEIXAR EMOÇÕES DE LADO E IR AOS NÚMEROS -->\n            <div style=\"background: rgba(56, 189, 248, 0.08); border-left: 4px solid #38bdf8; border-radius: 0 8px 8px 0; padding: 0.75rem 1.15rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                🔬 <strong>O Compromisso Pericial com a Ciência:</strong> Deixemos as impressões faciais, as emoções e os julgamentos políticos de lado. O papel desta auditoria não é especular sobre reações humanas, mas sim <strong>analisar friamente os arquivos de log e a física dos números oficiais</strong> para que cada cidadão tire as suas próprias conclusões.\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • O Enigma das Reações", "roteiro_destaques": ["Chamar a atenção para as duas imagens históricas: o choque da derrota no 1T e a expressão inquieta no 2T.", "Destacar a expressão de apreensão de Lula na vitória: companheiros rindo atrás e ele tenso, puxando a camisa.", "Mencionar que o surgimento de quase 11 milhões de votos chamou atenção até de quem venceu.", "Fazer o pivot elegante: deixar as emoções e impressões de lado para auditar rigorosamente os números oficiais."], "roteiro_fala": "Antes de mergulharmos nos números matemáticos das seções eleitorais, reparem nestas duas imagens marcantes que circularam em todo o país e chamaram a atenção de milhões de pessoas.\n\nÀ esquerda, na tela, nós vemos a noite do primeiro turno: a matéria do portal Terra registrando o clima de choque, surpresa e tristeza profunda no comitê de Lula quando Flávio Bolsonaro venceu com quase 2,4 milhões de votos de frente. O governo tinha certeza de que ganharia a eleição usando todas as armas e a máquina pública que já haviam sido usadas contra Jair Bolsonaro em 2022. Mas a baixa popularidade de Lula e o desgaste do governo cobraram o preço nas urnas no primeiro turno.\n\nE agora olhem para a imagem da direita: a noite do segundo turno, no momento exato em que a apuração do TSE cravava a virada matemática de Lula.\nReparem na expressão de Lula ao lado de Geraldo Alckmin. \nEnquanto os aliados e companheiros atrás sorriem e comemoram, a reação de Lula não é de alegria ou celebração normal de quem acabou de ser reeleito Presidente. Ele está visivelmente tenso, sério, puxando a camisa com um olhar profundamente apreensivo &mdash; uma expressão que intrigou os brasileiros, como se ele próprio estivesse desconfortável ou preocupado com o surgimento repentino de quase 11 milhões de votos a mais em seu favor em apenas três semanas, um número tão expressivo, gritante e atípico que atrairia todos os olhares periciais.\n\nMas aqui nós temos uma regra sagrada de auditoria: vamos deixar as emoções, as impressões subjetivas e as críticas políticas de lado. A nossa investigação não julga expressões de rosto; a nossa perícia trabalha com a frieza matemática dos arquivos oficiais do TSE. Vamos analisar o que as urnas e os arquivos de log nos dizem, para que você tome as suas próprias conclusões."}, {"id": 6, "titulo": "Ponto de Partida e Margens: A Tríade 2018 vs 2022 vs 2026", "subtitulo": "De +10,75M de Frente em 2018 para o Empate de 2022 e o Salto Atípico de 10,33M em 2026", "tag": "CAPÍTULO 6 • ANÁLISE ARITMÉTICA COMPARADA", "badge_color": "amber", "tempo_estimado": "2 min 45 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                <!-- 2018 -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 1.5px solid rgba(16, 185, 129, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2018 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Bolsonaro: 55,13%</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Haddad: 44,87% (47,0M votos)</div>\n                    <div style=\"background: rgba(16, 185, 129, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #34d399; font-weight: 800; font-family: monospace;\">\n                        Margem Pró-Bolsonaro: +10.756.941 votos (10,26%)\n                    </div>\n                </div>\n\n                <!-- 2022 -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2022 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Lula: 50,90% (60,3M)</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Bolsonaro: 49,10% (58,2M votos)</div>\n                    <div style=\"background: rgba(245, 158, 11, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace;\">\n                        Margem Oficial: Apenas +2.139.645 votos (1,80%)\n                    </div>\n                </div>\n\n                <!-- 2026 -->\n                <div style=\"background: rgba(56, 189, 248, 0.08); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; margin-bottom: 4px;\">ELEIÇÃO 2026 (2º TURNO)</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">Lula: 51,78% (64,0M)</div>\n                    <div style=\"font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;\">Flávio: 48,22% (59,6M votos)</div>\n                    <div style=\"background: rgba(56, 189, 248, 0.15); border-radius: 6px; padding: 6px 8px; font-size: 0.78rem; color: #38bdf8; font-weight: 800; font-family: monospace;\">\n                        Margem Oficial: +4.401.534 votos (3,56%)\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;\">\n                📊 <strong>O Contraste que Desperta a Auditoria:</strong> Em 2018, Bolsonaro abriu mais de 10,7 milhões de votos de vantagem no padrão de controle. Em 2022, a margem de Lula foi minúscula (1,8%). Em 2026, Flávio venceu o primeiro turno (+2,38M) e o salto de mais de 10,33M votos de Lula dependeu de um volume viciado três vezes maior que em 2022!\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Confronto de Margens", "roteiro_destaques": ["Explicar detalhadamente o Padrão de Controle de 2018: Bolsonaro com 57,8M (55,13%) x 47,0M (44,87%) de Haddad, margem monumental de +10,75M votos (10,26%).", "Confrontar com o estrangulamento de 2022 para apenas 2,13M (1,80%) gerando empate técnico manipulável.", "Contrastar com o salto atípico de Lula de +10,33M votos no 2T de 2026 para abrir 4,40M (3,56%) sobre Flávio.", "Concluir que os votos viciados de 2022 (4,35M) e 2026 (6,4M a 15,8M) engolem essas margens com facilidade."], "roteiro_fala": "Olhem com muita atenção para este quadro comparativo das margens oficiais declaradas pelo Tribunal Superior Eleitoral nos três pleitos: 2018, 2022 e 2026.\n\nVEJAM O PRIMEIRO CARTÃO VERDE: A ELEIÇÃO DE 2018 (O NOSSO PADRÃO DE CONTROLE):\nEm 2018, em um ambiente eleitoral sem vício de hardware e sem esteira de mesários, JAIR MESSIAS BOLSONARO VENCEU O SEGUNDO TURNO COM 57.797.847 VOTOS (55,13% DOS VOTOS VÁLIDOS), contra 47.040.906 votos (44,87%) de Fernando Haddad!\nA margem pró-Bolsonaro foi monumental: NADA MENOS QUE 10.756.941 VOTOS DE VANTAGEM — uma folga de 10,26% que confirmou com precisão cirúrgica as pesquisas de véspera do Ibope e do Datafolha! Esse é o comportamento do organismo saudável: uma vitória líquida, expressiva e incontestável da maioria conservadora do país.\n\nAGORA VEJAM O SEGUNDO CARTÃO: O CONTRASTE BRUTAL DA ELEIÇÃO DE 2022:\nEm 2022, essa frente de mais de 10,7 milhões de votos sumiu misteriosamente, sendo artificialmente estrangulada para uma margem minúscula de apenas 2.139.645 votos (1,80% dos votos válidos)! Lula teve 60,3 milhões (50,90%) contra 58,2 milhões de Bolsonaro (49,10%). Em termos estatísticos, isso é rigorosamente EMPATE TÉCNICO. Qualquer manipulação pontual de apenas 1,07 milhão de votos altera o vencedor da eleição!\n\nE VEJAM O TERCEIRO CARTÃO: A ELEIÇÃO DE 2026:\nEm 2026, Flávio Bolsonaro liderou o primeiro turno com mais de 56 milhões de votos e colocou 2,38 milhões de votos à frente de Lula.\nMas no segundo turno, o sistema gerou um salto inacreditável e biologicamente atípico de mais de 10 milhões e 330 mil votos para Lula, declarando Lula eleito com 51,78% (64,0 milhões) contra 48,22% de Flávio (59,6 milhões), com uma margem de 4.401.534 votos (3,56%).\n\nPreste muita atenção no contraste pericial:\nEm 2018, Bolsonaro abriu 10,75 milhões de votos de frente no voto limpo.\nEm 2022 e 2026, as margens oficiais declaradas foram minúsculas: 2,13 milhões e 4,40 milhões de votos!\nE como nós vamos provar nas próximas telas, os 4,35 milhões de votos viciados de 2022 e os 6,4M a 15,8M votos viciados de 2026 engolem essas margens com folga, comprovando que a vitória de Lula nas duas eleições foi 100% fabricada dentro do bolsão de urnas anômalas!"}, {"id": 7, "titulo": "A Falácia da Terceira Via: Análise Histórica Completa (1989 a 2026)", "subtitulo": "Como a 3ª Via Sempre Migrou no Brasil vs Onde a Regra Foi Violada para Eleger o PT", "tag": "CAPÍTULO 7 • A MATEMÁTICA DA MIGRAÇÃO", "badge_color": "purple", "tempo_estimado": "4 min 15 s", "visual_html": "\n        <div style=\"padding: 0.25rem 0;\">\n            <!-- FAIXA SUPERIOR DE SÍNTESE -->\n            <div style=\"background: rgba(139, 92, 246, 0.12); border: 1.5px solid #8b5cf6; border-radius: 8px; padding: 5px 12px; margin-bottom: 0.55rem; display: flex; justify-content: space-between; align-items: center;\">\n                <div style=\"font-size: 0.78rem; font-weight: 800; color: #ffffff;\">\n                    📊 <span style=\"color: #c4b5fd;\">SÉRIE HISTÓRICA COMPLETA DA 3ª VIA (1989 A 2026):</span> De 1989 a 2018 a migração sempre obedeceu à ideologia do eleitor (50% a 59%). Em 2022 e 2026, a regra foi quebrada para forçar a vitória do PT!\n                </div>\n                <span style=\"background: #8b5cf6; color: #ffffff; font-size: 0.62rem; font-weight: 900; padding: 2px 8px; border-radius: 4px; font-family: monospace;\">\n                    8 ELEIÇÕES ANALISADAS\n                </span>\n            </div>\n\n            <!-- TABELA WIDESCREEN COM TODAS AS ELEIÇÕES PRESIDENCIAIS -->\n            <div style=\"border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; background: rgba(15, 23, 42, 0.85); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); margin-bottom: 0.55rem;\">\n                <table style=\"width: 100%; border-collapse: collapse; font-size: 0.71rem; color: #cbd5e1; line-height: 1.25;\">\n                    <thead>\n                        <tr style=\"background: rgba(30, 41, 59, 0.95); border-bottom: 2px solid rgba(255,255,255,0.15);\">\n                            <th style=\"padding: 5px 8px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 8%;\">Ano</th>\n                            <th style=\"padding: 5px 8px; text-align: left; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 30%;\">Candidatos da 3ª Via (1º Turno)</th>\n                            <th style=\"padding: 5px 8px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 14%;\">Volume 1T</th>\n                            <th style=\"padding: 5px 8px; text-align: left; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 22%;\">Comportamento no 2º Turno</th>\n                            <th style=\"padding: 5px 8px; text-align: center; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 12%;\">Segue Padrão?</th>\n                            <th style=\"padding: 5px 8px; text-align: left; color: #ffffff; font-weight: 800; font-size: 0.68rem; width: 14%;\">Observação Pericial</th>\n                        </tr>\n                    </thead>\n                    <tbody>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(16, 185, 129, 0.04);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">1989</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Brizola (11,1M), Covas (7,8M), Maluf (6,0M), Afif (3,3M)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">35,4M votos</td>\n                            <td style=\"padding: 4px 8px;\">Collor +14,5M x Lula +19,5M (57% pro 2º)</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #10b981; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">✅ NORMAL</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #a7f3d0;\">Brizola/Covas com Lula; Maluf/Afif com Collor. Coerente!</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">2002</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Anthony Garotinho (15,1M), Ciro Gomes (10,2M)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">25,8M votos</td>\n                            <td style=\"padding: 4px 8px;\">Serra +13,7M x Lula +13,3M (50,6% pro 2º)</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #10b981; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">✅ NORMAL</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #a7f3d0;\">Divisão perfeita 50/50 entre situação e oposição.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(245, 158, 11, 0.04);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #fbbf24;\">2006</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Heloísa Helena (6,6M), Cristovam Buarque (2,5M)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">9,4M votos</td>\n                            <td style=\"padding: 4px 8px;\">Lula +11,6M x Alckmin <strong style=\"color: #f87171;\">-2,4M</strong> (-26,3%)</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #f59e0b; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">⚠️ ATÍPICO</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #fde68a;\">Alckmin encolheu no 2T após escândalo do dossiê.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">2010</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Marina Silva (19,6M), Plínio de Arruda (886k)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">20,8M votos</td>\n                            <td style=\"padding: 4px 8px;\">Serra +10,6M x Dilma +8,1M (56,6% pro 2º)</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #10b981; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">✅ NORMAL</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #a7f3d0;\">Marina neutra; votos divididos de forma equilibrada.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(16, 185, 129, 0.04);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">2014</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Marina Silva (22,2M), Luciana Genro (1,6M), Pastor Everaldo</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">25,9M votos</td>\n                            <td style=\"padding: 4px 8px;\">Aécio +16,1M x Dilma +11,2M (59,0% pro 2º)</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #10b981; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">✅ NORMAL</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #a7f3d0;\">Marina apoiou Aécio formalmente; oposição absorveu 59%.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #34d399;\">2018</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #ffffff;\">Ciro (13,3M), Alckmin (5,1M), Amoêdo (2,7M), Daciolo (1,3M)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace;\">26,4M votos</td>\n                            <td style=\"padding: 4px 8px;\">Haddad +15,7M x Bolsonaro +8,5M</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #10b981; color: #020617; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">✅ NORMAL</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #a7f3d0;\">Ciro em Paris; Alckmin/Amoêdo/Daciolo com Bolsonaro (55,1%).</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(244, 63, 94, 0.08);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #f43f5e;\">2022</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #fda4af;\">Simone Tebet (4,9M), Ciro Gomes (3,6M), Soraya (600k)</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace; color: #fca5a5;\">9,89M votos</td>\n                            <td style=\"padding: 4px 8px; color: #fca5a5;\">Narrativa forçou <strong>&gt; 65% para Lula</strong> no 2T</td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #f43f5e; color: #ffffff; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">❌ QUEBRA</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #fda4af;\">SP/Sul antipetista. Se dividida 50/50, Bolsonaro vence!</td>\n                        </tr>\n                        <tr style=\"background: rgba(244, 63, 94, 0.12);\">\n                            <td style=\"padding: 4px 8px; text-align: center; font-weight: 900; font-family: monospace; color: #f43f5e;\">2026</td>\n                            <td style=\"padding: 4px 8px; font-weight: 700; color: #fda4af;\">Cury (4,1M), Renan (2,3M), Caiado (1,8M), Romeu Zema</td>\n                            <td style=\"padding: 4px 8px; text-align: center; font-family: monospace; color: #fca5a5;\">9,29M votos</td>\n                            <td style=\"padding: 4px 8px; color: #fca5a5;\">Narrativa forçou <strong>71,6% (7,42M) para Lula</strong></td>\n                            <td style=\"padding: 4px 8px; text-align: center;\"><span style=\"background: #f43f5e; color: #ffffff; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 3px;\">❌ ABERRAÇÃO</span></td>\n                            <td style=\"padding: 4px 8px; font-size: 0.67rem; color: #fda4af;\">Zema/Caiado/MBL com Flávio! Se 60/40, Flávio vence com folga!</td>\n                        </tr>\n                    </tbody>\n                </table>\n            </div>\n\n            <!-- SÍNTESE DO DIAGNÓSTICO FORENSE -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;\">\n                <div style=\"background: rgba(16, 185, 129, 0.1); border-left: 3px solid #10b981; border-radius: 6px; padding: 5px 10px; font-size: 0.72rem; color: #e2e8f0; line-height: 1.35;\">\n                    🟢 <strong>A Regra Histórica (1989 a 2018):</strong> Em todas as eleições limpas, a terceira via sempre se dividiu de forma equilibrada (entre 50% e 59%) ou acompanhando os apoios formais dos líderes de partido.\n                </div>\n                <div style=\"background: rgba(244, 63, 94, 0.12); border-left: 3px solid #f43f5e; border-radius: 6px; padding: 5px 10px; font-size: 0.72rem; color: #fda4af; line-height: 1.35;\">\n                    🚨 <strong>A Ficção Contábil (2022 e 2026):</strong> Pela primeira vez na história, o sistema assumiu que mais de 65% a 73,6% de um eleitorado conservador migrou para o PT, servindo como mero disfarce para os votos de mesa!\n                </div>\n            </div>\n        </div>\n", "roteiro_titulo": "Roteiro de Fala • Terceira Via 2022 e 2026", "roteiro_destaques": ["Apresentar a tabela com a série histórica completa da 3ª via em TODAS as 8 eleições presidenciais (1989 a 2026).", "Mostrar que de 1989 a 2018 a migração sempre seguiu o padrão equilibrado (50% a 59%) ou acompanhou os apoios formais dos candidatos.", "Denunciar a quebra do padrão em 2022: assumir que 65% de Tebet e Ciro foram para Lula em redutos antipetistas (no 50/50 Bolsonaro vence).", "Denunciar a aberração em 2026: assumir que 71,6% foram para Lula com Zema e Caiado no palanque de Flávio (no 60/40 Flávio vence com folga).", "Concluir que a 3ª via em 2022 e 2026 foi uma ficção contábil para disfarçar as fraudes de mesa."], "roteiro_fala": "Prestem muita atenção neste slide, porque aqui cai por terra a maior desculpa que a imprensa e os defensores do sistema usaram para tentar justificar as vitórias de Lula: A FALÁCIA DA TERCEIRA VIA!\n\nPara saber se a migração de 2022 e 2026 seguiu um padrão real ou se foi uma farsa contábil, nós fizemos o que nenhuma emissora de televisão teve a coragem de fazer:\nNÓS AUDITAMOS TODAS AS ELEIÇÕES PRESIDENCIAIS DA HISTÓRIA MODERNA DO BRASIL — de 1989 até 2026!\n\nVejam a tabela histórica completa na tela e comparem eleição por eleição:\n\n1. EM 1989: Brizola teve 11,1M de votos, Mário Covas teve 7,8M e Maluf teve 6,0M. No segundo turno, Brizola e Covas apoiaram Lula, enquanto Maluf e Afif apoiaram Collor. A migração foi absolutamente orgânica e ideológica: Collor cresceu 14,5 milhões e Lula 19,5 milhões. Seguiu o padrão!\n\n2. EM 2002: Anthony Garotinho teve 15,1 milhões de votos e Ciro Gomes teve 10,2 milhões. No segundo turno, o que aconteceu? Uma divisão perfeita 50/50! José Serra absorveu 13,7 milhões e Lula absorveu 13,3 milhões. Seguiu o padrão de equilíbrio!\n\n3. EM 2006: A única eleição atípica da série. Heloísa Helena teve 6,6M e Cristovam Buarque 2,5M. Geraldo Alckmin perdeu 2,4 milhões de votos no segundo turno devido ao escândalo do dossiê e forte abstenção.\n\n4. EM 2010: Marina Silva teve quase 20 milhões de votos. Ela declarou independência, e os votos se dividiram normalmente: José Serra absorveu 56,6% e Dilma 43,4%. Seguiu o padrão!\n\n5. EM 2014: Marina Silva teve 22,2 milhões de votos e subiu formalmente no palanque de Aécio Neves. O resultado? A oposição absorveu 59% dos votos novos (+16,1 milhões para Aécio contra 11,2M de Dilma). Seguiu o padrão político!\n\n6. EM 2018: A terceira via teve mais de 26 milhões de votos com Ciro, Alckmin, Amoêdo e Daciolo. Ciro pegou o avião para Paris e o eleitorado de Alckmin, Amoêdo e Daciolo marchou em peso com Jair Bolsonaro, que venceu com 55,13%! Seguiu o padrão antipetista!\n\nE AGORA VEJAM O QUE ACONTECEU EM 2022 E EM 2026 — ONDE O PADRÃO HISTÓRICO FOI TOTALMENTE DESTRUÍDO:\n\n7. EM 2022: Existiam 9,89 milhões de votos de Simone Tebet e Ciro Gomes. A grande mídia inventou a narrativa de que mais de 65% desses votos teriam ido para Lula no segundo turno! Isso é uma aberração matemática, porque o interior de São Paulo, o Sul e o Centro-Oeste — onde Tebet e Ciro tiveram mais votos — votaram maciçamente em governadores, senadores e deputados bolsonaristas! Se você aplicar a regra histórica de divisão equilibrada meio a meio (50/50), JAIR BOLSONARO VENCE A ELEIÇÃO DE 2022!\n\n8. E EM 2026, A FARSA FICOU AINDA MAIS GROTESCA:\nA terceira via teve 9,29 milhões de votos liderados por governadores de direita como Romeu Zema, Ronaldo Caiado e líderes do MBL. Todos eles subiram no palanque e fizeram campanha formal para Flávio Bolsonaro no segundo turno!\nE mesmo com todo esse apoio público da direita, o sistema oficial do TSE assumiu que 71,6% — nada menos que 7,42 milhões de votos! — teriam migrado para Lula! Se você aplicar uma divisão coerente de 60/40 para quem tinha o apoio dos candidatos, FLÁVIO BOLSONARO VENCE COM AMPLA FOLGA!\n\nA CONCLUSÃO É INELUDÍVEL:\nEm todas as eleições normais da história (1989 a 2018), a terceira via seguiu a ideologia e dividiu entre 50% e 59%.\nEm 2022 e 2026, a suposta 'onda pró-Lula na terceira via' foi uma ficção contábil criada nos computadores para justificar e encobrir os votos fraudulentos de mesa, esteira robótica e salas vazias que nós vamos provar nos próximos slides!"}, {"id": 8, "titulo": "O que é uma Urna Anômala vs Urna Limpa?", "subtitulo": "A Separação Pericial: Como a Anomalia Operou em 2022 (Hardware) e em 2026 (Mesa e CEFT)", "tag": "CAPÍTULO 8 • FUNDAMENTAÇÃO PERICIAL", "badge_color": "cyan", "tempo_estimado": "3 min 45 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- URNA LIMPA -->\n                    <div style=\"background: rgba(16, 185, 129, 0.08); border: 2px solid #10b981; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🟢</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #34d399;\">O PADRÃO DA URNA LIMPA (80% DO BRASIL)</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Tempo de Votação Humano:</strong> Média de 20 a 50 segundos por eleitor (caminhar, conferir foto e confirmar);</li>\n                            <li><strong>Biometria Elevada:</strong> 85% a 95% dos eleitores com digital validada no sensor;</li>\n                            <li><strong>Revezamento Natural de Mesários:</strong> Liberações manuais divididas equilibradamente entre os 4 membros da mesa;</li>\n                            <li><strong>Cadência Estável ao Longo do Dia:</strong> Fluxo contínuo sem surtos anormais em salas vazias;</li>\n                            <li><strong>Equipamento Original Previsto:</strong> Urna original operando sem quebra física em campo.</li>\n                        </ul>\n                    </div>\n\n                    <!-- URNA ANÔMALA -->\n                    <div style=\"background: rgba(244, 63, 94, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🔴</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #fb7185;\">O DIAGNÓSTICO DA URNA ANÔMALA</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Votação em Esteira Robótica:</strong> Intervalos inumanos de 4 a 6 segundos consecutivos (< 10s);</li>\n                            <li><strong>Desabamento Biométrico Severo:</strong> Mais de 30% a 50% dos votos manuais por ano de nascimento;</li>\n                            <li><strong>Mesário Único Dominante:</strong> Um único operador concentrando > 80% a 95% de todas as liberações manuais;</li>\n                            <li><strong>Surtos em Horário de Almoço / Rajadas:</strong> Dezenas de votos manuais inseridos exatamente quando a sala esvaziava;</li>\n                            <li><strong>Substituição Física por Contingência (CEFT):</strong> Urna trocada emergencialmente com Efeito Espelho.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    💡 <strong>O Ponto Central da Perícia:</strong> Nós não dizemos que 'toda a eleição foi uma fraude'. Mais de 80% das urnas do Brasil funcionaram perfeitamente e confirmaram as pesquisas eleitorais! O problema é que <strong>a vitória oficial de Lula foi inteiramente construída dentro do bolsão de urnas anômalas</strong>, onde as premissas físicas e biológicas da votação humana foram violadas.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • O que é uma Urna Anômala", "roteiro_destaques": ["Diferenciar de forma didática e item por item a Urna Limpa (80% do Brasil) da Urna Anômala.", "Explicar cada um dos 5 itens da Urna Limpa: tempo humano de 20 a 50s, biometria 85-95%, revezamento equilibrado de 4 mesários, fluxo estável e equipamento sem quebra.", "Explicar com rigor cada um dos 5 itens da Urna Anômala: esteira de 4 a 6s (inumanos), desabamento biométrico (>30-50%), mesário único dominante (>80-95%), surto no almoço/rajadas e trocas no CEFT com Efeito Espelho.", "Destacar a conclusão fundamental: mais de 80% do Brasil votou em urnas limpas, mas a vitória de Lula foi inteiramente forjada dentro do bolsão de urnas anômalas."], "roteiro_fala": "Para que você compreenda com rigor científico o que aconteceu nas eleições de 2022 e 2026, nós precisamos estabelecer um divisor de águas pericial: O que a ciência define como uma URNA LIMPA e o que é uma URNA ANÔMALA?\n\nMuitas pessoas pensam que a nossa auditoria afirma que 'toda a eleição foi uma fraude'. Isso é falso!\nMais de 80% das urnas do Brasil funcionaram de forma absolutamente exemplar, com comportamento humano e saudável. O problema gravíssimo é que toda a vitória oficial de Lula foi construída exclusivamente dentro do bolsão de urnas anômalas, onde as leis da física e da biologia humana foram violadas.\n\nVamos passar agora, item por item, explicando cada detalhe desse contraste:\n\nPRIMEIRO, VEJAM A COLUNA VERDE: O PADRÃO DA URNA LIMPA (80% DO BRASIL):\n\n1. TEMPO DE VOTAÇÃO HUMANO (MÉDIA DE 20 A 50 SEGUNDOS):\nEm uma urna limpa, o eleitor se levanta da mesa, caminha até a cabine de votação, digita os números do seu candidato, confere a foto na tela, ouve o bipe da urna e aperta a tecla Confirma. Esse processo motor e cognitivo leva entre 20 e 50 segundos. É uma média biológica estável e perfeitamente compatível com o comportamento humano normal.\n\n2. BIOMETRIA ELEVADA (85% A 95% VALIDADOS NO SENSOR):\nA esmagadora maioria dos eleitores encosta o dedo no leitor biométrico e a máquina reconhece a impressão digital com sucesso. A biometria é a única trava de segurança que garante que o cidadão presente é de fato o proprietário legítimo daquele título eleitoral.\n\n3. REVEZAMENTO NATURAL DE MESÁRIOS:\nEm uma seção normal, os quatro membros da mesa (presidente, dois mesários e secretário) se alternam naturalmente. Quando um eleitor idoso tem a digital desgastada e precisa de liberação manual por ano de nascimento, qualquer um dos mesários que estiver atendendo realiza a digitação. Há uma divisão equilibrada de 20% a 30% das exceções para cada mesário.\n\n4. CADÊNCIA ESTÁVEL AO LONGO DO DIA:\nO fluxo de votos segue a rotina natural da vida civil: maior movimento pela manhã, desaceleração fisiológica no horário de almoço e ritmo estável à tarde. Não existem surtos misteriosos de votos sem fila.\n\n5. EQUIPAMENTO ORIGINAL PREVISTO:\nA urna que foi lacrada no cartório eleitoral inicia às 8h e encerra às 17h sem quebrar, sem falhas de placa e sem necessidade de substituição emergencial em campo.\n\nAGORA VEJAM A COLUNA VERMELHA: O DIAGNÓSTICO DA URNA ANÔMALA (ONDE A ELEIÇÃO FOI MANIPULADA):\n\n1. VOTAÇÃO EM ESTEIRA ROBÓTICA (INTERVALOS DE 4 A 6 SEGUNDOS):\nNo arquivo de log dessas urnas, nós encontramos votos sendo registrados consecutivamente a cada 4, 5 ou 6 segundos! Pense bem: o eleitor teria que votar, sair voando da cabine, o próximo entrar correndo e já confirmar o voto antes mesmo da tela carregar! Isso é humanamente impossível. É a prova matemática de que não havia eleitor na cabine: era um operador digitando em série na esteira robótica para inflar a urna!\n\n2. DESABAMENTO BIOMÉTRICO SEVERO (> 30% A 50% DE VOTOS MANUAIS):\nNessas seções, a biometria simplesmente despenca. Mais de 30%, 40% e até metade dos eleitores da seção 'milagrosamente' não conseguem ler a digital e têm o voto liberado manualmente por simples ano de nascimento! Ao derrubar a biometria, o operador desarma a segurança da urna e abre a brecha para votar pelos ausentes.\n\n3. MESÁRIO ÚNICO DOMINANTE (> 80% A 95% DAS LIBERAÇÕES):\nE quem digita esse ano de nascimento? O log da urna registra o CPF do operador. E nós descobrimos que em mais de 14 mil seções, um único indivíduo na mesa concentrou praticamente 100% de todas as liberações manuais! Ele assumiu o controle do terminal, afastou os colegas e operou sozinho as exceções para viabilizar os votos ilegítimos.\n\n4. SURTOS NO HORÁRIO DE ALMOÇO E RAJADAS EM SALAS VAZIAS:\nEssa inserção criminosa ocorria com hora marcada: exatamente entre 12h e 13h30, quando os fiscais de oposição saíam para almoçar e as salas ficavam vazias, o log registra uma explosão de votos manuais consecutivos! Eram rajadas de 3 a 8 votos seguidos sem nenhum eleitor na sala.\n\n5. SUBSTITUIÇÃO FÍSICA POR CONTINGÊNCIA (CEFT COM EFEITO ESPELHO):\nQuando a urna quebrava no meio do dia, o arquivo oficial CEFT comprova que quase 40 mil urnas foram trocadas às pressas. E nessas urnas trocadas ocorreu o Efeito Espelho: locais onde a oposição vencia com folga no primeiro turno tiveram o resultado invertido de forma anômala em favor de Lula no segundo turno, gerando mais de 454 mil votos excedentes!\n\nO PONTO CENTRAL DA PERÍCIA:\nNós não afirmamos que o eleitor comum fraudou a eleição. O cidadão brasileiro votou limpo em 80% das urnas. A fraude foi construída exclusivamente dentro desse bolsão de urnas anômalas. E quando a perícia expurga essas distorções mecânicas, o resultado real surge de forma inquestionável: Jair Bolsonaro reeleito em 2022 e Flávio Bolsonaro eleito em 2026!"}, {"id": 9, "titulo": "A Anatomia das Urnas Viciadas: 2018 vs 2022 vs 2026", "subtitulo": "Comparação Lado a Lado: Do Parque Homogêneo de 2018 aos Bolsões de Vício Material em 2022 e 2026", "tag": "CAPÍTULO 9 • A ANATOMIA DO VÍCIO NOS TRÊS PLEITOS", "badge_color": "rose", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- TRÊS COLUNAS LADO A LADO COMPARANDO AS URNAS NOS TRÊS PLEITOS -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 0.85rem;\">\n                \n                <!-- COLUNA 1: 2018 (PARQUE ÍNTEGRO) -->\n                <div style=\"background: rgba(16, 185, 129, 0.08); border: 2px solid #10b981; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #34d399; font-family: monospace;\">ELEIÇÕES 2018 • CONTROLE</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">ÍNDICE LIMPO</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Parque Homogêneo e Seguro\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #34d399; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: Praticamente ZERO (&lt; 0,5%)\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>Sem Disparidade de Modelos:</strong> Comportamento estatístico uniforme em todo o país;</li>\n                        <li><strong>Trocas em Campo:</strong> Menos de 0,4% (rotina técnica de bateria ou papel térmico);</li>\n                        <li><strong>Cadência Humana:</strong> Média de 48s sem esteiras robóticas ou picos no almoço;</li>\n                        <li><strong>Resultado Líquido:</strong> <strong>Jair Bolsonaro venceu com 55,13% (+10,75M votos)</strong> confirmando as pesquisas!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(16, 185, 129, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #a7f3d0; font-weight: 700; text-align: center;\">\n                        ORGANISMO SAUDÁVEL • SEM VÍCIOS\n                    </div>\n                </div>\n\n                <!-- COLUNA 2: 2022 (VÍCIO DE HARDWARE) -->\n                <div style=\"background: rgba(245, 158, 11, 0.08); border: 2px solid #f59e0b; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">ELEIÇÕES 2022 • HARDWARE</span>\n                        <span style=\"background: #f59e0b; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">279 MIL URNAS</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Modelos Antigos sem Serial\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #fbbf24; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: 59,2% de Todo o Brasil!\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>O Bug Patrimonial:</strong> Logs gravavam o código genérico repetido <code>1970225</code>;</li>\n                        <li><strong>Urnas Novas UE2020:</strong> <strong>Jair Bolsonaro venceu com 51,05% (+1,07M votos)</strong>;</li>\n                        <li><strong>Urnas Antigas Pré-2020:</strong> <strong>Lula venceu com 53,10% (+4,35M votos)</strong>;</li>\n                        <li><strong>Resultado Líquido:</strong> Toda a vitória de Lula (+2,14M) foi gerada no hardware antigo viciado!</li>\n                    </ul>\n\n                    <div style=\"background: rgba(245, 158, 11, 0.15); border-radius: 6px; padding: 5px 8px; font-size: 0.72rem; color: #fde68a; font-weight: 700; text-align: center;\">\n                        VÍCIO EXCLUSIVO NAS MÁQUINAS ANTIGAS\n                    </div>\n                </div>\n\n                <!-- COLUNA 3: 2026 (VÍCIO DE CONTINGÊNCIA E MESA) -->\n                <div style=\"background: rgba(244, 63, 94, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.2);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.72rem; font-weight: 800; color: #fb7185; font-family: monospace;\">ELEIÇÕES 2026 • CEFT E MESA</span>\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">6,4M A 15,8M</span>\n                    </div>\n\n                    <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 4px;\">\n                        Trocas CEFT e Esteira de Mesa\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #fb7185; font-weight: 800; font-family: monospace; margin-bottom: 6px;\">\n                        Urnas Viciadas: 39.652 Urnas + 18k Esteira\n                    </div>\n\n                    <ul style=\"color: #cbd5e1; font-size: 0.76rem; line-height: 1.55; padding-left: 1.1rem; margin: 0 0 8px 0;\">\n                        <li><strong>Contingência CEFT:</strong> 9,83M votos em urnas trocadas com Efeito Espelho (+454k excedentes);</li>\n                        <li><strong>Fraude de Mesa:</strong> 1,42M em esteira (< 10s), 485k no almoço e 986k de mesário único;</li>\n                        <li><strong>Porta de Entrada:</strong> 15,88M votos liber
