rência.\n\nMas atenção para a precisão matemática: em 2026, anular apenas Minas Gerais não muda o Presidente sozinho, porque a vantagem nacional de Lula foi de 4,4 milhões. Minas Gerais serve como a prova laboratorial cabal de que a máquina distorceu os votos, mas a anulação tem que ser estendida para o Brasil inteiro.\n        "}, {"id": 13, "titulo": "O Fator de Hardware: Urnas UE2020 vs Pré-2020", "subtitulo": "A Prova Material de 2022: Bolsonaro Venceu com 51,05% nas Urnas Auditáveis", "tag": "CAPÍTULO 13 • A AUDITORIA DOS MODELOS", "badge_color": "emerald", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem;\">\n                    <div style=\"font-size: 1.15rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;\">A Discrepância Sistemática por Modelo de Urna no Brasil (2022)</div>\n                    \n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1rem;\">\n                        <div style=\"background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; border-radius: 10px; padding: 1.25rem;\">\n                            <div style=\"font-size: 0.8rem; color: #34d399; font-weight: 800; text-transform: uppercase;\">URNAS UE2020 (MODELO NOVO • 193 MIL URNAS)</div>\n                            <div style=\"font-size: 1.8rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 4px 0;\">Bolsonaro 51,05%</div>\n                            <div style=\"font-size: 1.1rem; color: #94a3b8; font-weight: 700; margin-bottom: 6px;\">Lula: 48,95%</div>\n                            <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                                Log perfeito com código patrimonial individual. <strong>Jair Bolsonaro venceu por mais de +1.070.000 votos de vantagem!</strong>\n                            </div>\n                        </div>\n\n                        <div style=\"background: rgba(244, 63, 94, 0.1); border: 2px solid #f43f5e; border-radius: 10px; padding: 1.25rem;\">\n                            <div style=\"font-size: 0.8rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">URNAS PRÉ-2020 (MODELOS ANTIGOS • 279 MIL URNAS)</div>\n                            <div style=\"font-size: 1.8rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 4px 0;\">Lula 53,10%</div>\n                            <div style=\"font-size: 1.1rem; color: #94a3b8; font-weight: 700; margin-bottom: 6px;\">Bolsonaro: 46,90%</div>\n                            <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                                Cabeçalho do log gravava serial genérico repetido (1970225). <strong>Toda a vitória de Lula veio exclusivamente dessas urnas!</strong>\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"font-size: 0.85rem; color: #cbd5e1; line-height: 1.6; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem;\">\n                        • <strong>Distorção de Hardware:</strong> Em todas as 27 UFs do Brasil, o desempenho de Bolsonaro foi de 3 a 5 pontos percentuais superior nas urnas novas em comparação com as antigas do mesmo município e da mesma zona eleitoral!\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.08); border-left: 4px solid #38bdf8; padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    🏆 <strong>A Prova Material Definitiva de 2022:</strong> Nas máquinas modernas que não apresentaram bug de log, Jair Bolsonaro venceu a eleição nacional. Essa constatação técnica embasou a representação do PL perante o TSE e comprova a vulnerabilidade estrutural do hardware antigo.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Hardware UE2020 vs Antigas", "roteiro_destaques": ["Apresentar a divisão do parque de urnas de 2022: 193 mil novas vs 279 mil antigas.", "Destacar a vitória categórica de Jair Bolsonaro nas urnas novas auditáveis com 51,05%.", "Mostrar que a discrepância de 4,15 pontos foi sistemática em todo o Brasil."], "roteiro_fala": "\nEste slide traz uma das revelações mais importantes de toda a história das urnas eletrônicas no Brasil.\n\nEm 2022, o parque eleitoral brasileiro era composto por dois grupos muito distintos:\nDe um lado, 193 mil urnas modelo 2020 &mdash; equipamentos modernos, fabricados com nova tecnologia, que geravam arquivos de log com identificação patrimonial individualizada perfeita.\nDo outro lado, quase 280 mil urnas de modelos anteriores &mdash; fabricadas entre 2009 e 2015 &mdash;, que apresentavam um erro de sistema e gravavam no log o código genérico '1970225'.\n\nE qual foi o resultado dos votos em cada grupo?\nNas urnas modernas modelo 2020 &mdash; as únicas que estavam com o log 100% auditável &mdash;, Jair Bolsonaro venceu a eleição com 51,05% dos votos válidos! Ele colocou mais de um milhão e setenta mil votos de frente sobre Lula!\n\nToda a vitória de Lula no Brasil em 2022 &mdash; todos os 2,1 milhões de votos de diferença oficial &mdash; veio exclusivamente das urnas de modelos antigos que apresentaram o erro de serial no log!\n\nE essa diferença não foi isolada em um estado: em todas as 27 unidades da federação, o desempenho de Bolsonaro nas urnas novas foi de 3 a 5 pontos percentuais superior ao das urnas velhas dentro da mesma cidade e da mesma zona eleitoral. Isso é a assinatura física de um vício de hardware.\n        "}, {"id": 14, "titulo": "O Placar Reconstruído: Como Ficariam as Eleições sem Anomalias?", "subtitulo": "Em Ambos os Pleitos, a Presidência Pertence ao PL: Bolsonaro em 2022 e Flávio em 2026", "tag": "CAPÍTULO 14 • O PLACAR RECONSTRUÍDO", "badge_color": "emerald", "tempo_estimado": "3 min 00 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0.85rem;\">\n                <!-- 2022 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #10b981; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #34d399; font-family: monospace;\">ELEIÇÃO 2022 RECALCULADA</span>\n                        <span style=\"background: #10b981; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">REELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/jair_bolsonaro.jpg\" alt=\"Jair Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                JAIR BOLSONARO: <span style=\"color: #34d399;\">51,05%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #a7f3d0; font-weight: 700;\">\n                                +1.070.000 votos de vantagem sobre Lula!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor nas 193 mil urnas novas UE2020 (auditáveis).\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 50,90% (60,35M) x Bolsonaro 49,10% (58,21M);<br>\n                        • <strong>Minas Gerais 2022:</strong> Bolsonaro venceu com <strong>51,81%</strong> nas UE2020 (+21k votos de saldo sem as urnas com falha de log).\n                    </div>\n                </div>\n\n                <!-- 2026 RECALCULADA -->\n                <div style=\"background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 12px; padding: 1.15rem; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">ELEIÇÃO 2026 RECALCULADA</span>\n                        <span style=\"background: #38bdf8; color: #020617; font-size: 0.7rem; font-weight: 900; padding: 2px 8px; border-radius: 4px;\">ELEITO</span>\n                    </div>\n\n                    <!-- FOTO E RESULTADO -->\n                    <div style=\"display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;\">\n                        <img src=\"images/candidatos/flavio_bolsonaro.jpg\" alt=\"Flávio Bolsonaro\" style=\"width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);\">\n                        <div>\n                            <div style=\"font-size: 1.5rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                                FLÁVIO BOLSONARO: <span style=\"color: #38bdf8;\">51,20%</span>\n                            </div>\n                            <div style=\"font-size: 0.85rem; color: #bae6fd; font-weight: 700;\">\n                                +1.450.000 a +2.100.000 votos de vantagem!\n                            </div>\n                            <div style=\"font-size: 0.75rem; color: #94a3b8;\">\n                                Vencedor com expurgo de esteira (&lt; 10s), almoço e CEFT.\n                            </div>\n                        </div>\n                    </div>\n\n                    <div style=\"background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.45;\">\n                        • <strong>Oficial TSE:</strong> Lula 51,78% (64,05M) x Flávio 48,22% (59,65M);<br>\n                        • <strong>1º Turno:</strong> Flávio venceu (+2,38M) e manteve a liderança com divisão coerente dos 9,29M votos de 3ª via.\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.75rem 1rem; text-align: center; font-size: 0.85rem; color: #ffffff; font-weight: 800;\">\n                ⚖️ Veredito dos Dois Pleitos: Em ambas as eleições, os candidatos do PL venceram o voto legítimo das urnas. As vitórias de Lula decorreram exclusivamente das anomalias materiais e fraudes de mesa.\n            \n            <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 0.65rem 0.95rem; margin-top: 0.65rem; font-size: 0.78rem; color: #cbd5e1; line-height: 1.5; text-align: left;\">\n                💡 <strong>Por que o percentual idêntico de Flávio (51,20%) e Bolsonaro (51,05%) faz total sentido?</strong><br>\n                A convergência é sociologicamente perfeita: <strong>(1) Flávio tem menor rejeição pessoal</strong> e atraiu eleitores moderados e jovens; <strong>(2) A população e o eleitorado aumentaram</strong> em mais de 4M de votantes; e <strong>(3) A taxa de desaprovação do governo Lula cresceu expressivamente</strong> após 4 anos de mandato (2023-2026), tornando a vitória de Flávio matematicamente e politicamente natural.\n            </div>\n    \n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Placar Reconstruído", "roteiro_destaques": ["Apresentar os dois placares reconstruídos lado a lado: Jair Bolsonaro (51,05%) e Flávio Bolsonaro (51,20%).", "Explicar por que os percentuais praticamente idênticos fazem total sentido político, demográfico e eleitoral.", "Destacar os 3 fatores: menor rejeição de Flávio, crescimento da população e a alta desaprovação do governo Lula (2023-2026)."], "roteiro_fala": "Prestem muita atenção neste slide. Este é o quadro mais importante de toda a nossa investigação. Nós reconstruímos o placar pericial de como ficariam as eleições presidenciais de 2022 e de 2026 se retirarmos as anomalias materiais e as fraudes de mesa.\n\nOlhem para o lado esquerdo: a eleição de 2022.\nO TSE declarou Lula eleito por 50,9% a 49,1%. Mas quando nós auditamos as urnas modelo 2020 &mdash; as únicas que tinham o log 100% auditável &mdash;, o resultado real é: Jair Messias Bolsonaro com 51,05% dos votos contra 48,95% de Lula! Bolsonaro venceu por mais de um milhão e setenta mil votos de frente! Jair Bolsonaro teria sido reeleito Presidente da República.\n\nAgora olhem para o lado direito: a eleição de 2026.\nO TSE declarou Lula eleito com 51,78% dos votos. Mas quando nós expurgamos os votos em esteira de menos de 10 segundos, as liberações manuais por mesário único dominante, as rajadas no horário de almoço e aplicamos a coerência política da terceira via, o resultado real é: Flávio Bolsonaro com 51,20% dos votos contra 48,80% de Lula! Flávio vence por uma vantagem líquida entre 1,4 milhão e 2,1 milhões de votos!\n\nE alguém pode perguntar: 'Mas faz sentido Flávio Bolsonaro alcançar praticamente o mesmo percentual do pai, 51,20% contra 51,05%?'\nA resposta é: faz total sentido político, demográfico e sociológico!\nPrimeiro: Flávio Bolsonaro tem um perfil mais moderado, menor taxa de rejeição pessoal e conseguiu atrair eleitores de centro que não votavam no pai.\nSegundo: o eleitorado e a população brasileira aumentaram em mais de 4 milhões de pessoas entre 2022 e 2026, com forte engajamento de novos votantes para a oposição.\nE terceiro, o fator mais evidente de todos: a taxa de desaprovação do governo Lula cresceu expressivamente ao longo dos 4 anos de mandato (2023-2026). Em 2022, Lula disputou como novidade e promessa; em 2026, Lula disputou com o desgaste natural da economia, inflação e alta desaprovação popular. \n\nPortanto, pela proximidade das forças políticas do país, esse placar de 51,20% para Flávio Bolsonaro reflete com exatidão cirúrgica a vontade real do povo brasileiro!"}, {"id": 15, "titulo": "O Parecer Pericial Final &bull; A Eleição Deve Ser Anulada?", "subtitulo": "Tanto em 2022 (2,0x a margem) quanto em 2026 (1,5x a 3,6x a margem), o Vício Impõe Anulação", "tag": "CAPÍTULO 15 • O VEREDITO JURÍDICO", "badge_color": "rose", "tempo_estimado": "2 min 45 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- CARD VEREDITO DE ANULAÇÃO COM INFOGRÁFICO DE FOTOS -->\n            <div style=\"background: rgba(225, 29, 72, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.15rem 1.35rem; margin-bottom: 0.85rem; box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.3);\">\n                \n                <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.6rem;\">\n                    <div>\n                        <div style=\"font-size: 1.25rem; font-weight: 900; color: #ffffff; letter-spacing: -0.01em;\">\n                            A ELEIÇÃO PRESIDENCIAL DEVE SER ANULADA?\n                        </div>\n                        <div style=\"font-size: 0.82rem; color: #fb7185; font-weight: 700;\">\n                            SIM • HÁ SUBSTRATO MATERIAL, TÉCNICO E JURÍDICO PLENO PARA ANULAÇÃO\n                        </div>\n                    </div>\n                    <div style=\"text-align: right;\">\n                        <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 4px; font-family: monospace;\">\n                            ART. 219, 220, 222 E 224 DO CÓDIGO ELEITORAL\n                        </span>\n                    </div>\n                </div>\n\n                <!-- CONFRONTO FOTO A FOTO: QUEM VENCEU NO VOTO LIMPO VS VOTO DECLARADO -->\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.85rem;\">\n                    \n                    <!-- LADO 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem; display: flex; align-items: center; gap: 0.85rem;\">\n                        <img src=\"images/candidatos/jair_bolsonaro.jpg\" alt=\"Jair Bolsonaro\" style=\"width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid #10b981; flex-shrink: 0;\">\n                        <div style=\"flex: 1;\">\n                            <div style=\"font-size: 0.72rem; color: #34d399; font-weight: 800; font-family: monospace;\">PLEITO 2022 • VENCEDOR LEGÍTIMO</div>\n                            <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff;\">JAIR BOLSONARO: 51,05%</div>\n                            <div style=\"font-size: 0.72rem; color: #cbd5e1; line-height: 1.35; margin-top: 2px;\">\n                                Vencedor nas 193 mil urnas UE2020 (+1,07M votos). O vício de 4,35M nas urnas velhas supera a margem (2,1M) em 2x!\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- LADO 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem; display: flex; align-items: center; gap: 0.85rem;\">\n                        <img src=\"images/candidatos/flavio_bolsonaro.jpg\" alt=\"Flávio Bolsonaro\" style=\"width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid #38bdf8; flex-shrink: 0;\">\n                        <div style=\"flex: 1;\">\n                            <div style=\"font-size: 0.72rem; color: #38bdf8; font-weight: 800; font-family: monospace;\">PLEITO 2026 • VENCEDOR LEGÍTIMO</div>\n                            <div style=\"font-size: 1rem; font-weight: 900; color: #ffffff;\">FLÁVIO BOLSONARO: 51,20%</div>\n                            <div style=\"font-size: 0.72rem; color: #cbd5e1; line-height: 1.35; margin-top: 2px;\">\n                                Vencedor sem esteira (< 10s), almoço e CEFT (+1,4M a +2,1M). As fraudes (6,4M a 15,8M) superam a margem em 3,6x!\n                            </div>\n                        </div>\n                    </div>\n                </div>\n\n                <!-- INFOGRÁFICO DA BALANÇA DA LEI -->\n                \n<svg viewBox=\"0 0 240 80\" style=\"width: 100%; max-height: 60px; display: block; margin: 0 auto; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.4));\">\n    <!-- Haste e Balança Desbalanceada Indicando Excesso de Fraude -->\n    <line x1=\"120\" y1=\"10\" x2=\"120\" y2=\"70\" stroke=\"#f43f5e\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <circle cx=\"120\" cy=\"12\" r=\"4\" fill=\"#f43f5e\"/>\n    <path d=\"M60,30 L180,20\" stroke=\"#f43f5e\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    <!-- Prato Esquerdo: Margem Oficial 4,4M (Mais Leve, Mais Alto) -->\n    <line x1=\"60\" y1=\"30\" x2=\"45\" y2=\"50\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <line x1=\"60\" y1=\"30\" x2=\"75\" y2=\"50\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <path d=\"M40,50 Q60,56 80,50 Z\" fill=\"#3b82f6\"/>\n    <text x=\"35\" y=\"68\" fill=\"#60a5fa\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">MARGEM: 4,4M</text>\n    <!-- Prato Direito: Fraudes 6,4M a 15,8M (Mais Pesado, Mais Baixo) -->\n    <line x1=\"180\" y1=\"20\" x2=\"165\" y2=\"58\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <line x1=\"180\" y1=\"20\" x2=\"195\" y2=\"58\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n    <path d=\"M160,58 Q180,64 200,58 Z\" fill=\"#ef4444\"/>\n    <text x=\"145\" y=\"74\" fill=\"#fb7185\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">VÍCIOS: 6,4M a 15,8M</text>\n</svg>\n\n                \n                <div style=\"font-size: 0.8rem; color: #cbd5e1; line-height: 1.5; text-align: center; margin-top: 0.5rem; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 10px;\">\n                    ⚖️ <strong>O Princípio do Prejuízo (Art. 219 do CE):</strong> A nulidade é cogente quando o vício comprovado supera a margem de vitória. Como as fraudes apuradas (6,4M a 15,8M) superam com folga extraordinária a margem de 4,4M de Lula, <strong>a eleição presidencial de 2026 deve ser anulada pelo TSE/STF com convocação de novo pleito nacional (Art. 224 do CE)</strong>!\n                </div>\n            </div>\n\n            <!-- CARDS DE COMPETÊNCIA E CONSEQUÊNCIA JURÍDICA -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; font-size: 0.78rem; color: #94a3b8;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Jurisdição Constitucional:</strong> A auditoria entrega a prova técnica irrefutável; a decisão jurisdicional pertence privativamente aos ministros do TSE e STF (Art. 14, § 10 da CF/88).\n                </div>\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem 0.85rem;\">\n                    <strong style=\"color: #ffffff;\">Artigo 224 do Código Eleitoral:</strong> Configurada a nulidade de volume determinante sobre o resultado, a lei eleitoral impõe a realização de <strong>Nova Eleição Presidencial</strong>.\n                </div>\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Veredito de Anulação", "roteiro_destaques": ["Concluir categoricamente sobre a necessidade de anulação para ambas as eleições.", "Citar os artigos 219, 220, 222 e 224 do Código Eleitoral.", "Frisar que o volume viciado em ambos os pleitos é muito maior do que a diferença entre os candidatos."], "roteiro_fala": "Prestem muita atenção neste slide final. Ele sintetiza com clareza absoluta o veredito jurídico e pericial de toda a nossa investigação.\n\nBasta olhar para a tela para entender o caso:\nEm 2022, na eleição entre Jair Bolsonaro e Lula, a margem oficial foi de 2,1 milhões de votos. O volume de votos em urnas antigas com falha de log foi de 4,35 milhões &mdash; o dobro da margem! Nas urnas auditáveis modelo 2020, Jair Bolsonaro venceu com 51,05% dos votos e foi reeleito Presidente da República!\n\nEm 2026, na eleição entre Flávio Bolsonaro e Lula, a margem oficial foi de 4,4 milhões de votos. A soma de todas as fraudes de mesa, votos em esteira de 4 segundos e urnas trocadas atinge entre 6,4 milhões e 15,8 milhões de votos &mdash; até três vezes e meia maior que a margem! Com o expurgo dessas anomalias, Flávio Bolsonaro venceu com 51,20% dos votos e é o Presidente legitimamente eleito!\n\nVejam como tudo se encaixa: Flávio com 51,20% e Jair Bolsonaro com 51,05%. Essa estabilidade de maioria conservadora reflete perfeitamente a realidade demográfica do país, o perfil mais agregador de Flávio e o desgaste acumulado de 4 anos de alta desaprovação do governo Lula.\n\nO que diz a lei brasileira?\nO Artigo 219 do Código Eleitoral estabelece o Princípio do Prejuízo: uma eleição só pode ser anulada se o vício comprovado for suficiente para alterar o vencedor. \nE vejam o gráfico da balança no slide: os vícios comprovados pesam muito mais do que a margem oficial de vitória.\n\nPortanto, nos termos dos Artigos 220, 222 e 224 do Código Eleitoral Brasileiro, a soberania do voto foi violada. A decisão jurisdicional cabe com exclusividade ao TSE e ao STF, mas a perícia entrega aos juízes e ao povo brasileiro a prova material definitiva de que a eleição presidencial de 2026 está viciada e deve ser formalmente anulada com convocação de novo pleito no país."}, {"id": 16, "titulo": "Encerramento e Código Aberto no GitHub", "subtitulo": "Transparência Total: Todos os Arquivos e Logs de 2022 e 2026 Disponíveis para Conferência", "tag": "CAPÍTULO 16 • CONCLUSÃO E AUDITORIA ABERTA", "badge_color": "blue", "tempo_estimado": "1 min 15 s", "visual_html": "\n            <div style=\"text-align: center; padding: 1.5rem 1rem;\">\n                <div style=\"display: inline-block; padding: 6px 16px; border-radius: 9999px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; font-family: monospace; font-size: 0.85rem; font-weight: 800; margin-bottom: 1.25rem;\">\n                    🌐 AUDITORIA 100% PÚBLICA, INDEPENDENTE E REPRODUZÍVEL\n                </div>\n                <h2 style=\"font-size: 2.1rem; font-weight: 900; color: #ffffff; line-height: 1.2; margin: 0 0 1rem 0;\">\n                    A Verdade Está nos Números.<br><span style=\"color: #38bdf8;\">Confira Tudo com Seus Próprios Olhos.</span>\n                </h2>\n                <p style=\"font-size: 0.95rem; color: #94a3b8; max-width: 680px; margin: 0 auto 1.5rem auto; line-height: 1.6;\">\n                    Todos os scripts Python, decodificadores ASN.1, relatórios interativos HTML e tabelas completas de tod         let currentSlideIdx = 0;

        function renderSlide(idx) {
            currentSlideIdx = Math.max(0, Math.min(idx, SLIDES.length - 1));
            const s = SLIDES[currentSlideIdx];

            // 1. Render Slide Card
            const card = document.getElementById('slideCard');
            card.style.animation = 'none';
            card.offsetHeight; // trigger reflow
            card.style.animation = 'slideFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.15rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.85rem;">
                    <div>
                        <span style="font-size: 0.72rem; font-weight: 800; color: #38bdf8; font-family: monospace; letter-spacing: 0.05em;">${s.tag}</span>
                        <h2 style="font-size: 1.4rem; font-weight: 900; color: #ffffff; margin: 0.2rem 0 0.1rem 0; letter-spacing: -0.01em;">${s.titulo}</h2>
                        <p style="font-size: 0.82rem; color: #94a3b8; margin: 0;">${s.subtitulo}</p>
                    </div>
                    <div style="font-family: monospace; font-size: 1.25rem; font-weight: 900; color: #64748b;">
                        #${s.id < 10 ? '0' + s.id : s.id}
                    </div>
                </div>
                ${s.visual_html}
            `;

            // 2. Render Script Pane
            document.getElementById('scriptTime').textContent = s.tempo_estimado;
            const scriptBody = document.getElementById('scriptBody');
            
            let highlightsHtml = '';
            if (s.roteiro_destaques && s.roteiro_destaques.length > 0) {
                highlightsHtml = `
                    <div class="script-highlight">
                        <strong>📌 Destaques para Enfatizar:</strong>
                        <ul style="padding-left: 1.1rem; margin: 0;">
                            ${s.roteiro_destaques.map(d => `<li>${d}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            const falaParagraphs = s.roteiro_fala.trim().split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');
            scriptBody.innerHTML = `
                <div style="font-size: 0.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;">${s.roteiro_titulo}</div>
                ${highlightsHtml}
                <div style="font-size: 0.92rem; color: #e2e8f0; line-height: 1.7;">
                    ${falaParagraphs}
                </div>
            `;
            scriptBody.scrollTop = 0;

            // 3. Update Controls & Progress
            document.getElementById('slideCounter').textContent = `Slide ${s.id} de ${SLIDES.length}`;
            document.getElementById('btnPrev').disabled = (currentSlideIdx === 0);
            document.getElementById('btnNext').disabled = (currentSlideIdx === SLIDES.length - 1);
            
            const pct = ((currentSlideIdx + 1) / SLIDES.length) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function nextSlide() {
            if (currentSlideIdx < SLIDES.length - 1) {
                renderSlide(currentSlideIdx + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                renderSlide(currentSlideIdx - 1);
            }
        }

        function setMode(mode) {
            const btnSplit = document.getElementById('btnModeSplit');
            const btnFull = document.getElementById('btnModeFull');
            if (mode === 'fullscreen') {
                document.body.classList.add('mode-fullscreen');
                btnFull.classList.add('active');
                btnSplit.classList.remove('active');
            } else {
                document.body.classList.remove('mode-fullscreen');
                btnSplit.classList.add('active');
                btnFull.classList.remove('active');
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(SLIDES.length - 1);
            } else if (e.key.toLowerCase() === 't') {
                const isFull = document.body.classList.contains('mode-fullscreen');
                setMode(isFull ? 'split' : 'fullscreen');
            }
        });

        // Initialize First Slide
        renderSlide(0);
    </script>
