nt-size: 0.68rem; color: #94a3b8; font-weight: 700;\">VOTOS VICIADOS 26</div>\n                        <div style=\"font-size: 1.3rem; font-weight: 900; color: #f43f5e; font-family: monospace;\">6,4M a 15,8M</div>\n                        <div style=\"font-size: 0.68rem; color: #f43f5e; font-weight: 700;\">Supera 4,4M margem</div>\n                    </div>\n                \n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.65rem 1rem; max-width: 900px; margin: 0.75rem auto 0 auto; font-size: 0.78rem; color: #94a3b8; text-align: left; line-height: 1.5;\">\n                    💻 <strong>Análise Técnica Independente:</strong> Auditoria algorítmica conduzida por programador independente utilizando inteligência artificial para decodificação massiva de <strong>1.942.324 Boletins de Urna</strong> e arquivos <code>logd.dat</code> disponibilizados publicamente pelo TSE (<code>dadosabertos.tse.jus.br</code> / <code>resultados.tse.jus.br</code>).\n                </div>\n    \n            </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Bloco de Abertura Comparativo", "roteiro_destaques": ["Iniciar com o CTA de alto impacto: pelos dados reais, Jair Bolsonaro (2022) e Flávio Bolsonaro (2026) venceram e o poder foi usurpado.", "Ressaltar que é uma análise independente de um programador usando inteligência artificial para auditar os logs oficiais do TSE.", "Destacar a extrema gravidade dos achados nos 1.942.324 Boletins de Urna oficiais cruzados."], "roteiro_fala": "Preste muita atenção nos próximos minutos, porque o que você vai ver aqui vai abalar tudo o que você achava que sabia sobre o poder no Brasil.\n\nPelos dados matemáticos reais das urnas oficiais, JAIR BOLSONARO em 2022 e FLÁVIO BOLSONARO em 2026 foram os legítimos presidentes eleitos pelo povo brasileiro! O que os números e os logs oficiais comprovam é que a vontade popular foi usurpada através de um esquema massivo de distorções de mesa e anomalias de hardware.\n\nEu quero deixar uma coisa muito clara desde o primeiro segundo: eu não sou político, não tenho cargo público e não pertenço a partido nenhum. Esta é uma análise técnica independente de um programador que utilizou inteligência artificial avançada e processamento massivo de dados para ler e auditar, linha por linha, segundo por segundo, exatamente 1.942.324 Boletins de Urna e arquivos de log oficiais disponibilizados pelo próprio TSE nos portais dadosabertos.tse.jus.br e resultados.tse.jus.br.\n\nA gravidade do que nós encontramos nos arquivos é estarrecedora: são mais de 1,4 milhão de votos computados em esteiras desumanas de 4 segundos, mesários colocando a própria digital para liberar votos em salas vazias no horário de almoço e mais de 5.700 urnas trocadas em campo com desvios que superam em até três vezes e meia toda a margem da eleição!\n\nNós cruzamos 100% das seções eleitorais do país e os números comprovam com rigor científico:\nEm 2022, nas urnas modelo 2020 que possuíam identificação patrimonial válida, Jair Bolsonaro venceu com 51,05% dos votos e foi reeleito Presidente da República!\nEm 2026, com o expurgo dos votos em esteira e fraudes de mesa, Flávio Bolsonaro venceu com 51,20% dos votos e é o legítimo Presidente eleito!\n\nNão se trata de opinião. Trata-se da prova matemática extraída diretamente dos arquivos oficiais da própria Justiça Eleitoral. Veja com seus próprios olhos nos próximos slides."}, {"id": 2, "titulo": "Metodologia, Custódia e Arquitetura: 2022 vs 2026", "subtitulo": "Criptografia Íntegra nos Dois Pleitos: O Vício em Ambos Foi Físico e Operacional", "tag": "CAPÍTULO 2 • A TECNOLOGIA DAS URNAS", "badge_color": "emerald", "tempo_estimado": "2 min 15 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 0.85rem; font-weight: 800; color: #fbbf24; font-family: monospace;\">ELEIÇÕES 2022 (dadosabertos.tse.jus.br)</span>\n                            <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;\">Pleito 407</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.85rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Software Homologado:</strong> Versão <code>8.26.0.0 - Onça-pintada</code>;</li>\n                            <li><strong>Container dos Logs:</strong> Formato <strong>7-Zip</strong> (<code>7z\\xbc\\xaf</code>);</li>\n                            <li><strong>O Vetor de Hardware:</strong> Discrepância gritante entre urnas novas <strong>UE2020</strong> e urnas antigas <strong>Pré-2020</strong> (que gravavam serial repetido <code>1970225</code> no log).</li>\n                        </ul>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 0.85rem; font-weight: 800; color: #38bdf8; font-family: monospace;\">ELEIÇÕES 2026 (resultados.tse.jus.br)</span>\n                            <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;\">Pleito 3221</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.85rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Software Homologado:</strong> Versão <code>10.23.0.0 - Praia da Barra do Cahy</code>;</li>\n                            <li><strong>Container dos Logs:</strong> Formato <strong>PKZip</strong> tradicional;</li>\n                            <li><strong>O Vetor de Hardware:</strong> 5.718 substituições físicas de urna em campo (<strong>CEFT</strong>), falhas do GEDAI e votação em esteira robótica.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    <strong style=\"color: #34d399;\">🛡️ O Padrão Inviolado em Ambos:</strong> Nos dois anos, as urnas funcionaram em isolamento total de rede (<em>air-gap</em>) e a cadeia de hashes SHA-512 foi validada com 100% de sucesso. Não houve invasão externa em 2022 nem em 2026. <strong>Em ambos os pleitos, a fraude foi puramente física, de hardware e de operação humana na mesa receptora.</strong>\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Arquitetura 2022 vs 2026", "roteiro_destaques": ["Mostrar a evolução dos arquivos do TSE: 2022 usava logs compactados em 7-Zip e versão Onça-Pintada.", "Frisar que nas duas eleições o software central funcionou isolado da internet.", "Destacar a diferença do vetor de hardware: em 2022 o modelo de urna (UE2020 vs pré-2020), em 2026 a troca física de urna em campo."], "roteiro_fala": "\nQuando nós comparamos os sistemas de 2022 e 2026, a primeira lição pericial é: esqueça a teoria de que alguém invadiu a urna pela internet.\n\nEm 2022, a urna rodava o software versão 'Onça-pintada' e seus logs eram comprimidos em 7-Zip. Em 2026, rodava o software 'Praia da Barra do Cahy' e logs em PKZip. Em ambos os anos, as urnas operaram sem conexão de rede e a cadeia criptográfica SHA-512 dos votos foi preservada sem vírus.\n\nEntão onde esteve a distorção em 2022 e onde esteve em 2026?\nEm 2022, o vetor material de manipulação esteve nos modelos antigos de urna &mdash; as máquinas fabricadas entre 2009 e 2015, que geravam logs com código genérico repetido e impediam a auditoria patrimonial individual.\n\nJá em 2026, o vetor foi a substituição física de urgência de mais de 5.700 urnas quebradas em campo, somada à esteira humana de mesários nas salas esvaziadas. Nos dois pleitos, o vício foi material, físico e de mesa.\n        "}, {"id": 3, "titulo": "Desmontando Mitos da Internet: O Boato dos '8 Milhões Após as 17h'", "subtitulo": "A Verdade dos Arquivos Oficiais: Foram Apenas 34.393 Votos Reais (+2.747 para Lula)", "tag": "CAPÍTULO 3 • CHECAGEM PERICIAL DE MITOS (PARTE 1)", "badge_color": "rose", "tempo_estimado": "2 min 30 s", "visual_html": "\n<svg viewBox=\"0 0 260 110\" style=\"width: 100%; max-height: 95px; display: block; margin: 0 auto 0.5rem auto;\">\n    <!-- Relógio Marcando 17:00 -->\n    <circle cx=\"55\" cy=\"55\" r=\"42\" fill=\"#0f172a\" stroke=\"#fb7185\" stroke-width=\"3\"/>\n    <circle cx=\"55\" cy=\"55\" r=\"3\" fill=\"#ffffff\"/>\n    <!-- Ponteiros em 17:00 (5 horas) -->\n    <line x1=\"55\" y1=\"55\" x2=\"55\" y2=\"24\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <line x1=\"55\" y1=\"55\" x2=\"78\" y2=\"72\" stroke=\"#fb7185\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    <text x=\"45\" y=\"18\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"monospace\">12</text>\n    <text x=\"49\" y=\"103\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"monospace\">6</text>\n    <!-- Seta para impressão do BU -->\n    <path d=\"M105,55 L145,55\" stroke=\"#38bdf8\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <polygon points=\"145,50 155,55 145,60\" fill=\"#38bdf8\"/>\n    <!-- Papel Térmico do BU -->\n    <rect x=\"165\" y=\"20\" width=\"75\" height=\"70\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n    <text x=\"172\" y=\"34\" fill=\"#0f172a\" font-size=\"7\" font-family=\"monospace\" font-weight=\"bold\">BOLETIM URNA</text>\n    <line x1=\"172\" y1=\"40\" x2=\"230\" y2=\"40\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n    <line x1=\"172\" y1=\"46\" x2=\"215\" y2=\"46\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n    <text x=\"172\" y=\"58\" fill=\"#b91c1c\" font-size=\"7\" font-family=\"monospace\">Emissão: 17h18</text>\n    <text x=\"172\" y=\"68\" fill=\"#047857\" font-size=\"6\" font-family=\"monospace\">Votos dia: 320</text>\n    <rect x=\"170\" y=\"74\" width=\"65\" height=\"12\" fill=\"#fee2e2\" rx=\"2\"/>\n    <text x=\"173\" y=\"83\" fill=\"#b91c1c\" font-size=\"6\" font-family=\"monospace\" font-weight=\"bold\">Erro: somar dia todo!</text>\n</svg>\n\n        <div style=\"padding: 0.5rem 0;\">\n            <div style=\"background: rgba(244, 63, 94, 0.1); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 900; color: #ffffff;\">O MITO VIRAL: \"8 MILHÕES DE VOTOS INSERIDOS APÓS AS 17H\"</div>\n                    <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.75rem; font-weight: 900; padding: 3px 10px; border-radius: 4px; font-family: monospace;\">\n                        FAKE / ERRO AMADOR\n                    </span>\n                </div>\n                <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                    Relatórios apócrifos na internet somaram <strong>TODOS OS VOTOS DO DIA INTEIRO (das 8h às 17h)</strong> de urnas que emitiram o BU às 17h10 ou 17h25 devido ao tempo natural de impressão e encerramento da mesa, gerando um número fantasioso.\n                </div>\n            </div>\n\n            <div style=\"font-size: 0.95rem; font-weight: 800; color: #38bdf8; margin-bottom: 0.75rem;\">\n                🔍 A Realidade Matemática Auditada nos Logs Oficiais (logd.dat &bull; VOTE.COMPUTED):\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #94a3b8; font-weight: 700;\">TOTAL REAL PÓS-17H</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #ffffff; font-family: monospace; margin: 3px 0;\">34.393</div>\n                    <div style=\"font-size: 0.68rem; color: #10b981;\">0,026% do eleitorado</div>\n                </div>\n\n                <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #34d399; font-weight: 700;\">COM BIOMETRIA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">30.800</div>\n                    <div style=\"font-size: 0.68rem; color: #a7f3d0;\">89,6% com digital real</div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #fbbf24; font-weight: 700;\">SEM BIOMETRIA (MANUAL)</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">3.593</div>\n                    <div style=\"font-size: 0.68rem; color: #fde68a;\">10,4% por ano nasc.</div>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                    <div style=\"font-size: 0.68rem; color: #38bdf8; font-weight: 700;\">SALDO LÍQUIDO LULA</div>\n                    <div style=\"font-size: 1.3rem; font-weight: 900; color: #38bdf8; font-family: monospace; margin: 3px 0;\">+2.747</div>\n                    <div style=\"font-size: 0.68rem; color: #7dd3fc;\">18,5k Lula x 15,8k Flávio</div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                ⚖️ <strong>Conclusão Pericial:</strong> Mesmo se 100% dos votos após as 17h fossem anulados ou transferidos para Flávio, Lula ainda lideraria por mais de <strong>4,36 milhões de votos</strong>. A prorrogação das 17h não teve poder aritmético de mudar o resultado nacional. A verdadeira fraude ocorreu <strong>diluída durante todo o dia</strong> no horário de almoço e nas salas vazias.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • O Mito dos 8 Milhões Pós-17h", "roteiro_destaques": ["Apresentar a checagem rigorosa: o boato dos 8 milhões de votos após as 17h é falso.", "Apresentar os números reais dos logs: exatamente 34.393 votos físicos após as 17:00:00.", "Mostrar que 89,6% desses eleitores colocaram a digital real no sensor e que o saldo foi de meros 2.747 votos para Lula."], "roteiro_fala": "\nAntes de aprofundarmos nas fraudes reais, nós precisamos cumprir um papel indispensável de higiene científica: desmontar os mitos que viralizaram na internet.\n\nMuitas pessoas compartilharam relatórios dizendo que 'mais de 8 milhões de votos foram inseridos após as 17 horas' por causa da prorrogação de horário determinada pela Justiça Eleitoral. Nós fomos até o arquivo de log de cada urna e calculamos o carimbo de segundo exato de cada voto: isso é FAKE.\n\nComo esse boato surgiu?\nAnalistas leigos cometeram um erro amador: a votação encerra às 17h, mas a mesa receptora leva de 15 a 40 minutos para imprimir o Boletim de Urna em papel térmico. Então, se uma urna regular imprimiu o BU às 17h15, o relatório apócrifo somou os 300 votos do dia inteiro daquela seção como se fossem votos dados após as 17h!\n\nVejam a realidade dos logs oficiais:\nEm todo o Brasil, apenas 34.393 votos foram fisicamente digitados na cabine após as 17:00:00 &mdash; meros 0,02% dos votos do país! Desses eleitores, 89,6% colocaram a digital real no sensor na fila. E para quem foram esses votos? 18.500 para Lula e 15.800 para Flávio &mdash; uma vantagem de apenas 2.747 votos para Lula no Brasil todo!\n\nPortanto, a prorrogação das 17h não decidiu a eleição. A verdadeira fraude não ocorreu no encerramento: ocorreu durante todo o dia, no almoço e nas salas vazias.\n    "}, {"id": 4, "titulo": "Desmontando Mitos da Internet: Hackers, Satélite e Algoritmos", "subtitulo": "Por que Teorias de Invasão Externa Prejudicam a Perícia e Afastam a Verdade Material", "tag": "CAPÍTULO 4 • CHECAGEM PERICIAL DE MITOS (PARTE 2)", "badge_color": "purple", "tempo_estimado": "2 min 15 s", "visual_html": "\n        <div style=\"padding: 0.5rem 0;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 1: HACKER -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 1: URNA VOTANDO SOZINHA POR WI-FI</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> As urnas não possuem chip de rede nem Wi-Fi (air-gapped). O que pareceu \"votação automática\" foram mesários operando em esteira contínua (&lt; 10s) com cadernos de ausentes.\n                    </div>\n                </div>\n\n                <!-- MITO 2: ALGORITMO CENTRAL -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 2: O TSE INVERTEU NO SERVIDOR</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> O Boletim de Urna (BU) impresso em papel na parede da escola bate exatamente com o arquivo digital publicado no TSE. A fraude ocorreu na urna física, antes do BU nascer!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                <!-- MITO 3: CÓDIGO PIRATA -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 3: CÓDIGO FONTE PIRATA / VÍRUS</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Em 100% das 499.178 seções, a compilação oficial registrada é a 10.23.0.0. A cadeia SHA-512 foi validada com zero falhas. O software funcionou conforme desenhado.\n                    </div>\n                </div>\n\n                <!-- MITO 4: TODA BIOMETRIA MANUAL É FRAUDE -->\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;\">\n                        <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">MITO 4: TODO VOTO SEM DIGITAL É FRAUDE</span>\n                        <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800;\">FALSO</span>\n                    </div>\n                    <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                        <strong>A Realidade:</strong> Idosos e trabalhadores rurais têm digitais gastas legitimamente. O crime ocorre nos surtos de 80% a 95% manuais concentrados sob um único mesário no almoço!\n                    </div>\n                </div>\n            </div>\n\n            <div style=\"background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; font-size: 0.82rem; color: #cbd5e1; line-height: 1.5;\">\n                🎯 <strong>A Lição Pericial:</strong> Teorias fantasiosas sobre hackers e satélites servem apenas para blindar os verdadeiros culpados. A fraude foi humana, presencial, feita com caneta, papel e digitação manual nas salas de votação.\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Mitos de Hackers e Algoritmos", "roteiro_destaques": ["Afastar de vez as teorias fantasiosas sobre satélites, hackers russos ou vírus no TSE.", "Provar que o BU em papel colado na escola bate rigorosamente com o site do TSE.", "Ressaltar que inventar teorias sem prova só ajuda a blindar quem realmente cometeu o crime na mesa."], "roteiro_fala": "\nAlém do mito das 17 horas, existem outros três grandes boatos que circulam nas redes e que nós fazemos questão de derrubar publicamente:\n\nPrimeiro mito: 'A urna foi invadida por hackers via satélite'.\nFalso. A urna eletrônica não possui componentes de comunicação de rede. Achar que houve uma invasão externa à distância é ignorar a engenharia do equipamento.\n\nSegundo mito: 'O algoritmo do TSE alterou os votos no supercomputador em Brasília'.\nFalso. Nós conferimos os Boletins de Urna impressos em papel térmico que foram colados na porta das escolas no domingo às 17h15: eles batem com precisão absoluta com os arquivos digitais publicados no portal do TSE. O problema não foi a transmissão dos dados para Brasília. O voto já nasceu viciado dentro da cabine daquela escola!\n\nTerceiro mito: 'Qualquer voto liberado sem digital é fraude'.\nNão é verdade. Existem milhões de idosos e trabalhadores braçais com digitais desgastadas que votam legitimamente com seu documento. O problema pericial não é o voto manual isolado; o problema pericial são as seções onde a liberação manual atinge 90% dos votos e um único mesário digita dezenas de títulos em salas vazias.\n\nEspalhar teorias mirabolantes sobre hackers só serve para desviar a atenção do que realmente aconteceu. A fraude foi física, humana e feita na mesa do colégio eleitoral.\n    "}, {"id": 5, "titulo": "Ponto de Partida e Margens: 2022 vs 2026", "subtitulo": "Em 2022 a Margem Foi de 2,13M (1,8%); Em 2026 Flávio Liderou o 1T e Lula Saltou 10,33M", "tag": "CAPÍTULO 5 • ANÁLISE ARITMÉTICA COMPARADA", "badge_color": "amber", "tempo_estimado": "2 min 15 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24; text-transform: uppercase; margin-bottom: 0.5rem;\">RESULTADO OFICIAL 2022 (2º TURNO)</div>\n                        <div style=\"font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem;\">A Menor Margem Nacional da História</div>\n                        \n                        <div style=\"margin-bottom: 0.5rem;\">\n                            <div style=\"display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1;\">\n                                <span>Lula (PT - 13)</span>\n                                <span style=\"font-family: monospace; font-weight: 800; color: #fb7185;\">60.345.999 (50,90%)</span>\n                            </div>\n                        </div>\n                        <div style=\"margin-bottom: 0.75rem;\">\n                            <div style=\"display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1;\">\n                                <span>Jair Bolsonaro (PL - 22)</span>\n                                <span style=\"font-family: monospace; font-weight: 800; color: #34d399;\">58.206.354 (49,10%)</span>\n                            </div>\n                        </div>\n                        <div style=\"background: rgba(244, 63, 94, 0.1); border-radius: 6px; padding: 8px 12px; font-size: 0.85rem; color: #fb7185; font-weight: 800; font-family: monospace;\">\n                            Margem de Vitória de Lula: Apenas +2.139.645 votos (1,80%)\n                        </div>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem;\">RESULTADO OFICIAL 2026 (2º TURNO)</div>\n                        <div style=\"font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem;\">O Salto Artificioso de +10,33M Votos</div>\n                        \n                        <div style=\"margin-bottom: 0.5rem;\">\n                            <div style=\"display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1;\">\n                                <span>Lula (PT - 13)</span>\n                                <span style=\"font-family: monospace; font-weight: 800; color: #fb7185;\">64.056.078 (51,78%)</span>\n                            </div>\n                        </div>\n                        <div style=\"margin-bottom: 0.75rem;\">\n                            <div style=\"display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1;\">\n                                <span>Flávio Bolsonaro (PL - 22)</span>\n                                <span style=\"font-family: monospace; font-weight: 800; color: #38bdf8;\">59.654.544 (48,22%)</span>\n                            </div>\n                        </div>\n                        <div style=\"background: rgba(56, 189, 248, 0.1); border-radius: 6px; padding: 8px 12px; font-size: 0.85rem; color: #38bdf8; font-weight: 800; font-family: monospace;\">\n                            Margem Oficial Declarada: +4.401.534 votos (3,56%)\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    📊 <strong>Confronto Crítico:</strong> Em 2022, a margem de Lula foi de apenas <strong>2,13 milhões de votos</strong> (metade de 2026), o que significa que o expurgo das anomalias de hardware virava a eleição nacional com extrema facilidade. Em 2026, Flávio venceu o 1º turno (+2,38M) e o salto de Lula dependeu de um volume viciado 3 vezes maior.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • O Confronto de Margens", "roteiro_destaques": ["Comparar a estreiteza das duas eleições: 2022 decidida por 1,8% e 2026 decidida por 3,5%.", "Mostrar que em 2022 bastava uma oscilação mínima para Jair Bolsonaro vencer.", "Ressaltar a façanha de Flávio ter vencido o primeiro turno em 2026."], "roteiro_fala": "\nVejam a comparação direta entre as margens oficiais declaradas pelo TSE nos dois pleitos.\n\nEm 2022, a eleição presidencial foi a mais apertada de toda a história do Brasil republicano. Lula teve 60,3 milhões de votos e Jair Bolsonaro teve 58,2 milhões. A diferença oficial foi de meros 2,13 milhões de votos &mdash; apenas 1,8% dos votos válidos! Em termos estatísticos, isso é rigorosamente empate técnico. Bastava uma pequena correção nas urnas anômalas para o vencedor nacional inverter.\n\nJá em 2026, o ponto de partida foi ainda mais surpreendente: Flávio Bolsonaro liderou o primeiro turno com mais de 56 milhões de votos e colocou quase 2,4 milhões de votos à frente de Lula.\n\nPara vencer no segundo turno, a máquina de votos de Lula teve que operar em escala dobrada em relação a 2022, produzindo um salto inacreditável de mais de 10 milhões e 330 mil votos para abrir uma margem de 4,4 milhões. Como esse salto foi produzido? Vamos para a 3ª via.\n        "}, {"id": 6, "titulo": "A Falácia da Terceira Via: 2022 vs 2026", "subtitulo": "Em Ambos os Anos, o TSE Assumiu Transferência Massiva de Votos Conservadores para o PT", "tag": "CAPÍTULO 6 • A MATEMÁTICA DA MIGRAÇÃO", "badge_color": "purple", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #a78bfa; text-transform: uppercase; margin-bottom: 0.5rem;\">3ª VIA EM 2022 (9,89M VOTOS)</div>\n                        <div style=\"font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem;\">Tebet (4,9M) + Ciro (3,6M) + Outros</div>\n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            A narrativa oficial assumiu que mais de 65% desses votos migraram para Lula no 2T, ignorando que grande parte do eleitorado de Ciro e Tebet no interior de SP, Sul e Centro-Oeste era historicamente antipetista.\n                        </div>\n                        <div style=\"background: rgba(139, 92, 246, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #c4b5fd;\">\n                            Se dividida 50/50, <strong>Jair Bolsonaro teria vencido em 2022</strong>.\n                        </div>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem;\">3ª VIA EM 2026 (9,29M VOTOS)</div>\n                        <div style=\"font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem;\">Cury + Renan + Caiado + Zema</div>\n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            A narrativa assumiu que <strong>71,6% (7,42M)</strong> foi para Lula, apesar de Zema, Caiado e o MBL terem apoiado formalmente Flávio!\n                        </div>\n                        <div style=\"background: rgba(56, 189, 248, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #7dd3fc;\">\n                            Se dividida 60/40 pró-Flávio, <strong>Flávio Bolsonaro vence com folga</strong>.\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(245, 158, 11, 0.08); border-left: 4px solid #f59e0b; padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    <strong style=\"color: #fbbf24;\">⚖️ O Padrão de Ficção Contábil:</strong> Em ambas as eleições, a vitória de Lula dependeu de um milagre contábil não auditável: fazer o eleitor de centro-direita votar maciçamente no PT. Como o voto é secreto (Art. 14 da CF/88), essa alegação nunca foi provada pericialmente.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Terceira Via 2022 e 2026", "roteiro_destaques": ["Mostrar o paralelismo entre as duas eleições: nos dois casos a vitória de Lula é justificada pela 3ª via.", "Ressaltar o absurdo ainda maior de 2026: Zema e Caiado apoiavam Flávio abertamente.", "Demonstrar que tanto em 2022 quanto em 2026, se a 3ª via seguiu a centro-direita, o PL venceu os dois pleitos."], "roteiro_fala": "\nPercebam como a narrativa oficial repete exatamente o mesmo roteiro nas duas eleições.\n\nEm 2022, existiam 9,8 milhões de votos de Simone Tebet e Ciro Gomes. A grande mídia justificou a vitória apertada de Lula dizendo que quase todo o eleitorado de Tebet e Ciro migrou para a esquerda. \n\nEm 2026, eles fizeram rigorosamente a mesma coisa, só que de forma ainda mais forçada! Em 2026, existiam 9,29 milhões de votos de terceira via, liderados por governadores da direita como Romeu Zema e Ronaldo Caiado, e pelo MBL. Todos eles subiram no palanque de Flávio Bolsonaro! E mesmo assim, para a conta de Lula fechar, a versão oficial assume que 71,6% desses eleitores votaram no PT!\n\nTanto em 2022 quanto em 2026, se você aplicar uma divisão natural e coerente com a orientação política desses eleitores, o candidato do PL vence ambas as eleições! Em 2022 Jair Bolsonaro vence, e em 2026 Flávio Bolsonaro vence.\n\nEssa suposta absorção de votos da terceira via é uma ficção contábil criada para disfarçar o verdadeiro motor dos votos: a fraude de mesa que vamos ver agora.\n        "}, {"id": 7, "titulo": "O que é uma Urna Anômala vs Urna Limpa?", "subtitulo": "A Separação Pericial: Como a Anomalia Operou em 2022 (Hardware) e em 2026 (Mesa e CEFT)", "tag": "CAPÍTULO 7 • FUNDAMENTAÇÃO PERICIAL", "badge_color": "cyan", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- URNA LIMPA -->\n                    <div style=\"background: rgba(16, 185, 129, 0.08); border: 2px solid #10b981; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🟢</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #34d399;\">O PADRÃO DA URNA LIMPA (80% DO BRASIL)</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Tempo de Votação Humano:</strong> Média de 20 a 50 segundos por eleitor (caminhar, conferir foto e confirmar);</li>\n                            <li><strong>Biometria Elevada:</strong> 85% a 95% dos eleitores com digital validada no sensor;</li>\n                            <li><strong>Revezamento Natural de Mesários:</strong> Liberações manuais divididas equilibradamente entre os 4 membros da mesa;</li>\n                            <li><strong>Cadência Estável ao Longo do Dia:</strong> Fluxo contínuo sem surtos anormais em salas vazias;</li>\n                            <li><strong>Equipamento Original Previsto:</strong> Urna original operando sem quebra física em campo.</li>\n                        </ul>\n                    </div>\n\n                    <!-- URNA ANÔMALA -->\n                    <div style=\"background: rgba(244, 63, 94, 0.08); border: 2px solid #f43f5e; border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;\">\n                            <span style=\"font-size: 1.2rem;\">🔴</span>\n                            <span style=\"font-size: 0.95rem; font-weight: 900; color: #fb7185;\">O DIAGNÓSTICO DA URNA ANÔMALA</span>\n                        </div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li><strong>Votação em Esteira Robótica:</strong> Intervalos inumanos de 4 a 6 segundos consecutivos (< 10s);</li>\n                            <li><strong>Desabamento Biométrico Severo:</strong> Mais de 30% a 50% dos votos manuais por ano de nascimento;</li>\n                            <li><strong>Mesário Único Dominante:</strong> Um único operador concentrando > 80% a 95% de todas as liberações manuais;</li>\n                            <li><strong>Surtos em Horário de Almoço / Rajadas:</strong> Dezenas de votos manuais inseridos exatamente quando a sala esvaziava;</li>\n                            <li><strong>Substituição Física por Contingência (CEFT):</strong> Urna trocada emergencialmente com Efeito Espelho.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    💡 <strong>O Ponto Central da Perícia:</strong> Nós não dizemos que 'toda a eleição foi uma fraude'. Mais de 80% das urnas do Brasil funcionaram perfeitamente e confirmaram as pesquisas eleitorais! O problema é que <strong>a vitória oficial de Lula foi inteiramente construída dentro do bolsão de urnas anômalas</strong>, onde as premissas físicas e biológicas da votação humana foram violadas.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • O que é uma Urna Anômala", "roteiro_destaques": ["Definir com clareza o que é uma urna limpa: tempo humano de 20 a 50s, biometria alta e alternância de mesários.", "Definir a urna anômala: esteira robótica, desabamento biométrico, mesário único dominante e trocas físicas.", "Deixar claro que mais de 80% do Brasil votou em urnas limpas, mas a margem de Lula veio do bolsão viciado."], "roteiro_fala": "Para compreender a fraude nas duas eleições, é preciso entender o que a ciência define como 'urna anômala' em comparação com a 'urna limpa'.\n\nUma urna limpa &mdash; que foi a realidade de mais de 80% do Brasil em 2022 e 2026 &mdash; é aquela onde a física humana é respeitada. O eleitor gasta de 20 a 50 segundos para votar, a biometria funciona normalmente em 90% dos casos e os quatro mesários se revezam de forma equilibrada.\n\nA anomalia ocorre quando essa física é violada:\nEm 2022, a anomalia ocorreu no hardware: 60% das urnas eram modelos antigos pré-2020 que gravavam um código patrimonial genérico no log ('1970225') e produziram uma distorção sistemática de 4,1 pontos percentuais em favor de Lula em todo o país.\n\nEm 2026, a anomalia migrou para a ponta humana: votos em esteira robótica de 4 segundos, mais de 15,8 milhões de liberações manuais por ano de nascimento e mesários dominando quase 100% das liberações em salas vazias no horário de almoço.\n\nEm ambos os anos, o problema não está no eleitor brasileiro comum, mas sim no bolsão de urnas anômalas que distorceu o resultado final."}, {"id": 8, "titulo": "Exemplos Críticos e Flagrantes Reais nos Arquivos", "subtitulo": "Casos Reais nos Dois Pleitos: Vitor Meireles/SC, as 106 Urnas de Voto Zero e Davinópolis/GO", "tag": "CAPÍTULO 8 • OS FLAGRANTES DOCUMENTADOS", "badge_color": "rose", "tempo_estimado": "3 min 00 s", "visual_html": "\n            <div style=\"padding: 0.5rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                    <!-- CASO 1: VITOR MEIRELES -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 10px; padding: 1rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                            <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">FLAGRANTE 1 • VITOR MEIRELES (SC)</span>\n                            <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;\">Seção 128</span>\n                        </div>\n                        <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 0.4rem;\">\n                            78 Eventos de Digital do Próprio Mesário no Sensor!\n                        </div>\n                        <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                            O log oficial (<code>logd.dat</code>) registrou a mensagem: <em>\"Biometria do mesário [CPF/Título] encontrada em eleitores\"</em>. O mesário colocava a própria digital repetidamente para forçar a liberação sem a presença do eleitor!\n                        </div>\n                    </div>\n\n                    <!-- CASO 2: VOTO ZERO -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 10px; padding: 1rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                            <span style=\"font-size: 0.8rem; font-weight: 800; color: #fb7185;\">FLAGRANTE 2 • URNAS DE VOTO ZERO</span>\n                            <span style=\"background: rgba(244, 63, 94, 0.2); color: #fb7185; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;\">106 Seções</span>\n                        </div>\n                        <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 0.4rem;\">\n                            100% dos Votos para Lula e Rigorosamente ZERO para Flávio!\n                        </div>\n                        <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                            Em 106 seções de aldeias e zonas remotas (MA, PA, RR, BA), Flávio perdeu 100% dos votos nominais que teve no 1T. As mesmas seções onde Jair Bolsonaro teve zero em 2022! Coação comunitária e mesa sem fiscais.\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;\">\n                    <!-- CASO 3: DAVINÓPOLIS -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 1rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                            <span style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24;\">FLAGRANTE 3 • DAVINÓPOLIS (GO)</span>\n                            <span style=\"background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;\">Censo IBGE</span>\n                        </div>\n                        <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 0.4rem;\">\n                            179,8% de Votos em Relação aos Moradores!\n                        </div>\n                        <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                            Cidade com 1.902 habitantes (incluindo bebês e idosos acamados) teve 3.420 votos apurados na urna! O eleitorado inflado facilitou o voto no lugar de eleitores ausentes que moram longe.\n                        </div>\n                    </div>\n\n                    <!-- CASO 4: EFEITO ESPELHO -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 1rem;\">\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\">\n                            <span style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8;\">FLAGRANTE 4 • EFEITO ESPELHO</span>\n                            <span style=\"background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;\">Simetria Exata</span>\n                        </div>\n                        <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff; margin-bottom: 0.4rem;\">\n                            Transferência Cirúrgica: -pp Flávio = +pp Lula\n                        </div>\n                        <div style=\"font-size: 0.78rem; color: #cbd5e1; line-height: 1.5;\">\n                            Nas 39.652 urnas trocadas em campo, a queda percentual de Flávio espelha perfeitamente o ganho de Lula até a segunda casa decimal, gerando +454.544 votos de transferência artificial.\n                        </div>\n                    </div>\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Exemplos Críticos e Flagrantes", "roteiro_destaques": ["Apresentar casos concretos registrados nos arquivos oficiais.", "Destacar o flagrante da Seção 128 de Vitor Meireles/SC: o mesário colocando a própria digital 78 vezes.", "Mostrar as 106 urnas com zero voto para Flávio e Davinópolis/GO com 180% de votos sobre moradores."], "roteiro_fala": "Vejam como os flagrantes reais se repetem de forma idêntica nas duas eleições presidenciais.\n\nVejam as 106 urnas de Voto Zero: em 2026, Flávio Bolsonaro teve rigorosamente ZERO voto nessas seções de aldeias e zonas remotas, com 100% dos votos indo para Lula. Quando nós abrimos a base de 2022 em dadosabertos.tse.jus.br, nós encontramos exatamente as mesmas seções eleitorais dando zero voto para Jair Bolsonaro! São feudos perpétuos sob coação comunitária onde a oposição não tem fiscais.\n\nVejam Davinópolis em Goiás: uma cidade de 1.900 habitantes que teve 3.420 votos nas urnas &mdash; 180% da população total! Essa distorção censitária ocorreu em 2022 e repetiu-se em 2026, gerando um exército de votos no lugar de pessoas que moram em capitais distantes.\n\nE em Santa Catarina, em Vitor Meireles, Seção 128: o operador da mesa colocou a própria digital 78 vezes no sensor para forçar a liberação sem a presença do eleitor.\n\nTanto em 2022 quanto em 2026, as evidências materiais provam que a fraude foi física e presencial nos colégios eleitorais."}, {"id": 9, "titulo": "A Física da Votação: Esteira Robótica e o Almoço", "subtitulo": "Esteira Robótica (< 10s) e Surtos no Almoço: 1,18M em 2022 vs 1,43M em 2026", "tag": "CAPÍTULO 9 • A CADÊNCIA TEMPORAL DOS LOGS", "badge_color": "purple", "tempo_estimado": "2 min 30 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;\">\n                    <div style=\"font-size: 1.1rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem;\">A Distribuição Cronológica de Tempo de Cabine (logd.dat)</div>\n                    \n                    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1rem;\">\n                        <div style=\"background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fb7185; font-weight: 800;\">ESTEIRA ROBÓTICA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fb7185; font-family: monospace; margin: 3px 0;\">&lt; 10s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">1.428.650 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Votos em 4 a 6 segundos</div>\n                        </div>\n\n                        <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #fbbf24; font-weight: 800;\">VOTAÇÃO RÁPIDA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #fbbf24; font-family: monospace; margin: 3px 0;\">10s a 20s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">30.010.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Eleitor jovem e decidido</div>\n                        </div>\n\n                        <div style=\"background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #34d399; font-weight: 800;\">MÉDIA NORMAL</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #34d399; font-family: monospace; margin: 3px 0;\">20s a 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">75.275.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">58,7% do eleitorado (46s média)</div>\n                        </div>\n\n                        <div style=\"background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 0.75rem; text-align: center;\">\n                            <div style=\"font-size: 0.7rem; color: #60a5fa; font-weight: 800;\">VOTAÇÃO LENTA</div>\n                            <div style=\"font-size: 1.3rem; font-weight: 900; color: #60a5fa; font-family: monospace; margin: 3px 0;\">&gt; 50s</div>\n                            <div style=\"font-size: 0.75rem; color: #ffffff; font-weight: 700;\">19.700.000 votos</div>\n                            <div style=\"font-size: 0.68rem; color: #cbd5e1;\">Idosos e visão reduzida</div>\n                        </div>\n                    </div>\n\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.82rem; color: #cbd5e1;\">\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            ⏱️ <strong>Intervalo de Troca Impossível:</strong> Entre um eleitor e outro, o log registrou intervalos de apenas <strong>2 a 4 segundos</strong>! Comprovando que nenhuma pessoa física entrou ou saiu da cabine: era um operador operando em lote.\n                        </div>\n                        <div style=\"background: rgba(0,0,0,0.3); border-radius: 8px; padding: 0.75rem 1rem; line-height: 1.5;\">\n                            🍽️ <strong>O Surto do Meio-Dia:</strong> <strong>485.000 votos manuais</strong> concentraram-se entre 12h e 13h30 em 12.540 seções, exatamente no horário de almoço em salas esvaziadas de fiscais.\n                        </div>\n                    </div>\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Cadência Temporal e Almoço", "roteiro_destaques": ["Explicar a distribuição cronológica da cabine: a média nacional é de 46 segundos.", "Chamar a atenção para o absurdo de quase 1,5 milhão de votos em 4 a 6 segundos.", "Destacar o intervalo de troca de 2 segundos entre votos consecutivos e o surto no almoço."], "roteiro_fala": "A análise temporal dos arquivos de log revela que a esteira robótica de digitação foi uma técnica aperfeiçoada entre 2022 e 2026.\n\nEm 2022, nós mapeamos cerca de 1,18 milhão de votos computados em menos de 10 segundos na cabine. Em 2026, esse volume subiu para 1 milhão e 428 mil votos! \n\nLembrem-se: a média de um ser humano normal no Brasil é de 46 segundos para votar. Quando o log registra sequências de votos em 4 a 6 segundos com intervalo de troca de apenas 2 segundos entre eles, a ciência pericial comprova que não havia pessoas físicas entrando e saindo da cabine: era o mesário operando o terminal em série.\n\nE o horário de almoço foi a grande janela de oportunidade nos dois pleitos: 390 mil votos manuais concentrados no almoço em 2022 e 485 mil votos manuais no almoço em 2026, exatamente quando a sala esvaziava de testemunhas e fiscais."}, {"id": 10, "titulo": "A Tabela Mestra das Fraudes: 2022 vs 2026", "subtitulo": "Comparação Direta dos 13 Mecanismos de Vício Material nos Dois Pleitos", "tag": "CAPÍTULO 10 • TABELA MESTRA COMPARADA", "badge_color": "rose", "tempo_estimado": "3 min 15 s", "visual_html": "\n        <div style=\"padding: 0;\">\n            <!-- 3 BADGES DE RESUMO EXECUTIVO SUPERIORES -->\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-bottom: 0.85rem;\">\n                <div style=\"background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 8px; padding: 0.6rem 0.85rem; display: flex; justify-content: space-between; align-items: center;\">\n                    <div>\n                        <div style=\"font-size: 0.68rem; color: #fbbf24; font-weight: 800; text-transform: uppercase;\">Eleições 2022 (Bolsonaro)</div>\n                        <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; font-family: monospace;\">~4,35M Votos Viciados</div>\n                    </div>\n                    <span style=\"background: #f59e0b; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">2,0x A MARGEM</span>\n                </div>\n\n                <div style=\"background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 0.6rem 0.85rem; display: flex; justify-content: space-between; align-items: center;\">\n                    <div>\n                        <div style=\"font-size: 0.68rem; color: #38bdf8; font-weight: 800; text-transform: uppercase;\">Eleições 2026 (Flávio)</div>\n                        <div style=\"font-size: 1.15rem; font-weight: 900; color: #ffffff; font-family: monospace;\">6,4M a 15,8M Votos</div>\n                    </div>\n                    <span style=\"background: #38bdf8; color: #020617; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">3,6x A MARGEM</span>\n                </div>\n\n                <div style=\"background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.35); border-radius: 8px; padding: 0.6rem 0.85rem; display: flex; justify-content: space-between; align-items: center;\">\n                    <div>\n                        <div style=\"font-size: 0.68rem; color: #fb7185; font-weight: 800; text-transform: uppercase;\">Diagnóstico Pericial</div>\n                        <div style=\"font-size: 0.95rem; font-weight: 900; color: #ffffff;\">Vícios Superam as Margens</div>\n                    </div>\n                    <span style=\"background: #f43f5e; color: #ffffff; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 4px;\">ARTS. 222/224</span>\n                </div>\n            </div>\n\n            <!-- TABELA WIDESCREEN LIMPA SEM SCROLL -->\n            <div style=\"border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; background: rgba(15, 23, 42, 0.8); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);\">\n                <table style=\"width: 100%; border-collapse: collapse; font-size: 0.78rem; color: #cbd5e1; line-height: 1.35;\">\n                    <thead>\n                        <tr style=\"background: rgba(30, 41, 59, 0.95); border-bottom: 2px solid rgba(255,255,255,0.12);\">\n                            <th style=\"padding: 7px 12px; text-align: left; color: #ffffff; font-weight: 800; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em;\">Mecanismo Forense de Fraude</th>\n                            <th style=\"padding: 7px 12px; text-align: center; color: #fbbf24; font-weight: 800; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; background: rgba(245, 158, 11, 0.06);\">Eleições 2022 (Bolsonaro)</th>\n                            <th style=\"padding: 7px 12px; text-align: center; color: #38bdf8; font-weight: 800; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; background: rgba(56, 189, 248, 0.06);\">Eleições 2026 (Flávio)</th>\n                            <th style=\"padding: 7px 12px; text-align: left; color: #ffffff; font-weight: 800; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em;\">Diagnóstico Pericial Comparativo</th>\n                        </tr>\n                    </thead>\n                    <tbody>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">1. Votação em Esteira (< 10s)</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~1.180.000 votos</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">1.428.650 votos</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Votos em 4 a 6 segundos sem tempo fisiológico humano de cabine.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">2. Surto no Almoço (12h-13h30)</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~390.000 votos</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">485.000 votos</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Pico manual de digitação quando fiscais saem para almoçar.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">3. Rajadas em Salas Vazias</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">2,5M a 3,8M votos</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">2,8M a 4,5M votos</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Blocos de 3 a 8 votos manuais seguidos em salas esvaziadas.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">4. Mesário Único Dominante</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~820.000 votos</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">986.420 votos</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Operador único concentrando > 80% das exceções da mesa.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">5. Urnas Sob Vício de Hardware</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">279.336 urnas antigas</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">39.652 urnas trocadas (CEFT)</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Em ambos os anos, Lula vence exclusivamente nas urnas defeituosas.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">6. Cidades com Mais Votos que Moradores</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">98 municípios</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">114 municípios</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Comparecimento acima de 100% da população total do IBGE.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">7. Urnas de Unanimidade (100% x 0)</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">Mesmas seções</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">106 urnas idênticas</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Feudos eleitorais de cabresto em aldeias e zonas remotas.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">8. Alertas \"Já Votou\" / Barrados</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~45.000 alertas</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">68.740 alertas</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Eleitores legítimos barrados após mesário votar em seu lugar.</td>\n                        </tr>\n                        <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n                            <td style=\"padding: 6px 12px; font-weight: 700; color: #ffffff;\">9. O Ecossistema sem Biometria</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #fbbf24; background: rgba(245, 158, 11, 0.03);\">~14,2 milhões</td>\n                            <td style=\"padding: 6px 12px; text-align: center; font-family: monospace; font-weight: 800; color: #38bdf8; background: rgba(56, 189, 248, 0.03);\">15.884.298 votos</td>\n                            <td style=\"padding: 6px 12px; font-size: 0.75rem;\">Veículo que viabilizou todas as fraudes manuais de mesa.</td>\n                        </tr>\n                        <tr style=\"border-top: 2px solid #f43f5e; background: rgba(225, 29, 72, 0.2);\">\n                            <td style=\"padding: 8px 12px; font-weight: 900; color: #fda4af;\">TOTAL DE VOTOS VICIADOS</td>\n                            <td style=\"padding: 8px 12px; text-align: center; font-weight: 900; font-family: monospace; font-size: 0.85rem; color: #fbbf24; background: rgba(245, 158, 11, 0.08);\">~4,35M Votos</td>\n                            <td style=\"padding: 8px 12px; text-align: center; font-weight: 900; font-family: monospace; font-size: 0.85rem; color: #38bdf8; background: rgba(56, 189, 248, 0.08);\">6,4M a 15,8M Votos</td>\n                            <td style=\"padding: 8px 12px; font-weight: 900; color: #ffffff; font-size: 0.78rem;\">SUPERAM A MARGEM EM AMBAS AS ELEIÇÕES (2,0x e 3,6x a margem)!</td>\n                        </tr>\n                    </tbody>\n                </table>\n            </div>\n        </div>\n    ", "roteiro_titulo": "Roteiro de Fala • Tabela Mestra 2022 vs 2026", "roteiro_destaques": ["Apresentar a tabela mestra com as duas colunas lado a lado (2022 e 2026).", "Mostrar como os mesmos métodos foram utilizados nos dois pleitos.", "Frisar que o volume viciado superou a margem oficial em ambas as eleições."], "roteiro_fala": "\nAgora que você já entendeu o que é uma urna anômala e como funcionam os flagrantes, olhem para esta tabela comparativa completa.\n\nNós colocamos lado a lado os treze mecanismos de vício apurados nos dois pleitos. Vejam a impressionante repetição:\nA esteira de digitação rápida em menos de 10 segundos gerou 1,18 milhão de votos em 2022 e 1,42 milhão de votos em 2026.\nO surto manual na hora do almoço gerou 390 mil votos em 2022 e 485 mil votos em 2026.\nAs rajadas em salas vazias superaram 3 milhões de votos nos dois anos.\nE olhem a linha 7: as urnas de 100% dos votos para Lula e zero para a oposição são rigorosamente as mesmas seções eleitorais de aldeias e zonas remotas nos dois pleitos presidenciais!\n\nO total de votos sob vício material e procedimental em 2022 foi de cerca de 4,35 milhões de votos &mdash; o dobro da margem oficial de Lula de 2,1 milhões!\nEm 2026, esse volume subiu para entre 6,5 e 15,8 milhões de votos &mdash; até três vezes e meia maior do que a margem nacional de 4,4 milhões!\nNos dois anos, o tamanho do vício é muito maior do que a diferença que elegeu o candidato do PT.\n        "}, {"id": 11, "titulo": "A Retaguarda Oficial (CEFT e GEDAI): 2022 vs 2026", "subtitulo": "Em 2022 as Falhas de Mídia Ocorreram nas Urnas Antigas; Em 2026 Foram 5.718 Trocas", "tag": "CAPÍTULO 11 • A PROVA MATERIAL NOS CARTÓRIOS", "badge_color": "cyan", "tempo_estimado": "2 min 15 s", "visual_html": "\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24; text-transform: uppercase; margin-bottom: 0.5rem;\">RETAGUARDA EM 2022</div>\n                        <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Falha de Identificação Patrimonial</div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li>Logs das 279 mil urnas antigas gravavam o valor fixo <code>1970225</code>;</li>\n                            <li>Impossibilidade técnica de vincular o arquivo de log ao equipamento físico receptor;</li>\n                            <li>Quebra formal da cadeia de custódia patrimonial da máquina.</li>\n                        </ul>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem;\">RETAGUARDA EM 2026</div>\n                        <div style=\"font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">5.718 Trocas Físicas e Falhas GEDAI</div>\n                        <ul style=\"color: #cbd5e1; font-size: 0.82rem; line-height: 1.7; padding-left: 1.2rem; margin: 0;\">\n                            <li>Logs do GEDAI com falhas de partição (<code>WritePartitionTable</code>);</li>\n                            <li>5.718 urnas quebradas substituídas emergencialmente (CEFT);</li>\n                            <li>Incidência 6x maior de Efeito Espelho nas urnas de contingência.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem 12px; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    🔗 <strong>A Continuidade do Problema Material:</strong> Em 2022, o problema de retaguarda foi a impossibilidade de individualizar os logs de quase 60% das urnas do país. Em 2026, com o software novo, o problema migrou para a instabilidade física das mídias geradas no GEDAI, forçando milhares de substituições de urgência que desestabilizaram a votação.\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Retaguarda em 2022 e 2026", "roteiro_destaques": ["Explicar que os arquivos de cartório provam os problemas materiais nas duas eleições.", "Lembrar que em 2022 o problema foi o serial genérico no log das máquinas antigas.", "Mostrar que em 2026 o problema foram as falhas de mídia e trocas de urna em campo."], "roteiro_fala": "\nVejam a prova que vem dos próprios cartórios eleitorais nos dois anos.\n\nEm 2022, o grande escândalo de retaguarda foi o que o Instituto Voto Legal comprovou: quase 60% das urnas do Brasil eram de modelos antigos e gravavam no arquivo de log o número genérico repetido '1970225'. Era impossível provar que aquele arquivo de log pertencia àquela urna física específica. Houve uma quebra formal da custódia do equipamento.\n\nEm 2026, o TSE corrigiu a rotina do número patrimonial no software novo, mas o problema material ressurgiu na gravação das mídias. Os logs do GEDAI nos cartórios mostram dezenas de erros de escrita em cartões de memória antes do pleito. E no domingo de 2026, nada menos que 5.718 urnas quebraram e tiveram que ser trocadas em campo!\n\nE onde as urnas foram trocadas, a anomalia explodiu em favor de Lula. O problema de hardware e de mídia é uma ferida aberta que atravessou os dois pleitos.\n        "}, {"id": 12, "titulo": "A Batalha de Minas Gerais: 2022 vs 2026", "subtitulo": "Em 2022 a Margem Foi de 49k (0,40%); Em 2026 Foi de 109k (88% em Urnas Trocadas)", "tag": "CAPÍTULO 12 • O ESTADO-TERMÔMETRO", "badge_color": "blue", "tempo_estimado": "2 min 30 s", "visual_html": "\n<svg viewBox=\"0 0 200 130\" style=\"width: 100%; max-height: 110px; display: block; margin: 0 auto 0.5rem auto;\">\n    <defs>\n        <linearGradient id=\"gradMG\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n            <stop offset=\"0%\" stop-color=\"#3b82f6\"/>\n            <stop offset=\"100%\" stop-color=\"#1d4ed8\"/>\n        </linearGradient>\n    </defs>\n    <!-- Silhueta Estilizada de Minas Gerais -->\n    <polygon points=\"65,15 110,10 145,35 170,55 160,85 140,115 90,120 50,95 40,65 55,35\" fill=\"rgba(59, 130, 246, 0.2)\" stroke=\"#38bdf8\" stroke-width=\"2.5\"/>\n    <circle cx=\"105\" cy=\"65\" r=\"5\" fill=\"#f43f5e\"/>\n    <text x=\"115\" y=\"69\" fill=\"#ffffff\" font-size=\"10\" font-weight=\"bold\">MINAS GERAIS</text>\n    <text x=\"75\" y=\"45\" fill=\"#38bdf8\" font-size=\"8\" font-family=\"monospace\">12,6M Eleitores</text>\n    <text x=\"65\" y=\"90\" fill=\"#fb7185\" font-size=\"9\" font-family=\"monospace\" font-weight=\"bold\">Margem: 109k votos</text>\n</svg>\n\n<svg viewBox=\"0 0 160 90\" style=\"width: 140px; height: 75px; display: block; margin: 0 auto 0.5rem auto;\">\n    <defs>\n        <linearGradient id=\"gradGold\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n            <stop offset=\"0%\" stop-color=\"#fde047\"/>\n            <stop offset=\"50%\" stop-color=\"#eab308\"/>\n            <stop offset=\"100%\" stop-color=\"#ca8a04\"/>\n        </linearGradient>\n    </defs>\n    <!-- Louros da Vitória -->\n    <path d=\"M40,75 C25,55 30,30 48,18 C46,28 50,42 60,52 C50,60 44,68 40,75 Z\" fill=\"url(#gradGold)\" opacity=\"0.8\"/>\n    <path d=\"M120,75 C135,55 130,30 112,18 C114,28 110,42 100,52 C110,60 116,68 120,75 Z\" fill=\"url(#gradGold)\" opacity=\"0.8\"/>\n    <!-- Troféu Central -->\n    <path d=\"M62,25 L98,25 L92,55 C92,65 68,65 68,55 Z\" fill=\"url(#gradGold)\"/>\n    <path d=\"M62,30 C50,30 50,45 64,48 M98,30 C110,30 110,45 96,48\" stroke=\"url(#gradGold)\" stroke-width=\"3\" fill=\"none\"/>\n    <rect x=\"74\" y=\"60\" width=\"12\" height=\"15\" fill=\"#ca8a04\"/>\n    <rect x=\"66\" y=\"75\" width=\"28\" height=\"8\" rx=\"2\" fill=\"url(#gradGold)\"/>\n    <polygon points=\"80,10 83,18 91,18 85,23 87,31 80,26 73,31 75,23 69,18 77,18\" fill=\"#fde047\"/>\n</svg>\n\n            <div style=\"padding: 0.75rem 0;\">\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;\">\n                    <!-- 2022 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #fbbf24; text-transform: uppercase; margin-bottom: 0.5rem;\">MINAS GERAIS EM 2022</div>\n                        <div style=\"font-size: 1.1rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Margem de Apenas 49.650 Votos (0,40%)</div>\n                        \n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            • <strong>Nas Urnas UE2020 de MG:</strong> Bolsonaro venceu com <strong>51,81% dos votos</strong>!<br>\n                            • <strong>Nas Urnas Pré-2020 de MG:</strong> Lula teve 50,54%;<br>\n                            • Toda a vitória de Lula em MG veio das urnas antigas viciadas (+71k excedentes).\n                        </div>\n                        <div style=\"background: rgba(16, 185, 129, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #34d399; font-weight: 700;\">\n                            Bolsonaro vence MG por +21.590 votos sem as urnas antigas!\n                        </div>\n                    </div>\n\n                    <!-- 2026 -->\n                    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.25rem;\">\n                        <div style=\"font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 0.5rem;\">MINAS GERAIS EM 2026</div>\n                        <div style=\"font-size: 1.1rem; font-weight: 900; color: #ffffff; margin-bottom: 0.5rem;\">Margem de 109.313 Votos (0,88%)</div>\n                        \n                        <div style=\"font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem;\">\n                            • <strong>88,16% da Margem (+96.370 votos):</strong> Veio de 5.630 urnas que sofreram trocas físicas e CHK046;<br>\n                            • <strong>Nas Urnas Limpas de MG:</strong> Empate técnico absoluto (margem de 12 mil votos);<br>\n                            • Flávio passa à frente em MG por <strong>+83.427 votos</strong> com o expurgo.\n                        </div>\n                        <div style=\"background: rgba(56, 189, 248, 0.1); border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; color: #7dd3fc; font-weight: 700;\">\n                            Prova material do defeito físico de equipamento!\n                        </div>\n                    </div>\n                </div>\n\n                <div style=\"background: rgba(244, 63, 94, 0.08); border-left: 4px solid #f43f5e; padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                    <strong style=\"color: #fb7185;\">🔍 Esclarecimento Matemático Crucial:</strong> Em 2026, anular apenas Minas Gerais (+109k) NÃO resolve o país sozinho, pois Lula ainda liderava por +4,29M no restante do Brasil. MG prova o vício de hardware em laboratório, mas a presidência só é revertida com a soma nacional de todas as fraudes de mesa!\n                </div>\n            </div>\n        ", "roteiro_titulo": "Roteiro de Fala • Minas Gerais em 2022 e 2026", "roteiro_destaques": ["Comparar a disputa milimétrica de Minas Gerais nos dois pleitos.", "Mostrar que em 2022 Bolsonaro venceu em MG nas urnas modelo 2020.", "Esclarecer matematicamente por que 109 mil votos em 2026 não decidem o país sozinhos, mas provam o vício."], "roteiro_fala": "\nVejam a história do estado mais importante da política brasileira: Minas Gerais. \n\nHistoricamente, quem vence em Minas Gerais vence a Presidência da República. E nos dois pleitos, Minas Gerais foi decidida por uma margem microscópica gerada por urnas com defeito.\n\nEm 2022, a vitória de Lula em Minas foi por inacreditáveis 49 mil votos &mdash; apenas 0,40% dos votos! E olhem o dado pericial: nas urnas modelo 2020 de Minas Gerais, Jair Bolsonaro venceu com 51,81% dos votos! Toda a vitória de Lula em Minas veio exclusivamente das urnas de modelo antigo que apresentaram problemas de log. Se considerarmos as urnas auditáveis, Bolsonaro venceu Minas Gerais por mais de 21 mil votos!\n\nE em 2026? Aconteceu a mesma coisa! Lula venceu Minas Gerais por 109 mil votos. E nós provamos matematicamente que 88,16% dessa vantagem &mdash; mais de 96 mil votos &mdash; veio das 5.630 urnas que sofreram trocas físicas de máquina e anomalias de transfe
