[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urna-forense"
version = "1.0.0"
description = "Ferramenta de auditoria tecnica dos arquivos da urna eletronica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
urna-forense = "urna_forense.cli:main"
